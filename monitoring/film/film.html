<!doctype html>
<meta charset="utf-8">
<style>
@font-face{font-family:Serif4;font-weight:500;src:url(fonts/ss500.woff2)}
@font-face{font-family:Serif4;font-weight:600;src:url(fonts/ss600.woff2)}
@font-face{font-family:PlexSans;font-weight:400;src:url(fonts/ps400.woff2)}
@font-face{font-family:PlexSans;font-weight:500;src:url(fonts/ps500.woff2)}
@font-face{font-family:PlexMono;font-weight:400;src:url(fonts/pm400.woff2)}
@font-face{font-family:PlexMono;font-weight:500;src:url(fonts/pm500.woff2)}
html,body{margin:0;background:#04050c;overflow:hidden}
canvas{display:block}
</style>
<canvas id="c"></canvas>
<script src="data.js"></script>
<script>
'use strict'
const SCALE = Number(new URLSearchParams(location.search).get('scale') || 1)
const LAND = new URLSearchParams(location.search).get('layout') === 'landscape'
const W = LAND ? 1920 : 1080, H = LAND ? 1080 : 1920, FPS = 60, DURATION = 38.5
// where things sit: the disc, the heading column, the panel, the plot of scene 3 and its sample line, the list of scene 4
const L = LAND
  ? { cx: 1385, cy: 548, r: 368, hx: 96, hy: 196, hw: 770, px: 84, py: 590, pw: 900,
      plot: { x0: 900, x1: 1850, natY: 400, subY: 890, natTop: 170, subTop: 530, cell: 6, cols: 4 }, sx: 96, sy: 660,
      list: { x0: 900, x1: 1840, y0: 110, y1: 980 } }
  : { cx: 540, cy: 985, r: 445, hx: 60, hy: 196, hw: 975, px: 48, py: 1218, pw: 984,
      plot: { x0: 84, x1: 1000, natY: 960, subY: 1560, natTop: 640, subTop: 1056, cell: 7, cols: 3 }, sx: 84, sy: 520,
      list: { x0: 60, x1: 1020, y0: 560, y1: 1660 } }
const cv = document.getElementById('c'); cv.width = W * SCALE; cv.height = H * SCALE
const ctx = cv.getContext('2d')
const layer = document.createElement('canvas'); layer.width = cv.width; layer.height = cv.height
const lx = layer.getContext('2d')

// ---------- helpers
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x))
const lerp = (a, b, u) => a + (b - a) * u
const ss = (a, b, x) => { const u = clamp((x - a) / (b - a)); return u * u * (3 - 2 * u) }
const eio = (u) => { u = clamp(u); return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2 }
const eout = (u) => 1 - Math.pow(1 - clamp(u), 3)
const win = (t, a, b, fi = 0.6, fo = 0.5) => ss(a, a + fi, t) * (1 - ss(b - fo, b, t))
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) | 0; let x = Math.imul(s ^ (s >>> 15), 1 | s); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296 } }
const TAU = Math.PI * 2
const mod = (a, n) => ((a % n) + n) % n

// ---------- scene clock
// s2: the pass; s3: the pins panel, still under the same heading; s5: days since each check; s6: the official sources
const T = { s1: 0, s2: 8, s3: 15.6, s5: 22.5, s6: 30, end: DURATION }
const ARM0 = T.s2 + 0.9, ARM_DUR = 6.0            // the pass sweeps once round
const ROT = 0.02                                   // disc drift, rad/s

// ---------- layout
const CX = L.cx, CY = L.cy, R = L.r, RS = R * 1.17
const BANDS = [0.25, 0.37, 0.49, 0.615, 0.74, 0.865, 0.99]
const rnd = rng(20261112)
const C = window.CORPORA.map((r, i) => ({ i, path: r[0], sub: r[1], status: r[2], acts: r[3], pinned: r[4], newest: r[5], day: r[6], since: r[7] }))
const FIG = window.FIGURES
const HELD_PATH = 'united-states/missouri/acts'
for (const c of C) {
  c.w = 1 + Math.pow(Math.sqrt(c.acts), 0.8)
  c.n = Math.min(380, Math.round(7 + 2.1 * Math.sqrt(c.acts)))
  c.h = rnd()
  c.band = c.sub ? 3 + Math.floor(rnd() * 4) : Math.floor(rnd() * 3)
  c.held = c.path === HELD_PATH
  if (c.held) c.band = 6
}
const byBand = BANDS.map(() => [])
for (const c of C) byBand[c.band].push(c)
byBand.forEach((list, b) => {
  const tot = list.reduce((s, c) => s + c.w, 0), gap = 0.0045
  let a = -Math.PI / 2 + b * 0.37
  for (const c of list) { const span = (c.w / tot) * TAU; c.a0 = a + gap; c.a1 = a + span - gap; if (c.a1 < c.a0) c.a1 = c.a0 + 0.001; a += span }
})
// put the held corpus at lower right when the pass reaches it, so its label has room
{
  const h = C.find((c) => c.held), want = (52 * Math.PI) / 180 - ROT * 12.5, shift = want - (h.a0 + h.a1) / 2
  for (const c of byBand[h.band]) { c.a0 += shift; c.a1 += shift }
}
for (const c of C) { c.am = (c.a0 + c.a1) / 2; c.r = BANDS[c.band] * R }
// the corpus that is held before it is ever pinned waits on the source circle, lower left
const WAIT = { am: (128 * Math.PI) / 180 - ROT * 12.5, name: 'singapore-law' }

// each streak stands for several of the day's commits and lands on a corpus that really had commits in those 24 hours
const moved = new Set()
{
  // the corpora with the most commits in the 24 hours stand for the ones whose pins moved
  const pool = C.filter((c) => !c.held && c.day > 0).sort((a, b) => b.day - a.day)
  for (const c of pool.slice(0, 105)) moved.add(c.i)
  moved.add(C.find((c) => c.held).i)
}
const movedList = [...moved].map((i) => C[i])
for (const c of C) { c.moved = moved.has(c.i); c.hits = [] }
const commits = []
{
  const active = C.filter((c) => c.day > 0), wt = (c) => Math.sqrt(c.day), tot = active.reduce((s, c) => s + wt(c), 0)
  for (let k = 0; k < 692; k++) {
    let x = rnd() * tot, c = active[0]
    for (const m of active) { x -= wt(m); if (x <= 0) { c = m; break } }
    const u = k / 692, t0 = 1.5 + Math.pow(u, 0.85) * 5.3 + rnd() * 0.25
    commits.push({ c, t0, dur: 0.85 + rnd() * 0.5, off: (rnd() - 0.5) * 0.5, u: rnd(), counted: true })
  }
  // a quiet trickle afterwards so the record never looks frozen
  for (let t = 8; t < T.s5; t += 0.11 + rnd() * 0.12) {
    const c = active[Math.floor(rnd() * active.length)]
    commits.push({ c, t0: t, dur: 0.9 + rnd() * 0.5, off: (rnd() - 0.5) * 0.5, u: rnd(), counted: false })
  }
  for (const k of commits) k.c.hits.push(k.t0 + k.dur)
  commits.sort((a, b) => a.t0 - b.t0)
}
const arrivals = commits.filter((k) => k.counted).map((k) => k.t0 + k.dur).sort((a, b) => a - b)

// scene 3: each corpus moves to a cell above the number of days since its last check; never checked sits at the far right
const PLOT = L.plot, DAYS = 31, CELL = PLOT.cell, COLS = PLOT.cols
const dayX = (d) => lerp(PLOT.x0 + 16, PLOT.x1 - 96, d / DAYS)
const NEVER_X = PLOT.x1 - 30
{
  const groups = new Map()
  for (const c of [...C].sort((a, b) => (a.path < b.path ? -1 : 1))) {
    const key = c.sub + ':' + c.since
    const k = groups.get(key) || 0; groups.set(key, k + 1)
    c.tx = (c.since < 0 ? NEVER_X : dayX(c.since)) + ((k % COLS) - (COLS - 1) / 2) * CELL
    c.ty = (c.sub ? PLOT.subY : PLOT.natY) - 10 - Math.floor(k / COLS) * CELL
  }
}
const MORPH0 = T.s5 + 0.9
const morph = (c, t) => eio((t - MORPH0 - c.h * 0.9) / 1.5)
const morphAll = (t) => ss(T.s5 + 0.6, T.s5 + 1.6, t)

// particles
const P = []
for (const c of C) {
  for (let k = 0; k < c.n; k++) {
    const g = (rnd() + rnd() + rnd() - 1.5) / 1.5
    P.push({ c, u: rnd(), dr: g * R * 0.036, s: 1.1 + rnd() * rnd() * 2.1, a: 0.28 + rnd() * 0.62, ph: rnd() * TAU,
      ox: (rnd() - 0.5) * CELL * 0.62, oy: (rnd() - 0.5) * CELL * 0.62 })
  }
}
// when the pass reaches each corpus
for (const c of C) {
  const a = mod(c.am + ROT * (ARM0 + ARM_DUR / 2) + Math.PI / 2, TAU)
  c.tCheck = ARM0 + (a / TAU) * ARM_DUR
}
WAIT.tCheck = ARM0 + (mod(WAIT.am + ROT * (ARM0 + ARM_DUR / 2) + Math.PI / 2, TAU) / TAU) * ARM_DUR

// ---------- colour
const COL = {
  blueIn: [214, 226, 255], blueMid: [112, 168, 255], blueOut: [58, 112, 228],
  white: [255, 255, 255], green: [72, 214, 150], red: [255, 104, 104], amber: [255, 196, 84], grey: [128, 136, 160],
}
const mix = (a, b, u) => [lerp(a[0], b[0], u), lerp(a[1], b[1], u), lerp(a[2], b[2], u)]
function baseCol(c) {
  const u = c.band / 6
  const k = u < 0.4 ? mix(COL.blueIn, COL.blueMid, u / 0.4) : mix(COL.blueMid, COL.blueOut, (u - 0.4) / 0.6)
  return mix(k, [k[0] * 0.8, k[1] * 0.9, 255], c.h * 0.5)
}
for (const c of C) c.base = baseCol(c)
const STATUS_COL = [COL.green, COL.amber, COL.grey, COL.white]

function corpusLook(c, t) {
  let col = c.base, gain = 1
  // commits landing
  let fl = 0
  for (const h of c.hits) { if (h <= t && t - h < 1.2) fl = Math.max(fl, Math.exp(-(t - h) * 3.5)) }
  // waiting for the pass in scene 2
  if (c.moved) {
    const wait = ss(T.s2 - 1, T.s2 + 0.5, t) * (1 - ss(c.tCheck - 0.05, c.tCheck + 0.1, t))
    col = mix(col, COL.white, 0.45 * wait); gain += 0.5 * wait
    const dt = t - c.tCheck
    if (dt > 0) {
      const out = 1 - ss(T.s5 - 0.8, T.s5 + 0.4, t)
      if (c.held) {
        const keep = 1 - ss(T.s5 - 0.6, T.s5 + 0.4, t)
        const amt = keep * (0.85 + 0.15 * Math.sin(t * 5))
        col = mix(col, COL.red, amt); gain += keep * (1.1 + 1.2 * Math.exp(-dt * 2))
      } else {
        const amt = out * (0.55 + 0.45 * Math.exp(-dt * 1.6))
        col = mix(col, COL.green, amt); gain += out * 1.4 * Math.exp(-dt * 2.2)
      }
    }
  }
  // freshness in scene 5
  const m = morph(c, t)
  if (m > 0) { col = mix(col, STATUS_COL[c.status], m * 0.95); gain = lerp(gain, 1, m) }
  col = mix(col, COL.white, fl * 0.7); gain += fl * 1.3
  return { col, gain, m }
}

// ---------- drawing
const noise = document.createElement('canvas'); noise.width = W; noise.height = H
{ const n = noise.getContext('2d'), im = n.createImageData(W, H), r = rng(7)
  for (let i = 0; i < im.data.length; i += 4) { const v = r() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 6 }
  n.putImageData(im, 0, 0) }

function discAlpha(t) {
  const build = 1
  const end = 1 - ss(T.s6 - 0.5, T.s6 + 0.4, t)
  const panel = 1 - 0.3 * win(t, T.s3 + 0.2, T.s5 - 0.1, 0.8, 0.6)
  return build * end * panel
}
const rot = (t) => ROT * t
function reveal(ang, t) { // sector sweep that builds the record
  const a = mod(ang + Math.PI / 2, TAU) / TAU
  return ss(0, 0.08, eio((t - 0.5) / 3.0) * 1.1 - a)
}

function drawDisc(g, t) {
  const ro = rot(t), dA = discAlpha(t), ring = 1 - morphAll(t)
  g.globalCompositeOperation = 'lighter'
  // source circle
  for (const c of C) {
    const rv = reveal(c.am, t); if (rv <= 0) continue
    const a = c.am + ro
    g.globalAlpha = 0.16 * rv * dA * ring
    g.fillStyle = '#9fb6ff'
    g.fillRect(CX + Math.cos(a) * RS - 0.8, CY + Math.sin(a) * RS - 0.8, 1.6, 1.6)
  }
  // corpora
  let last = null, look = null, rv = 0
  for (const p of P) {
    const c = p.c
    if (c !== last) {
      last = c; look = corpusLook(c, t); rv = reveal(c.am, t)
      g.fillStyle = `rgb(${look.col[0] | 0},${look.col[1] | 0},${look.col[2] | 0})`
    }
    if (rv <= 0) continue
    const a = lerp(c.a0, c.a1, p.u) + ro
    const r = c.r + p.dr + Math.sin(t * 0.7 + p.ph) * 1.6
    let al = p.a * look.gain * rv * dA * (0.82 + 0.18 * Math.sin(t * 1.3 + p.ph * 3))
    let x = CX + Math.cos(a) * r, y = CY + Math.sin(a) * r, s = p.s * (al > 1 ? Math.min(1.5, Math.sqrt(al)) : 1)
    const m = look.m
    if (m > 0) { // gather into the corpus's cell; many dots share it, so each one is fainter there
      x = lerp(x, c.tx + p.ox, m); y = lerp(y, c.ty + p.oy, m); s = lerp(s, CELL * 0.4, m)
      al = lerp(al, Math.min(0.9, 9 / c.n) * dA, m)
    }
    g.globalAlpha = Math.min(1, al)
    g.fillRect(x - s / 2, y - s / 2, s, s)
  }
  // commits travelling in from their official source
  for (const k of commits) {
    if (k.t0 > t) break
    const u = (t - k.t0) / k.dur; if (u >= 1) continue
    const c = k.c, tr = c.r + (k.u - 0.5) * R * 0.05
    for (let j = 0; j < 24; j++) {
      const uu = u - j * 0.011; if (uu < 0) break
      const e = eio(uu), rr = lerp(RS, tr, e), a = c.am + ro + k.off * (1 - e) * (1 - e)
      g.globalAlpha = (j === 0 ? 1 : 0.6 * (1 - j / 24)) * dA * ring * Math.min(1, uu * 8)
      g.fillStyle = j === 0 ? '#ffffff' : '#8fe6ff'
      const s = j === 0 ? 4 : 2.8 - j * 0.07
      g.fillRect(CX + Math.cos(a) * rr - s / 2, CY + Math.sin(a) * rr - s / 2, s, s)
    }
  }
  // the corpus held before its first pin, waiting on the source circle
  {
    const on = ss(T.s2 - 0.5, T.s2 + 0.6, t) * (1 - ss(T.s5 - 0.6, T.s5 + 0.4, t))
    if (on > 0) {
      const a = WAIT.am + ro, x = CX + Math.cos(a) * RS, y = CY + Math.sin(a) * RS
      const isRed = ss(WAIT.tCheck - 0.05, WAIT.tCheck + 0.15, t)
      const col = mix(COL.white, COL.red, isRed), r2 = rng(99)
      g.fillStyle = `rgb(${col[0] | 0},${col[1] | 0},${col[2] | 0})`
      for (let j = 0; j < 46; j++) {
        const rr = Math.sqrt(r2()) * 11, th = r2() * TAU + t * 0.4
        g.globalAlpha = on * dA * ring * (0.5 + 0.5 * r2()) * (1 + isRed * 0.3 * Math.sin(t * 5))
        g.fillRect(x + Math.cos(th) * rr - 1, y + Math.sin(th) * rr - 1, 2, 2)
      }
    }
  }
  g.globalAlpha = 1
  g.globalCompositeOperation = 'source-over'
}

function drawArm(g, t) {
  const u = (t - ARM0) / ARM_DUR
  const al = ss(-0.06, 0.02, u) * (1 - ss(0.98, 1.08, u)) * discAlpha(t)
  if (al <= 0) return
  const a = -Math.PI / 2 + clamp(u, 0, 1.08) * TAU
  g.save(); g.translate(CX, CY); g.rotate(a)
  const cg = g.createConicGradient(0, 0, 0)
  cg.addColorStop(0, 'rgba(150,200,255,0)'); cg.addColorStop(0.82, 'rgba(150,200,255,0)')
  cg.addColorStop(0.985, 'rgba(150,205,255,0.10)'); cg.addColorStop(1, 'rgba(210,235,255,0.26)')
  g.globalAlpha = al; g.fillStyle = cg
  g.beginPath(); g.arc(0, 0, RS + 8, 0, TAU); g.arc(0, 0, R * 0.17, 0, TAU, true); g.fill('evenodd')
  g.strokeStyle = 'rgba(225,240,255,0.85)'; g.lineWidth = 1.5
  g.beginPath(); g.moveTo(R * 0.17, 0); g.lineTo(RS + 8, 0); g.stroke()
  g.restore(); g.globalAlpha = 1
}

// ---------- text
const F = {
  title: '500 52px Serif4', sub: '400 29px PlexSans', num: '600 40px Serif4', lab: '400 22px PlexMono',
  mono: '400 24px PlexMono', monoS: '400 20px PlexMono', sans: '400 26px PlexSans', sansM: '500 28px PlexSans', sansS: '400 22px PlexSans',
}
const INK = '#f3f5fa', SUBINK = '#a9afc2', DIM = '#7d8499'
function wrap(g, text, font, maxW) {
  g.font = font; const out = []; let line = ''
  for (const w of text.split(' ')) { const tr = line ? line + ' ' + w : w; if (g.measureText(tr).width > maxW && line) { out.push(line); line = w } else line = tr }
  if (line) out.push(line); return out
}
function text(g, s, x, y, font, color, alpha = 1, align = 'left') {
  if (alpha <= 0) return 0
  g.font = font; g.fillStyle = color; g.globalAlpha = alpha; g.textAlign = align; g.textBaseline = 'alphabetic'
  g.fillText(s, x, y); const w = g.measureText(s).width; g.globalAlpha = 1; g.textAlign = 'left'; return w
}
const fmt = (n) => Math.round(n).toLocaleString('en-US')

const SCENES = [
  { a: T.s1, b: T.s2, title: 'Every change in the law is a commit',
    sub: 'Each country’s pipeline reads its official source and publishes each change as a commit, dated the day it takes effect.',
    stats: (t) => [[fmt(982 * eio((t - 0.5) / 3.0)), 'corpora', null, '982'], [fmt(FIG.total_commits * eio((t - 0.5) / 3.6)), 'commits', null, fmt(FIG.total_commits)], [fmt(FIG.commits_in_window * arrivals.filter((x) => x <= t).length / arrivals.length), 'in 24 hours', null, fmt(FIG.commits_in_window)]] },
  { a: T.s2, b: T.s5, title: 'Every commit is pinned to real legislation. Live.',
    sub: 'Every 15 minutes a pass checks each new commit. One that fails is held back.',
    stats: (t) => {
      const ok = movedList.filter((c) => !c.held && c.tCheck <= t).length
      const held = (C.find((c) => c.held).tCheck <= t ? 1 : 0) + (WAIT.tCheck <= t ? 1 : 0)
      return [[fmt(ok), 'corpora updated', '#6fe0a8'], [fmt(held), 'held back', '#ff7676']]
    } },
  { a: T.s5, b: T.s6, title: 'Every corpus knows how current it is',
    sub: 'Each corpus records the day it was last checked against its official source and the day its next check is due.',
    stats: () => [['7', 'days for national law'], ['30', 'days for a state or city']] },
  { a: T.s6, b: T.end - 0.55, title: 'Every commit always pins to a live official source',
    sub: 'Each corpus is read from its country’s official publisher and checked against it on a schedule.',
    stats: (t) => { const u = eio((t - T.s6 - 0.7) / 1.6); return [[fmt(window.SOURCE_COUNT * u), 'official sources', null, fmt(window.SOURCE_COUNT)], [fmt(982 * u), 'corpora', null, '982']] },
    foot: 'github.com/lexifina/global-law' },
]
function drawHeader(g, t) {
  for (const s of SCENES) {
    const al = win(t, s.a + 0.15, s.b + 0.05, 0.7, 0.5); if (al <= 0) continue
    const dy = (1 - eout((t - s.a - 0.15) / 0.9)) * 14
    let y = L.hy + dy
    for (const l of wrap(g, s.title, F.title, L.hw)) { text(g, l, L.hx, y, F.title, INK, al); y += 62 }
    y -= 14
    const al2 = al * ss(s.a + 0.35, s.a + 1.0, t)
    for (const l of wrap(g, s.sub, F.sub, L.hw - 20)) { text(g, l, L.hx, y, F.sub, SUBINK, al2); y += 41 }
    if (s.stats) {
      y += 46; let x = L.hx
      const al3 = al * ss(s.a + 0.6, s.a + 1.3, t)
      s.stats(t).forEach(([n, lab, col, wide], i) => {
        g.font = F.num; const wn = g.measureText(wide || n).width
        g.font = F.lab; const need = wn + 12 + g.measureText(lab).width + (i ? 46 : 0)
        if (i && x + need > L.hx + L.hw) { x = L.hx; y += 58 } // the row wraps where the column is narrow
        else if (i) { text(g, '·', x + 16, y - 4, F.lab, DIM, al3 * 0.7); x += 46 }
        text(g, n, x, y, F.num, col || INK, al3); g.font = F.num; x += g.measureText(wide || n).width + 12
        x += text(g, lab, x, y - 3, F.lab, DIM, al3)
      })
    }
    if (s.foot) text(g, s.foot, L.hx, y + 84, F.mono, DIM, al * ss(s.a + 2.2, s.a + 3.0, t))
  }
}

function label(g, t, am, r0, name, tOn, alignRight) {
  const al = ss(tOn + 0.1, tOn + 0.6, t) * (1 - ss(T.s3 - 0.6, T.s3 - 0.1, t)); if (al <= 0) return
  const a = am + rot(t), x0 = CX + Math.cos(a) * (r0 + 16), y0 = CY + Math.sin(a) * (r0 + 16)
  const x1 = CX + Math.cos(a) * (RS + 62), y1 = CY + Math.sin(a) * (RS + 62)
  const k = eout((t - tOn - 0.1) / 0.6)
  g.globalAlpha = al * 0.75; g.strokeStyle = '#ff7676'; g.lineWidth = 1.2
  g.beginPath(); g.moveTo(x0, y0); g.lineTo(lerp(x0, x1, k), lerp(y0, y1, k)); g.stroke(); g.globalAlpha = 1
  const al2 = al * ss(tOn + 0.45, tOn + 0.9, t)
  text(g, name, alignRight ? Math.min(W - 56, x1 + 150) : Math.max(56, x1 - 96), y1 + 34, F.mono, '#ff8a8a', al2, alignRight ? 'right' : 'left')
}

function panel(g, al, y, h) {
  g.globalAlpha = al
  g.fillStyle = 'rgba(11,14,28,0.93)'; g.strokeStyle = 'rgba(150,170,230,0.16)'; g.lineWidth = 1
  g.beginPath(); g.roundRect(L.px, y, L.pw, h, 18); g.fill(); g.stroke(); g.globalAlpha = 1
}

// scene 2, second half: three real corpora, their commits and their pins
const TRACKS = [
  { name: 'albania/national/acts', sha: C.find((c) => c.path === 'albania/national/acts').pinned, add: 2, bad: false },
  { name: 'united-states/federal/usc', sha: C.find((c) => c.path === 'united-states/federal/usc').pinned, add: 1, bad: false },
  { name: HELD_PATH, sha: C.find((c) => c.held).pinned, add: 1, bad: true, badSha: C.find((c) => c.held).newest },
]
function drawPins(g, t) {
  const al = win(t, T.s3 + 0.5, T.s5 - 0.05, 0.7, 0.5); if (al <= 0) return
  const y0 = L.py + (1 - eout((t - T.s3 - 0.5) / 0.9)) * 18
  panel(g, al, y0, 424)
  TRACKS.forEach((tr, i) => {
    const ty = y0 + 62 + i * 128, tb = T.s3 + 1.3 + i * 0.75
    const ra = al * ss(tb - 0.5, tb, t)
    text(g, tr.name, L.px + 40, ty, F.mono, '#cfd5e6', ra)
    const lx0 = L.px + 48, lx1 = L.px + L.pw - 48, ly = ty + 44, n = 7, old = n - 1 - tr.add
    const X = (j) => lerp(lx0, lx1, j / (n - 1))
    g.globalAlpha = ra * 0.35; g.strokeStyle = '#8c9bd0'; g.lineWidth = 1.5
    g.beginPath(); g.moveTo(lx0, ly); g.lineTo(lx1, ly); g.stroke()
    for (let j = 0; j < n; j++) {
      const isNew = j > old, tj = tb + 0.25 + (j - old) * 0.38
      const on = isNew ? eout((t - tj) / 0.35) : 1
      if (on <= 0) continue
      const bad = tr.bad && j === n - 1
      const pop = isNew ? Math.exp(-Math.max(0, t - tj) * 5) : 0
      g.globalAlpha = ra * on * (isNew ? 1 : 0.55)
      g.fillStyle = bad ? '#ff6f6f' : isNew ? '#eaf3ff' : '#7f93d6'
      g.beginPath(); g.arc(X(j), ly, (isNew ? 6.5 : 5) + pop * 5, 0, TAU); g.fill()
    }
    // pin
    const tm = tb + 0.25 + tr.add * 0.38 + 0.55
    const to = tr.bad ? old : n - 1
    const k = tr.bad ? 0 : eio((t - tm) / 0.9)
    const px = lerp(X(old), X(to), k)
    const pc = tr.bad ? '#ffb3b3' : mix([255, 255, 255], COL.green, k)
    g.globalAlpha = ra; g.strokeStyle = tr.bad ? pc : `rgb(${pc[0] | 0},${pc[1] | 0},${pc[2] | 0})`; g.lineWidth = 2.5
    g.beginPath(); g.arc(px, ly, 13, 0, TAU); g.stroke()
    g.beginPath(); g.moveTo(px, ly + 13); g.lineTo(px, ly + 24); g.stroke()
    const shaAl = ra * (tr.bad ? 1 : ss(tm + 0.75, tm + 1.1, t))
    text(g, 'pinned ' + tr.sha, Math.min(px, lx1), ly + 50, F.monoS, tr.bad ? '#cfd5e6' : '#6fe0a8', shaAl, 'right')
    if (tr.bad) {
      const ba = ra * ss(tm - 0.2, tm + 0.3, t)
      text(g, 'held back', lx1, ly + 50, F.monoS, '#ff8a8a', ba, 'right')
    }
  })
}

// scene 3: the two rows, the day each check falls due, and three real corpora read out one after another
const SAMPLES = [
  { path: 'albania/national/acts', checked: '11 November', due: '18 November', word: 'current', col: '#6fe0a8' },
  { path: 'austria/bund/acts', checked: '28 October', due: '4 November', word: 'stale', col: '#ffc454' },
  { path: 'brazil/bahia/acts', checked: '30 October', due: '29 November', word: 'current', col: '#6fe0a8' },
].map((s) => ({ ...s, c: C.find((c) => c.path === s.path) }))
function drawPlot(g, t) {
  const al = win(t, T.s5 + 1.7, T.s6 + 0.05, 0.8, 0.5); if (al <= 0) return
  const rowsDef = [[PLOT.natY, PLOT.natTop, 'National law', 7], [PLOT.subY, PLOT.subTop, 'States and cities', 30]]
  for (const [by, top, name, limit] of rowsDef) {
    text(g, name, PLOT.x0, top, F.sansM, INK, al)
    g.globalAlpha = al * 0.4; g.strokeStyle = '#8c9bd0'; g.lineWidth = 1.2
    g.beginPath(); g.moveTo(PLOT.x0, by); g.lineTo(PLOT.x1, by); g.stroke()
    // the day the next check falls due
    const lx = dayX(limit + 0.5)
    g.globalAlpha = al * 0.75; g.strokeStyle = '#ffc454'; g.setLineDash([5, 6])
    g.beginPath(); g.moveTo(lx, by); g.lineTo(lx, top + 26); g.stroke(); g.setLineDash([]); g.globalAlpha = 1
    text(g, `due after ${limit} days`, limit > 20 ? lx - 12 : lx + 12, top + 44, F.monoS, '#ffc454', al, limit > 20 ? 'right' : 'left')
    for (const d of [0, 7, 14, 21, 28]) text(g, String(d), dayX(d), by + 30, F.monoS, DIM, al, 'center')
    text(g, 'never', NEVER_X, by + 30, F.monoS, DIM, al, 'center')
  }
  text(g, 'days since the last check', PLOT.x0, PLOT.subY + 74, F.sansS, SUBINK, al)
  SAMPLES.forEach((s, i) => {
    const t0 = T.s5 + 3.0 + i * 1.25, a = al * win(t, t0, t0 + 1.25, 0.3, 0.3); if (a <= 0) return
    const k = eout((t - t0) / 0.5)
    g.globalAlpha = a; g.strokeStyle = s.col; g.lineWidth = 2.5
    g.beginPath(); g.arc(s.c.tx, s.c.ty, lerp(34, 14, k), 0, TAU); g.stroke(); g.globalAlpha = 1
    text(g, s.path, L.sx, L.sy, F.mono, '#e6ebf7', a)
    let x = L.sx
    x += text(g, `last checked ${s.checked}, next check due ${s.due}`, x, L.sy + 42, F.sans, SUBINK, a) + 18
    g.globalAlpha = a; g.fillStyle = s.col; g.beginPath(); g.arc(x + 6, L.sy + 33, 6, 0, TAU); g.fill(); g.globalAlpha = 1
    text(g, s.word, x + 22, L.sy + 42, F.sans, s.col, a)
  })
}

// scene 4: official sources by name, each joined to the corpus read from it; the list rolls upward without stopping
const SRC = window.SOURCES, ROW = 52, ROLL = 88 // px per row, px per second
function drawSources(g, t) {
  const al = ss(T.s6 + 0.3, T.s6 + 1.1, t) * (1 - ss(T.end - 1.0, T.end - 0.3, t)); if (al <= 0) return
  const B = L.list, tt = t - T.s6
  g.font = F.sansM
  for (let i = 0; i < SRC.length; i++) {
    const y = B.y0 + 150 + i * ROW - tt * ROLL
    if (y < B.y0 - 10 || y > B.y1 + 10) continue
    const edge = ss(B.y0, B.y0 + 150, y) * (1 - ss(B.y1 - 110, B.y1, y))  // rows fade in at the bottom and out at the top
    const a = al * edge; if (a <= 0.004) continue
    const [name, path] = SRC[i]
    // a row is pinned when it clears the bottom fade; the rows on screen at the start are pinned one after another
    const tin = Math.min((B.y1 - 150 - y) / ROLL, tt - 0.6 - i * 0.09)
    const k = eio(tin / 0.7)
    // the pin
    const pc = mix([255, 255, 255], COL.green, k)
    g.globalAlpha = a; g.strokeStyle = `rgb(${pc[0] | 0},${pc[1] | 0},${pc[2] | 0})`; g.fillStyle = g.strokeStyle; g.lineWidth = 2
    g.beginPath(); g.arc(B.x0 + 10, y - 9, 8, 0, TAU); g.stroke()
    g.globalAlpha = a * k; g.beginPath(); g.arc(B.x0 + 10, y - 9, 3.6, 0, TAU); g.fill(); g.globalAlpha = 1
    const wn = text(g, name, B.x0 + 36, y, F.sansM, INK, a)
    g.font = F.monoS; const wp = g.measureText(path).width
    text(g, path, B.x1, y - 1, F.monoS, '#8e96ad', a * (0.35 + 0.65 * k), 'right')
    // the line from the source to its corpus, drawn as the row is pinned, with a light that keeps running along it
    const xa = B.x0 + 36 + wn + 16, xb = B.x1 - wp - 16
    if (xb > xa + 20) {
      g.globalAlpha = a * 0.34; g.strokeStyle = '#8c9bd0'; g.lineWidth = 1.2
      g.beginPath(); g.moveTo(xa, y - 8); g.lineTo(lerp(xa, xb, k), y - 8); g.stroke()
      const ph = mod(tin * 0.55 + (i % 7) * 0.143, 1)
      if (k >= 1) {
        const px = lerp(xa, xb, eio(ph)), glow = Math.sin(ph * Math.PI)
        g.globalAlpha = a * glow; g.fillStyle = '#bfe8ff'
        g.beginPath(); g.roundRect(px - 9, y - 9.5, 18, 3, 1.5); g.fill()
      }
      g.globalAlpha = 1
    }
  }
}

function render(frame) {
  const t = frame / FPS
  // light layer
  lx.setTransform(1, 0, 0, 1, 0, 0); lx.clearRect(0, 0, layer.width, layer.height); lx.setTransform(SCALE, 0, 0, SCALE, 0, 0)
  drawDisc(lx, t); drawArm(lx, t)
  // frame
  const g = ctx
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.filter = 'none'
  g.fillStyle = '#04050c'; g.fillRect(0, 0, cv.width, cv.height)
  g.setTransform(SCALE, 0, 0, SCALE, 0, 0)
  const neb = g.createRadialGradient(CX, CY, 0, CX, CY, 900)
  const na = 0.5 + 0.5 * discAlpha(t)
  neb.addColorStop(0, `rgba(30,52,130,${0.20 * na})`); neb.addColorStop(0.45, `rgba(18,30,84,${0.11 * na})`); neb.addColorStop(1, 'rgba(4,5,12,0)')
  g.fillStyle = neb; g.fillRect(0, 0, W, H)
  g.imageSmoothingEnabled = false; g.drawImage(noise, 0, 0, W, H); g.imageSmoothingEnabled = true
  g.setTransform(1, 0, 0, 1, 0, 0)
  g.globalCompositeOperation = 'lighter'
  g.filter = `blur(${18 * SCALE}px)`; g.globalAlpha = 0.5; g.drawImage(layer, 0, 0)
  g.filter = `blur(${4 * SCALE}px)`; g.globalAlpha = 0.45; g.drawImage(layer, 0, 0)
  g.filter = 'none'; g.globalAlpha = 1; g.drawImage(layer, 0, 0)
  g.globalCompositeOperation = 'source-over'
  g.setTransform(SCALE, 0, 0, SCALE, 0, 0)
  label(g, t, C.find((c) => c.held).am, C.find((c) => c.held).r, 'united-states-missouri-law', C.find((c) => c.held).tCheck, true)
  label(g, t, WAIT.am, RS, WAIT.name, WAIT.tCheck, false)
  drawPins(g, t); drawPlot(g, t); drawSources(g, t); drawHeader(g, t)
  // open and close on the page colour
  const fade = 1 - ss(0, 0.5, t) + ss(T.end - 0.5, T.end - 0.05, t)
  if (fade > 0) { g.globalAlpha = Math.min(1, fade); g.fillStyle = '#04050c'; g.fillRect(0, 0, W, H); g.globalAlpha = 1 }
}
window.render = render
window.FILM = { FPS, DURATION, W, H }
window.ready = Promise.all(Object.values(F).concat(['500 64px Serif4', '400 30px PlexMono']).map((f) => document.fonts.load(f))).then(() => document.fonts.ready).then(() => render(0))
</script>
