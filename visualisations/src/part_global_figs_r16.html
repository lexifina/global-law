
  <figure id="calendar-strip">

    <div class="plot"><svg id="f-cst" role="img" aria-label="Day-of-year strips of in-force dates per jurisdiction"></svg></div>
    <p class="src">One row per jurisdiction with at least 100 dated acts, one column per calendar day (1 January to 31 December). Darker cells hold a larger share of that jurisdiction's acts. Each row is scaled to its own busiest day.</p>

  <figure id="top-dates">
