<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seventeen Countries, One at a Time</title>
<meta name="description" content="What seventeen pages of twenty charts each, one per country and each drawn from its own repository, found when their findings are set side by side.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<style>
:root {
  color-scheme: light;
  --bg: #f7f6f3; --surface: #fcfcfb; --surface-2: #f1f0ec; --line: #e4e2dc; --grid: #ebe9e4;
  --text: #0b0b0b; --text-2: #52514e; --text-3: #7a7974; --accent: #2a78d6;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --muted-mark: #b9b7b0;
  --seq-lo: #eef4fc; --seq-hi: #0d366b;
  --div-lo: #2a78d6; --div-mid: #ebe9e4; --div-hi: #d4561e;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #131312; --surface: #1a1a19; --surface-2: #222220; --line: #33322f; --grid: #2a2a28;
    --text: #f0efec; --text-2: #c3c2b7; --text-3: #8f8e86; --accent: #3987e5;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
    --muted-mark: #55544f;
    --seq-lo: #1f2a38; --seq-hi: #9ec5f4;
    --div-lo: #4f95e8; --div-mid: #2c2c2a; --div-hi: #e2703c;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #131312; --surface: #1a1a19; --surface-2: #222220; --line: #33322f; --grid: #2a2a28;
  --text: #f0efec; --text-2: #c3c2b7; --text-3: #8f8e86; --accent: #3987e5;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
  --muted-mark: #55544f;
  --seq-lo: #1f2a38; --seq-hi: #9ec5f4;
  --div-lo: #4f95e8; --div-mid: #2c2c2a; --div-hi: #e2703c;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--accent); }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
header.top { padding: 28px 0 8px; }
.bar { display: flex; justify-content: flex-end; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--surface); }
.seg button { border: 0; background: transparent; color: var(--text-2); font: 500 13px/1 Inter, sans-serif; padding: 7px 12px; border-radius: 999px; cursor: pointer; min-height: 30px; }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--surface); }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
h1 { font: 600 clamp(30px, 5vw, 46px)/1.1 "Source Serif 4", Georgia, serif; margin: 0 0 14px; letter-spacing: -.01em; }
.lede { font-size: 17px; color: var(--text-2); max-width: 760px; margin: 0 0 8px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; margin: 26px 0 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 14px 12px; }
.tile b { display: block; font: 600 24px/1.1 Inter, sans-serif; font-variant-numeric: tabular-nums; }
.tile span { font-size: 12px; color: var(--text-2); }
details.profile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin: 10px 0 0; }
details.profile > summary, details.tbl > summary { cursor: pointer; padding: 12px 14px; font-weight: 500; font-size: 14px; list-style: none; }
details.profile > summary::-webkit-details-marker, details.tbl > summary::-webkit-details-marker { display: none; }
details.profile > summary::before, details.tbl > summary::before { content: "▸"; display: inline-block; width: 1.1em; color: var(--text-3); transition: transform .15s; }
details[open].profile > summary::before, details[open].tbl > summary::before { transform: rotate(90deg); }
details.profile .pintro { padding: 0 14px; margin: 0 0 10px; color: var(--text-2); font-size: 13px; max-width: 820px; }
.scroll { overflow-x: auto; padding: 0 14px 14px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; color: var(--text-2); font-size: 12px; }
td.n, th.n { text-align: right; white-space: nowrap; }
code { font: 12px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace; background: var(--surface-2); padding: 1px 5px; border-radius: 5px; word-break: break-all; }
nav.toc { margin: 30px 0 10px; display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 20px 28px; font-size: 13px; align-items: start; }
nav.toc .tg { min-width: 0; }
nav.toc a { color: var(--text-2); text-decoration: none; display: block; padding: 3px 0; }
nav.toc a:hover { color: var(--text); text-decoration: underline; }
nav.toc .p { font-weight: 600; color: var(--text); padding: 0 0 5px; margin: 0 0 3px; border-bottom: 1px solid var(--line); }
section.part { padding-top: 34px; }
section.part > h2 { font: 600 26px/1.2 "Source Serif 4", Georgia, serif; margin: 0 0 6px; }
section.part > p.pd { color: var(--text-2); margin: 0 0 6px; max-width: 760px; }
figure.chart { margin: 22px 0 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 6px; }
figure.chart h3 { font: 600 19px/1.3 "Source Serif 4", Georgia, serif; margin: 0 0 6px; }
figure.chart h3[data-no]::before { content: attr(data-no); color: var(--text-3); font-weight: 500; margin-right: .35em; }
.ptile .pbar svg { display: block; width: 100%; height: 6px; }
.dek { color: var(--text-2); margin: 0 0 12px; max-width: 820px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--text-2); margin: 0 0 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.legend i.dot { border-radius: 50%; }
.legend i.line { height: 2px; width: 14px; border-radius: 1px; vertical-align: 3px; }
.legend i.dash { height: 0; width: 14px; border-top: 2px dashed; background: transparent !important; vertical-align: 3px; border-radius: 0; }
.legend i.ramp { width: 90px; height: 8px; border-radius: 4px; vertical-align: 0; }
.legend i.hatch { background-image: repeating-linear-gradient(135deg, var(--text-3) 0 1.5px, transparent 1.5px 4px) !important; }
.plot { width: 100%; position: relative; }
.plot svg { display: block; width: 100%; height: auto; overflow: visible; }
.axis text, .lbl { fill: var(--text-2); font: 11px Inter, sans-serif; font-variant-numeric: tabular-nums; }
.lbl.strong { fill: var(--text); font-weight: 500; }
.lbl.mut { fill: var(--text-3); }
.lbl.big { font-size: 12px; }
.axis path { display: none; }
.axis line, .grid line { stroke: var(--grid); }
.base { stroke: var(--text-3); stroke-width: 1; }
.note { font-size: 12px; color: var(--text-3); margin: 10px 0 4px; line-height: 1.5; }
.note b { color: var(--text-2); font-weight: 500; }
details.tbl { border-top: 1px solid var(--line); margin: 10px -18px 0; }
details.tbl > summary { font-size: 12px; color: var(--text-2); padding: 10px 18px; }
details.tbl .scroll { max-height: 360px; overflow: auto; padding: 0 18px 12px; }
.tip { position: fixed; pointer-events: none; z-index: 10; background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12px; line-height: 1.45; box-shadow: 0 6px 24px rgba(0,0,0,.12); max-width: 340px; opacity: 0; transition: opacity .08s; }
.tip b { font-weight: 600; }
.tip .r { display: flex; justify-content: space-between; gap: 14px; }
.tip .r span:last-child { font-variant-numeric: tabular-nums; text-align: right; }
.tip .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
.tip .m { color: var(--text-2); }
.hit { fill: transparent; cursor: default; }
.mini { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px 22px; }
.mini.three { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.mini h4, h4.sub { margin: 0 0 2px; font: 600 13px/1.3 Inter, sans-serif; }
h4.sub { margin: 18px 0 4px; }
.mini p, p.sub { margin: 0 0 6px; font-size: 12px; color: var(--text-2); }
.ptiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; margin: 4px 0 14px; }
.ptile { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.ptile .pn { font: 500 12px/1.3 Inter, sans-serif; color: var(--text-2); }
.ptile .pa { font: 500 13px/1.35 Inter, sans-serif; color: var(--text); margin: 2px 0 4px; }
.ptile .pv { font-size: 12px; color: var(--text-2); margin: 2px 0; }
.ptile .pv b { font: 600 22px/1.1 Inter, sans-serif; color: var(--text); font-variant-numeric: tabular-nums; margin-right: 4px; }
.ptile .ps { font-size: 12px; color: var(--text-3); }
.ptile .pbar { display: flex; gap: 2px; height: 6px; margin-top: 8px; border-radius: 3px; overflow: hidden; background: var(--surface); }
.ptile .pbar i { display: block; min-width: 2px; }
.ptile p { margin: 4px 0 0; font-size: 12.5px; color: var(--text-2); }
.ptile .src { font-size: 11.5px; color: var(--text-3); margin-top: 6px; }
.ptiles.findings { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
footer { color: var(--text-3); font-size: 12px; padding: 40px 0 60px; }
@media (max-width: 560px) {
  figure.chart { padding: 14px 12px 4px; border-radius: 12px; }
  details.tbl { margin: 10px -12px 0; }
  details.tbl > summary { padding: 10px 12px; }
  details.tbl .scroll { padding: 0 12px 12px; }
  .lede { font-size: 16px; }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tile b { font-size: 21px; }
}
@media (forced-colors: active) { .seg button[aria-pressed="true"] { outline: 2px solid CanvasText; } }
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div class="bar">
    <span class="seg" role="group" aria-label="Theme"><button data-theme-set="auto">Auto</button><button data-theme-set="light" aria-label="Light">☀</button><button data-theme-set="dark" aria-label="Dark">☾</button></span>
  </div>
  <h1>Seventeen countries, one at a time</h1>
  <p class="lede" id="lede"></p>
  <p class="note" id="pages-line"></p>
  <div class="tiles" id="tiles"></div>
  <details class="profile"><summary>How the top numbers were counted</summary><p class="pintro" id="profile-intro"></p><div class="scroll" id="profile"></div></details>
  <nav class="toc" id="toc"></nav>
</header>
<main id="main"></main>
<footer id="foot"></footer>
</div>
<div class="tip" id="tip" role="status" aria-live="polite"></div>
<script>
const DATA = /*DATA*/null;
</script>
<script>
"use strict";
let THEME = 'auto';
try { const t = localStorage.getItem('seventeen-theme'); if (t === 'light' || t === 'dark') THEME = t; } catch (e) {}

// ------------------------------------------------------------------ text and numbers
const fmt = n => (n == null ? '–' : (+n).toLocaleString('en-GB'));
const dec = (v, d = 1) => (+v).toFixed(d);
const pct = (a, b, d = 0) => b ? dec(100 * a / b, d) + '%' : '–';
const pctv = (v, d = 0) => dec(100 * v, d) + '%';
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONL = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const WD = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const dateTxt = s => { const [y, m, d] = s.split('-').map(Number); return `${d} ${MONL[m - 1]} ${y}`; };
const dayMonth = (m, d) => `${d} ${MONL[m - 1]}`;
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const S8 = () => [1, 2, 3, 4, 5, 6, 7, 8].map(i => css('--s' + i));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sum = (a, f) => a.reduce((s, d) => s + (f ? f(d) : d), 0);
const mix = (c, t, bg) => d3.interpolateRgb(c, bg || css('--surface'))(t);
const P = {}; DATA.pages.forEach(p => P[p.c] = p);
const cname = c => P[c] ? P[c].name : c;
const big = n => n >= 1e6 ? dec(n / 1e6, 1) + ' million' : fmt(n);
const ink = c => d3.lab(c).l > 62 ? '#111110' : '#ffffff';

// ------------------------------------------------------------------ tooltip
const tip = document.getElementById('tip');
function showTip(ev, html) { tip.innerHTML = html; tip.style.opacity = 1; moveTip(ev); }
function moveTip(ev) {
  const r = tip.getBoundingClientRect(), pad = 14;
  let x = ev.clientX + pad, y = ev.clientY + pad;
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - pad;
  if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - pad;
  tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
}
function hideTip() { tip.style.opacity = 0; }
function bindTip(sel, fn) {
  sel.on('mouseenter', (ev, d) => showTip(ev, fn(d))).on('mousemove', moveTip).on('mouseleave', hideTip)
     .on('touchstart', (ev, d) => { const tt = ev.touches[0]; showTip({ clientX: tt.clientX, clientY: tt.clientY }, fn(d)); }, { passive: true });
}
const trow = (sw, k, v) => `<div class="r"><span>${sw ? `<i class="sw" style="background:${sw}"></i>` : ''}${esc(k)}</span><span>${v}</span></div>`;

// ------------------------------------------------------------------ chart scaffolding
function legend(el, items) {
  const lg = el.append('div').attr('class', 'legend');
  items.forEach(it => { const s = lg.append('span'); const i = s.append('i').attr('class', it.shape || ''); if (it.shape === 'dash') i.style('border-color', it.c); else i.style('background', it.c); s.append('span').text(it.l); });
  return lg;
}
function svgIn(el, w, h) { return el.append('div').attr('class', 'plot').append('svg').attr('viewBox', `0 0 ${w} ${h}`).attr('width', w).attr('height', h).attr('role', 'img'); }
function table(el, head, rows, label) {
  const d = el.append('details').attr('class', 'tbl');
  d.append('summary').text(label || 'Data table');
  const tb = d.append('div').attr('class', 'scroll').append('table');
  tb.append('thead').append('tr').selectAll('th').data(head).join('th').attr('class', (h, i) => i ? 'n' : null).text(h => h);
  tb.append('tbody').selectAll('tr').data(rows).join('tr').selectAll('td').data(r => r).join('td').attr('class', (v, i) => i && typeof v === 'number' ? 'n' : null).text(v => typeof v === 'number' ? fmt(v) : v);
}
function note(el, src, extra) {
  el.append('p').attr('class', 'note').html(`<b>Source:</b> ${src}${extra ? ' · ' + esc(extra) : ''}`);
}
const W = el => Math.max(300, Math.min(1000, el.node().getBoundingClientRect().width || 900));
const narrow = w => w < 560;
function yAxis(g, y, w, ticks = 5, f = fmt) {
  const ax = g.append('g').attr('class', 'axis grid');
  y.ticks(ticks).forEach(v => {
    ax.append('line').attr('x1', 0).attr('x2', w).attr('y1', y(v)).attr('y2', y(v));
    ax.append('text').attr('x', -6).attr('y', y(v)).attr('dy', '0.32em').attr('text-anchor', 'end').text(f(v));
  });
}
function colPath(x, y0, w, y1, r = 4) {
  const h = y0 - y1; if (h <= 0) return '';
  r = Math.min(r, h, w / 2);
  return `M${x},${y0}V${y1 + r}Q${x},${y1} ${x + r},${y1}H${x + w - r}Q${x + w},${y1} ${x + w},${y1 + r}V${y0}Z`;
}
function colPathDown(x, y0, w, y1, r = 4) {
  const h = y1 - y0; if (h <= 0) return '';
  r = Math.min(r, h, w / 2);
  return `M${x},${y0}V${y1 - r}Q${x},${y1} ${x + r},${y1}H${x + w - r}Q${x + w},${y1} ${x + w},${y1 - r}V${y0}Z`;
}
function barPath(x0, y, x1, h, r = 4) {
  const w = x1 - x0; if (w <= 0) return '';
  r = Math.min(r, w, h / 2);
  return `M${x0},${y}H${x1 - r}Q${x1},${y} ${x1},${y + r}V${y + h - r}Q${x1},${y + h} ${x1 - r},${y + h}H${x0}Z`;
}
let CLIPN = 0;
function hatchDef(svg, color) {
  const id = 'h' + (++CLIPN);
  const p = svg.append('defs').append('pattern').attr('id', id).attr('patternUnits', 'userSpaceOnUse').attr('width', 5).attr('height', 5).attr('patternTransform', 'rotate(45)');
  p.append('rect').attr('width', 5).attr('height', 5).attr('fill', css('--surface-2'));
  p.append('line').attr('x1', 0).attr('y1', 0).attr('x2', 0).attr('y2', 5).attr('stroke', color || css('--text-3')).attr('stroke-width', 1.4);
  return `url(#${id})`;
}
// 100% stacked horizontal bands with rounded ends; rows: {label, sub?, vals:[...], right, tip, partial, slim?}
function bands(el, rows, colors, names, opt = {}) {
  const w = W(el), nw = narrow(w), rowH = opt.rowH || 34, slimH = 16, lw = nw ? (opt.ln || 112) : (opt.l || 200), rw = nw ? (opt.rn || 56) : (opt.r || 120);
  const m = { t: 4, r: rw, b: 22, l: lw };
  const heights = rows.map(r => r.slim ? slimH + 6 : (r.gap ? 14 : rowH));
  const h = m.t + m.b + sum(heights), svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
  const iw = w - m.l - m.r, x = d3.scaleLinear().domain([0, 1]).range([0, iw]);
  [0, .25, .5, .75, 1].forEach(v => g.append('text').attr('class', 'lbl mut').attr('x', x(v)).attr('y', sum(heights) + 14).attr('text-anchor', 'middle').text(pctv(v)));
  let y = 0;
  rows.forEach((r, i) => {
    const hh = heights[i]; if (r.gap) { if (r.label) g.append('text').attr('class', 'lbl mut').attr('x', -m.l).attr('y', y + 11).text(r.label); y += hh; return; }
    const bh = r.slim ? slimH - 4 : rowH - 12, y0 = y + (r.slim ? 1 : 6), tot = sum(r.vals), id = 'cb' + (++CLIPN);
    g.append('clipPath').attr('id', id).append('rect').attr('x', 0).attr('y', y0).attr('width', iw).attr('height', bh).attr('rx', bh / 2);
    const row = g.append('g').attr('clip-path', `url(#${id})`).attr('opacity', r.partial ? .55 : 1);
    let acc = 0;
    r.vals.forEach((v, j) => {
      if (!v) return;
      const x0 = x(acc / tot), x1 = x((acc + v) / tot); acc += v;
      row.append('rect').attr('x', x0).attr('width', Math.max(0, x1 - x0 - 1.5)).attr('y', y0).attr('height', bh).attr('fill', colors[j]);
      if (!r.slim && x1 - x0 > (nw ? 30 : 36)) row.append('text').attr('class', 'lbl').attr('x', (x0 + x1) / 2).attr('y', y0 + bh / 2 + 4).attr('text-anchor', 'middle')
        .style('fill', ink(colors[j])).style('pointer-events', 'none').text(pct(v, tot));
    });
    if (r.label) g.append('text').attr('class', 'lbl ' + (r.slim ? 'mut' : 'strong')).attr('x', -10).attr('y', y0 + bh / 2 + 4).attr('text-anchor', 'end').text(r.label);
    if (r.right) g.append('text').attr('class', 'lbl ' + (r.slim ? 'mut' : 'strong')).attr('x', iw + 10).attr('y', y0 + bh / 2 + 4).text(r.right(nw));
    if (r.tip) bindTip(g.append('rect').attr('class', 'hit').attr('x', -m.l).attr('width', w).attr('y', y).attr('height', hh).datum(r), r.tip);
    y += hh;
  });
  return { svg, g, iw, x };
}
// a heat matrix: rows {label, sub, vals, n, tip}; columns names; colour by share of the row's total
function heat(el, rows, cols, opt = {}) {
  const w = W(el), nw = narrow(w), lw = nw ? (opt.ln || 120) : (opt.l || 300), rw = nw ? 0 : (opt.r || 70);
  const cw = Math.max(nw ? 18 : 30, Math.min(opt.maxCw || 64, (w - lw - rw) / cols.length));
  const rowH = opt.rowH || (nw ? 34 : 30), m = { t: 22, r: rw, b: 6, l: lw };
  const heights = rows.map(r => r.gap ? 24 : rowH);
  const h = m.t + m.b + sum(heights), svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
  const ramp = d3.interpolateRgb(css('--seq-lo'), css('--seq-hi')), maxS = opt.max || 1, col = s => ramp(Math.pow(Math.min(1, s / maxS), .6));
  cols.forEach((c, j) => g.append('text').attr('class', 'lbl ' + (opt.hl && opt.hl(j) ? 'strong' : '')).attr('x', j * cw + cw / 2).attr('y', -8).attr('text-anchor', 'middle').text(nw && opt.colsShort ? opt.colsShort[j] : c));
  if (opt.hl) cols.forEach((c, j) => { if (opt.hl(j)) g.append('rect').attr('x', j * cw).attr('y', -2).attr('width', cw).attr('height', sum(heights) + 2).attr('rx', 6).attr('fill', 'none').attr('stroke', css('--text-3')).attr('stroke-dasharray', '3 3'); });
  let y = 0;
  rows.forEach((r, i) => {
    const hh = heights[i];
    if (r.gap) { g.append('text').attr('class', 'lbl strong').attr('x', -m.l).attr('y', y + 16).text(r.gap); y += hh; return; }
    const tot = sum(r.vals);
    r.vals.forEach((v, j) => {
      const s = tot ? v / tot : 0;
      g.append('rect').attr('x', j * cw + 1).attr('y', y + 2).attr('width', cw - 2).attr('height', hh - 4).attr('rx', 4).attr('fill', v ? col(s) : css('--surface-2'));
      if (cw >= 26 || (nw && cw >= 18 && s >= .1)) {
        const t = s >= .995 ? '100' : s >= .095 ? dec(100 * s, 0) : s >= .0005 ? (cw >= 30 ? dec(100 * s, s < .01 ? 1 : 0) : '') : '';
        if (t) g.append('text').attr('class', 'lbl').attr('x', j * cw + cw / 2).attr('y', y + hh / 2 + 4).attr('text-anchor', 'middle').style('fill', v ? ink(col(s)) : css('--text-2')).style('font-size', nw ? '10px' : '11px').text(t);
      }
    });
    const lab = g.append('text').attr('class', 'lbl').attr('x', -10).attr('text-anchor', 'end');
    if (nw || !r.sub) lab.attr('y', y + hh / 2 + 4).append('tspan').attr('class', 'strong').style('font-weight', 500).style('fill', css('--text')).text(nw && r.nl ? `${r.label} ${r.nl}` : r.label);
    else { lab.attr('y', y + hh / 2 - 2); lab.append('tspan').style('font-weight', 500).style('fill', css('--text')).text(r.label); lab.append('tspan').attr('x', -10).attr('dy', 12).style('fill', css('--text-3')).style('font-size', '10.5px').text(r.sub); }
    if (!nw && r.right) g.append('text').attr('class', 'lbl').attr('x', cols.length * cw + 10).attr('y', y + hh / 2 + 4).text(r.right);
    if (r.tip) bindTip(g.append('rect').attr('class', 'hit').attr('x', -m.l).attr('width', m.l + cols.length * cw + rw).attr('y', y).attr('height', hh).datum(r), r.tip);
    y += hh;
  });
  return { svg, g, cw, ramp: col };
}
// a thin bar of segments [share, colour], drawn as SVG (src/stills.mjs only renders figures that hold an svg, canvas or img)
function miniBar(el, segs) {

part('p4', 'IV. Constitutions, codes and old law', 'Fifteen pages followed their constitution; several followed a code article by article. Together they show which texts are rewritten often, which almost never, and how old the law in force is.');

const UNITS = { 'articles': 'articles', 'articles created, amended or removed': 'articles', 'amendment notes left in the text': 'notes', 'words added and deleted': 'words',
  'provisions': 'provisions', 'provisions changed or inserted': 'provisions', 'acts': '', 'provisions added, changed or repealed': 'provisions', 'amendments': 'amendments', 'articles changed or added': 'articles' };
chart('c12', el => {
  const K = DATA.constitutions.slice().sort((a, b) => a.start < b.start ? -1 : 1);
  const fr = K.find(o => o.c === 'france'), be = K.find(o => o.c === 'belgium'), es = K.find(o => o.c === 'spain');

    dek: `Each line is a constitution as its country’s record holds it, from its start to today; each mark is a change, taller the more it changed, against the largest change of the same constitution. Spain’s has had ${fmt(es.events.length)} amendments in 47 years, each to one article. Some records hold only part of the story: Greece’s from the 2001 text, Bulgaria’s from 2008, Bosnia and Herzegovina’s only the English text of 1995, Moldova’s three versions. The Serbian and Czech pages have no chart on their constitutions.`,
    draw(el) {

      const t0 = new Date(1945, 0, 1), t1 = new Date(2027, 0, 1), x = d3.scaleTime().domain([t0, t1]).range([0, iw]), pd = d3.timeParse('%Y-%m-%d');
      [1950, 1970, 1990, 2010, 2026].forEach(v => { g.append('line').attr('x1', x(new Date(v, 0, 1))).attr('x2', x(new Date(v, 0, 1))).attr('y1', 0).attr('y2', rowH * K.length).attr('stroke', css('--grid'));
        g.append('text').attr('class', 'lbl').attr('x', x(new Date(v, 0, 1))).attr('y', rowH * K.length + 14).attr('text-anchor', 'middle').text(v); });
      K.forEach((o, i) => {
        const cy = i * rowH + rowH / 2 + 4, st = pd(o.start), mx = d3.max(o.events, e => e[1] || 0) || 1, unit = UNITS[o.unit];
        const hf = o.held_from ? pd(o.held_from) : st;
        if (o.held_from) g.append('line').attr('x1', x(st)).attr('x2', x(hf)).attr('y1', cy).attr('y2', cy).attr('stroke', css('--text-3')).attr('stroke-dasharray', '2 3');
        g.append('line').attr('x1', x(hf)).attr('x2', x(new Date(2026, 10, 16))).attr('y1', cy).attr('y2', cy).attr('stroke', css('--text-3')).attr('stroke-width', 1.4);
        g.append('circle').attr('cx', x(st)).attr('cy', cy).attr('r', 3.5).attr('fill', css('--surface')).attr('stroke', css('--text-2')).attr('stroke-width', 1.4);
        o.events.forEach(e => { const hh = e[1] ? 5 + 15 * Math.sqrt(e[1] / mx) : 10;
          g.append('rect').attr('x', x(pd(e[0])) - 1.5).attr('y', cy - hh).attr('width', 3).attr('height', hh).attr('rx', 1).attr('fill', s[0]); });
        const lab = g.append('text').attr('class', 'lbl').attr('x', -10).attr('text-anchor', 'end');
        if (nw) lab.attr('y', cy - 2).append('tspan').style('font-weight', 500).style('fill', css('--text')).text(cname(o.c).replace('Bosnia and Herzegovina', 'Bosnia & Herz.'));
        else { lab.attr('y', cy - 5); lab.append('tspan').style('font-weight', 500).style('fill', css('--text')).text(cname(o.c)); lab.append('tspan').attr('x', -10).attr('dy', 12).style('fill', css('--text-3')).style('font-size', '10.5px').text(o.title); }
        if (!nw) { const big = o.events.reduce((a, e) => (e[1] || 0) > (a ? a[1] || 0 : -1) ? e : a, null), n = nRev(o);
          const same = o.events.length > 1 && o.events.every(e => e[1] === o.events[0][1]);
          const txt = !o.events.length ? 'no change in the record' : !big[1] ? `${fmt(n)} amending acts` : same ? `${fmt(n)}, ${fmt(big[1])} ${unit.replace(/s$/, '')} each`
            : n === 1 ? `1 change, ${fmt(big[1])} ${unit}` : `${fmt(n)}; most ${fmt(big[1])} ${unit} in ${big[0].slice(0, 4)}`;
          g.append('text').attr('class', 'lbl').attr('x', iw + 10).attr('y', cy).text(txt); }
        bindTip(g.append('rect').attr('class', 'hit').attr('x', -m.l).attr('width', w).attr('y', i * rowH).attr('height', rowH).datum(o),
          q => `<b>${esc(cname(q.c))}: ${esc(q.title)}</b><div class="m">${esc(q.note)}</div>` + q.events.slice(0, 14).map(e => trow(s[0], dateTxt(e[0]), e[1] == null ? '' : `${fmt(e[1])} ${UNITS[q.unit]}`)).join('') + (q.events.length > 14 ? trow(null, '…', `${q.events.length - 14} more`) : ''));
      });
      note(el, 'the constitution charts of each page: Japan <code>c18</code>, Spain <code>c17</code>, France <code>c19</code>, Türkiye <code>c10</code>, Croatia <code>c13</code>, Bulgaria <code>c11</code>, Andorra <code>c03</code>, Belgium <code>c17</code>, Moldova <code>c05</code>, Bosnia and Herzegovina <code>c05</code>, Albania <code>c17</code>, Montenegro <code>c13</code>, Greece <code>c01</code>, Vietnam <code>c10</code>, Algeria <code>c06</code>',
        'the size of a change is in each page’s own unit: articles (Spain, France, Greece, Vietnam, Algeria), provisions (Bulgaria, Belgium, Albania), amendments (Montenegro), amendment notes left in the text (Türkiye), words added and deleted (Croatia); Moldova’s amending acts carry no size. Belgium’s 82 revisions took effect on 36 days, drawn as one mark each. Dotted: years the record does not hold (Greece before its 2001 text, Bulgaria before 2008).');
      table(el, ['Country', 'Constitution', 'Change', 'Size', 'Unit'], K.flatMap(o => o.events.length ? o.events.map(e => [cname(o.c), o.title, e[0], e[1] == null ? '–' : e[1], UNITS[o.unit] || '–']) : [[cname(o.c), o.title, 'none in the record', '–', '–']]));
    }

chart('c13', el => {

part('p5', 'V. Budgets, money, penalties, Europe and the world', 'Some questions could be asked of only a few records, but where they could, the answers line up: budgets that come late, currencies that change, a death penalty that shrinks, European law that spreads into the text, and the states treaties are made with.');

chart('c15', el => {
  const B = DATA.budgets, by = c => B.find(o => o.c === c), an = by('andorra'), ba = by('bosnia-and-herzegovina'), es = by('spain'), bg = by('bulgaria');
  const anAppr = Object.values(an.approved).filter(d => d < 0).length;
  return {
    title: `Late budgets: Bosnia and Herzegovina’s budget law came out after its year had begun in ${ba.late} of ${ba.n} years; Spain had no budget law for ${es.missing.length} years`,
    dek: `Each square is a budget year: blue if the budget law was published before 1 January, orange the further into its year it came out, hatched if the record holds none. Andorra’s Consell General approves its budget before 1 January in ${anAppr} of ${an.n} years and the BOPA publishes it later still: after 1 January in ${an.late}. Spain’s last budget law is for 2023. Bulgaria published its budgets for 2023 and 2026 more than 200 days into the year.`,
    draw(el) {
      const Y0 = 1983, Y1 = 2026, YRS = d3.range(Y0, Y1 + 1), w = W(el), nw = narrow(w), lw = nw ? 84 : 170, rw = nw ? 0 : 130;

      const hs = lg.append('span'); hs.append('i').attr('class', 'hatch'); hs.append('span').text('no budget law in the record');
      const h = m.t + m.b + rowH * B.length, svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`), hatch = hatchDef(svg);
      YRS.forEach((y, j) => { if (y % (nw ? 10 : 5) === 0) g.append('text').attr('class', 'lbl mut').attr('x', j * cw + cw / 2).attr('y', -7).attr('text-anchor', 'middle').text(y); });
      const add = (dstr, d) => { const t = new Date(Date.UTC(dstr, 0, 1) + d * 864e5); return `${t.getUTCDate()} ${MONL[t.getUTCMonth()]} ${t.getUTCFullYear()}`; };
      B.forEach((o, i) => {

// ------------------------------------------------------------------ page
function profileTable() {
  const R = DATA.records, el = d3.select('#profile').html('');
  d3.select('#profile-intro').text(`The tiles add up the Records column of the seventeen pages’ Data tables, by kind, each dataset once. Git histories are left out (their commits carry the same acts and versions), and so are lists that repeat records counted on another row and what a page holds but does not chart. Of the ${big(R.total)} records, ${big(R.by_kind.parliament)} are bills, votes, sittings and elections, almost all of them the individual votes of Czech MPs. The years run from the oldest record any page charts, an article of the French ordinance of Villers-Cotterêts that took effect on 25 August 1539, to November 2026.`);
  const tb = el.append('table');
  tb.append('thead').append('tr').selectAll('th').data(['Kind', 'Records', 'Share']).join('th').attr('class', (d, i) => i ? 'n' : null).text(d => d);
  tb.append('tbody').selectAll('tr').data(KINDK).join('tr').html(k => `<td>${esc(KIND[k])}</td><td class="n">${fmt(R.by_kind[k])}</td><td class="n">${pct(R.by_kind[k], R.total, 1)}</td>`);
}
function fitLeftLabels(fig) {
  fig.selectAll('svg text').each(function () {
    if (this.getAttribute('text-anchor') !== 'end' || !(+this.getAttribute('x') < 0) || this.querySelector('tspan')) return;
    const svg = this.ownerSVGElement, room = this.getBoundingClientRect().right - svg.getBoundingClientRect().left - 2;
    if (this.getComputedTextLength() <= room) return;
    const full = this.textContent;
    d3.select(this).append('title').text(full);
    let lo = 0, hi = full.length;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; this.firstChild.nodeValue = full.slice(0, mid) + '…'; if (this.getComputedTextLength() <= room) lo = mid; else hi = mid - 1; }
    this.firstChild.nodeValue = full.slice(0, lo) + '…';
  });
}
function render() {
  d3.selectAll('[data-theme-set]').attr('aria-pressed', function () { return String(this.dataset.themeSet === THEME); });
  const T = DATA.tiles, R = DATA.records;
  d3.select('#lede').text(`Twenty charts were drawn for each of seventeen jurisdictions, one country at a time, each page from its own repository alone and in its own language as well as English. This page sets their findings side by side wherever several countries could answer the same question, and says what the work showed about the records themselves.`);
  d3.select('#pages-line').html(`The country pages are in each repository’s <code>visualisations/</code> folder (chart 1 links them). The charts below are descriptive: they show what the records hold, not why.`);
  const tiles = [[T.countries, 'jurisdictions, one page each'], [T.charts, 'charts, twenty a country'], [T.languages, 'languages besides English'], [big(T.records), 'records the pages drew on'],
    [fmt(R.by_kind.acts), 'acts and other official texts'], [big(R.by_kind.versions), 'versions and recorded changes'], [fmt(R.by_kind.decisions), 'court decisions'], [`${T.first_year}–${T.last_record.slice(0, 4)}`, 'the years the records span']];
  d3.select('#tiles').html('').selectAll('div').data(tiles).join('div').attr('class', 'tile').html(d => `<b>${typeof d[0] === 'number' ? fmt(d[0]) : d[0]}</b><span>${d[1]}</span>`);
  profileTable();
  const main = d3.select('#main').html(''), toc = d3.select('#toc').html('');
  let sec = null, grp = null, n = 0;
  CH.forEach(c => {
    if (c.part) {
      sec = main.append('section').attr('class', 'part').attr('id', c.id);
      sec.append('h2').text(c.title); sec.append('p').attr('class', 'pd').text(c.desc);
      grp = toc.append('div').attr('class', 'tg');
      grp.append('a').attr('class', 'p').attr('href', '#' + c.id).text(c.title);
      return;
    }
    n++;
    const fig = sec.append('figure').attr('class', 'chart').attr('id', c.id);
    let spec;
    try { spec = c.fn(fig); } catch (e) { fig.append('p').attr('class', 'note').text('Error: ' + e.message); console.error(c.id, e); return; }
    // the number is drawn by CSS (h3::before), so the heading's text is the title alone, as src/stills.mjs names stills by it
    const h3 = fig.append('h3').attr('data-no', n + '.'); h3.append('span').attr('class', 'tt').text(spec.title);
    fig.append('p').attr('class', 'dek').text(spec.dek);
    try { spec.draw(fig); } catch (e) { fig.append('p').attr('class', 'note').text('Error: ' + e.message); console.error(c.id, e); }
    fitLeftLabels(fig);
    fig.selectAll('svg').attr('aria-label', spec.title);
    grp.append('a').attr('href', '#' + c.id).text(`${n}. ${spec.toc || spec.title.split(':')[0]}`);
  });
  d3.select('#foot').html(`Built ${DATA.built} from the seventeen pages’ folders: <code>src/seventeen/prep.py</code> reads each page’s <code>README.en.md</code> and the data its page draws (<code>src/.build/data.json</code>) and writes <code>seventeen-data.json</code>; <code>build.py</code> puts it into the page. Every chart names the charts and data keys it is drawn from. Map shapes: world-atlas (Natural Earth).`);
}
d3.selectAll('[data-theme-set]').on('click', function () {
  THEME = this.dataset.themeSet;
  if (THEME === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', THEME);
  try { localStorage.setItem('seventeen-theme', THEME); } catch (e) {}
  render();
});
if (THEME !== 'auto') document.documentElement.setAttribute('data-theme', THEME);
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (THEME === 'auto') render(); }); } catch (e) {}
let lastW = innerWidth, rt;
addEventListener('resize', () => { if (Math.abs(innerWidth - lastW) < 40) return; clearTimeout(rt); rt = setTimeout(() => { lastW = innerWidth; const y = scrollY; render(); scrollTo(0, y); }, 200); });
render();
</script>
