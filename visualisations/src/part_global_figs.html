  <div class="divider"><span class="eyebrow">The world view · round 4</span><p>Every jurisdiction in the world law register, and every amendment in the histories loaded so far, drawn on one canvas.</p></div>

  <figure id="world">
    <div class="figtext"><span class="eyebrow">209 jurisdictions</span><h2>How much of the world's law can become a history today</h2>
      <p>Each jurisdiction in the world law register, coloured by what its official legal source makes possible. <b>Besides the 16 already loaded (black), 36 publish dated versions of their law fully or in part, 29 have the history online but need scraping, 118 publish only an official gazette, and 10 have no usable official source.</b> For gazette-only countries a history has to be rebuilt by replaying every amending act, the slowest route. Small states are drawn as dots.</p></div>
    <div class="plot"><svg id="f-world" role="img" aria-label="World map of official legal source readiness"></svg></div>
    <p class="src">Build status and source capabilities from each jurisdiction's jurisdiction.json and SOURCES.md in world-law-repos (the World Law Sources register, checked 28 October 2026). Shapes: Natural Earth via world-atlas 1:50m.</p>
  </figure>

  <figure id="europe">
    <div class="figtext"><span class="eyebrow">Europe</span><h2>Most of what is loaded is European, and much of it small</h2>
      <p>The same map for Europe, with every loaded jurisdiction named. <b>Fourteen of the 16 loaded histories are European</b>, five of them microstates (Gibraltar, Liechtenstein, Luxembourg, Malta, Monaco). The ready systems not yet loaded include France, Spain, Italy, Austria, the Netherlands and Czechia in Europe, and Canada, Australia, New Zealand, Japan, South Korea and South Africa beyond it. Those are the obvious next loads.</p></div>
    <div class="plot"><svg id="f-europe" role="img" aria-label="Map of Europe with loaded jurisdictions named"></svg></div>
    <p class="src">Same data as the world map.</p>
  </figure>
