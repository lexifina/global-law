
  <figure id="map-lag">
    <div class="figtext"><span class="eyebrow">World · round 10</span><h2>A map of waiting</h2>
      <p id="ml-text"></p></div>
    <div class="plot"><svg id="f-ml" role="img" aria-label="World map coloured by median adoption-to-force delay"></svg></div>
    <p class="src">Median days from adoption to entry into force, for jurisdictions with at least ten dated pairs. Grey: loaded, but no adoption dates recorded. Blank: not loaded.</p>
  </figure>

  <figure id="map-first">
    <div class="figtext"><span class="eyebrow">World · round 10</span><h2>Where law starts on the first of the month</h2>
      <p id="mf-text"></p></div>
    <div class="plot"><svg id="f-mf" role="img" aria-label="World map coloured by share of acts starting on the 1st"></svg></div>
    <p class="src">Share of each jurisdiction's dated acts whose in-force date is the 1st of a month (by chance alone, about 3%). Jurisdictions with fewer than 30 dated acts are drawn in grey.</p>
  </figure>

  <figure id="map-month">
    <div class="figtext"><span class="eyebrow">World · round 10</span><h2>Each country's busiest month for new law</h2>
      <p id="mm-text"></p></div>
    <div class="plot"><svg id="f-mm" role="img" aria-label="World map coloured by the month in which most acts take effect"></svg></div>
    <p class="src">The month with the most in-force dates in each jurisdiction's history. Jurisdictions with fewer than 30 dated acts are drawn in grey.</p>
  </figure>
