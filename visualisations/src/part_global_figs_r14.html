
  <figure id="makers">
    <div class="figtext"><span class="eyebrow">All jurisdictions · round 14</span><h2>Who makes the law: parliaments or governments?</h2>
      <p id="mk-text"></p></div>
    <div class="plot"><svg id="f-mk" role="img" aria-label="Stacked bars of acts made by parliament, by the executive, or unclassified"></svg></div>
    <p class="src">Each dated act classified by its instrument name and any Type or Kind trailer. Parliament: laws, acts, codes and constitutional laws (Loi, Ley, Zákon, Gesetz, Qanun, Закон, Act, Pub. L.). Executive: decrees, ordinances, regulations and orders (Décret, Arrêté, Real Decreto, Vyhláška, Nařízení, Verordnung, Указ, L.N., S.I.). Forms of either kind are matched executive first, so a decree-law counts as executive. Hong Kong and Gibraltar ordinances are legislative. Mexico is left out: its amending decrees are issued by Congress, so the name does not tell who made them. Jurisdictions where more than half the acts cannot be classified are left out.</p>
  </figure>

  <figure id="map-exec">
    <div class="figtext"><span class="eyebrow">World · round 14</span><h2>The executive's share of new law</h2>
      <p id="mx-text"></p></div>
    <div class="plot"><svg id="f-mx" role="img" aria-label="World map of the executive share of classified acts"></svg></div>
    <p class="src">Executive acts as a share of classified acts, for jurisdictions with at least 30 classified acts and at most half unclassified. Grey: too few classified acts.</p>
  </figure>
