  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--accent); }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
header.top { padding: 28px 0 8px; }
.bar { display: flex; justify-content: flex-end; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--surface); }
.seg button { border: 0; background: transparent; color: var(--text-2); font: 500 13px/1 Inter, sans-serif; padding: 7px 12px; border-radius: 999px; cursor: pointer; min-height: 30px; }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--surface); }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
h1 { font: 600 clamp(30px, 5vw, 46px)/1.1 "Source Serif 4", Georgia, serif; margin: 0 0 14px; letter-spacing: -.01em; }
.lede { font-size: 17px; color: var(--text-2); max-width: 760px; margin: 0 0 8px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; margin: 26px 0 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 14px 12px; }
.tile b { display: block; font: 600 24px/1.1 Inter, sans-serif; font-variant-numeric: tabular-nums; }
.tile span { font-size: 12px; color: var(--text-2); }
details.profile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin: 10px 0 0; }
details.profile > summary, details.tbl > summary { cursor: pointer; padding: 12px 14px; font-weight: 500; font-size: 14px; list-style: none; }
details.profile > summary::-webkit-details-marker, details.tbl > summary::-webkit-details-marker { display: none; }
details.profile > summary::before, details.tbl > summary::before { content: "▸"; display: inline-block; width: 1.1em; color: var(--text-3); transition: transform .15s; }
details[open].profile > summary::before, details[open].tbl > summary::before { transform: rotate(90deg); }
details.profile .pintro { padding: 0 14px; margin: 0 0 10px; color: var(--text-2); font-size: 13px; max-width: 820px; }
.scroll { overflow-x: auto; padding: 0 14px 14px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; color: var(--text-2); font-size: 12px; }
td.n, th.n { text-align: right; white-space: nowrap; }
code { font: 12px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace; background: var(--surface-2); padding: 1px 5px; border-radius: 5px; word-break: break-all; }
nav.toc { margin: 30px 0 10px; display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 20px 28px; font-size: 13px; align-items: start; }
nav.toc .tg { min-width: 0; }
nav.toc a { color: var(--text-2); text-decoration: none; display: block; padding: 3px 0; }
nav.toc a:hover { color: var(--text); text-decoration: underline; }
nav.toc .p { font-weight: 600; color: var(--text); padding: 0 0 5px; margin: 0 0 3px; border-bottom: 1px solid var(--line); }
section.part { padding-top: 34px; }
section.part > h2 { font: 600 26px/1.2 "Source Serif 4", Georgia, serif; margin: 0 0 6px; }
section.part > p.pd { color: var(--text-2); margin: 0 0 6px; max-width: 760px; }
figure.chart { margin: 22px 0 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 6px; }
figure.chart h3 { font: 600 19px/1.3 "Source Serif 4", Georgia, serif; margin: 0 0 6px; }
figure.chart h3[data-no]::before { content: attr(data-no); color: var(--text-3); font-weight: 500; margin-right: .35em; }
.ptile .pbar svg { display: block; width: 100%; height: 6px; }
.dek { color: var(--text-2); margin: 0 0 12px; max-width: 820px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--text-2); margin: 0 0 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.legend i.dot { border-radius: 50%; }
.legend i.line { height: 2px; width: 14px; border-radius: 1px; vertical-align: 3px; }
.legend i.dash { height: 0; width: 14px; border-top: 2px dashed; background: transparent !important; vertical-align: 3px; border-radius: 0; }
.legend i.ramp { width: 90px; height: 8px; border-radius: 4px; vertical-align: 0; }
.legend i.hatch { background-image: repeating-linear-gradient(135deg, var(--text-3) 0 1.5px, transparent 1.5px 4px) !important; }
.plot { width: 100%; position: relative; }
.plot svg { display: block; width: 100%; height: auto; overflow: visible; }
.axis text, .lbl { fill: var(--text-2); font: 11px Inter, sans-serif; font-variant-numeric: tabular-nums; }
.lbl.strong { fill: var(--text); font-weight: 500; }
.lbl.mut { fill: var(--text-3); }
.lbl.big { font-size: 12px; }
.axis path { display: none; }
.axis line, .grid line { stroke: var(--grid); }
.base { stroke: var(--text-3); stroke-width: 1; }
.note { font-size: 12px; color: var(--text-3); margin: 10px 0 4px; line-height: 1.5; }
.note b { color: var(--text-2); font-weight: 500; }
details.tbl { border-top: 1px solid var(--line); margin: 10px -18px 0; }
details.tbl > summary { font-size: 12px; color: var(--text-2); padding: 10px 18px; }
details.tbl .scroll { max-height: 360px; overflow: auto; padding: 0 18px 12px; }
.tip { position: fixed; pointer-events: none; z-index: 10; background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12px; line-height: 1.45; box-shadow: 0 6px 24px rgba(0,0,0,.12); max-width: 340px; opacity: 0; transition: opacity .08s; }
.tip b { font-weight: 600; }
.tip .r { display: flex; justify-content: space-between; gap: 14px; }
.tip .r span:last-child { font-variant-numeric: tabular-nums; text-align: right; }
.tip .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
.tip .m { color: var(--text-2); }
.hit { fill: transparent; cursor: default; }
.mini { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px 22px; }
.mini.three { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.mini h4, h4.sub { margin: 0 0 2px; font: 600 13px/1.3 Inter, sans-serif; }
h4.sub { margin: 18px 0 4px; }
.mini p, p.sub { margin: 0 0 6px; font-size: 12px; color: var(--text-2); }
.ptiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; margin: 4px 0 14px; }
.ptile { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.ptile .pn { font: 500 12px/1.3 Inter, sans-serif; color: var(--text-2); }
.ptile .pa { font: 500 13px/1.35 Inter, sans-serif; color: var(--text); margin: 2px 0 4px; }
.ptile .pv { font-size: 12px; color: var(--text-2); margin: 2px 0; }
.ptile .pv b { font: 600 22px/1.1 Inter, sans-serif; color: var(--text); font-variant-numeric: tabular-nums; margin-right: 4px; }
.ptile .ps { font-size: 12px; color: var(--text-3); }
.ptile .pbar { display: flex; gap: 2px; height: 6px; margin-top: 8px; border-radius: 3px; overflow: hidden; background: var(--surface); }
.ptile .pbar i { display: block; min-width: 2px; }
.ptile p { margin: 4px 0 0; font-size: 12.5px; color: var(--text-2); }
.ptile .src { font-size: 11.5px; color: var(--text-3); margin-top: 6px; }
.ptiles.findings { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
footer { color: var(--text-3); font-size: 12px; padding: 40px 0 60px; }
@media (max-width: 560px) {
  figure.chart { padding: 14px 12px 4px; border-radius: 12px; }
  details.tbl { margin: 10px -12px 0; }
  details.tbl > summary { padding: 10px 12px; }
  details.tbl .scroll { padding: 0 12px 12px; }
  .lede { font-size: 16px; }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tile b { font-size: 21px; }
}
@media (forced-colors: active) { .seg button[aria-pressed="true"] { outline: 2px solid CanvasText; } }
</style>
</head>

<script>
"use strict";
let THEME = 'auto';
try { const t = localStorage.getItem('seventeen-theme'); if (t === 'light' || t === 'dark') THEME = t; } catch (e) {}

// ------------------------------------------------------------------ text and numbers
const fmt = n => (n == null ? '–' : (+n).toLocaleString('en-GB'));
const dec = (v, d = 1) => (+v).toFixed(d);
const pct = (a, b, d = 0) => b ? dec(100 * a / b, d) + '%' : '–';
const pctv = (v, d = 0) => dec(100 * v, d) + '%';
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONL = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const WD = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const dateTxt = s => { const [y, m, d] = s.split('-').map(Number); return `${d} ${MONL[m - 1]} ${y}`; };
const dayMonth = (m, d) => `${d} ${MONL[m - 1]}`;
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const S8 = () => [1, 2, 3, 4, 5, 6, 7, 8].map(i => css('--s' + i));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sum = (a, f) => a.reduce((s, d) => s + (f ? f(d) : d), 0);
const mix = (c, t, bg) => d3.interpolateRgb(c, bg || css('--surface'))(t);
const P = {}; DATA.pages.forEach(p => P[p.c] = p);
const cname = c => P[c] ? P[c].name : c;
const big = n => n >= 1e6 ? dec(n / 1e6, 1) + ' million' : fmt(n);
const ink = c => d3.lab(c).l > 62 ? '#111110' : '#ffffff';

// ------------------------------------------------------------------ tooltip
const tip = document.getElementById('tip');
function showTip(ev, html) { tip.innerHTML = html; tip.style.opacity = 1; moveTip(ev); }
function moveTip(ev) {
  const r = tip.getBoundingClientRect(), pad = 14;
  let x = ev.clientX + pad, y = ev.clientY + pad;
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - pad;
  if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - pad;
  tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
}
function hideTip() { tip.style.opacity = 0; }
function bindTip(sel, fn) {
  sel.on('mouseenter', (ev, d) => showTip(ev, fn(d))).on('mousemove', moveTip).on('mouseleave', hideTip)
     .on('touchstart', (ev, d) => { const tt = ev.touches[0]; showTip({ clientX: tt.clientX, clientY: tt.clientY }, fn(d)); }, { passive: true });
}
const trow = (sw, k, v) => `<div class="r"><span>${sw ? `<i class="sw" style="background:${sw}"></i>` : ''}${esc(k)}</span><span>${v}</span></div>`;

// ------------------------------------------------------------------ chart scaffolding
function legend(el, items) {
  const lg = el.append('div').attr('class', 'legend');
  items.forEach(it => { const s = lg.append('span'); const i = s.append('i').attr('class', it.shape || ''); if (it.shape === 'dash') i.style('border-color', it.c); else i.style('background', it.c); s.append('span').text(it.l); });
  return lg;
}
function svgIn(el, w, h) { return el.append('div').attr('class', 'plot').append('svg').attr('viewBox', `0 0 ${w} ${h}`).attr('width', w).attr('height', h).attr('role', 'img'); }
function table(el, head, rows, label) {
  const d = el.append('details').attr('class', 'tbl');
  d.append('summary').text(label || 'Data table');
  const tb = d.append('div').attr('class', 'scroll').append('table');
  tb.append('thead').append('tr').selectAll('th').data(head).join('th').attr('class', (h, i) => i ? 'n' : null).text(h => h);
  tb.append('tbody').selectAll('tr').data(rows).join('tr').selectAll('td').data(r => r).join('td').attr('class', (v, i) => i && typeof v === 'number' ? 'n' : null).text(v => typeof v === 'number' ? fmt(v) : v);
}
function note(el, src, extra) {
  el.append('p').attr('class', 'note').html(`<b>Source:</b> ${src}${extra ? ' · ' + esc(extra) : ''}`);
}
const W = el => Math.max(300, Math.min(1000, el.node().getBoundingClientRect().width || 900));
const narrow = w => w < 560;
function yAxis(g, y, w, ticks = 5, f = fmt) {
  const ax = g.append('g').attr('class', 'axis grid');

// 100% stacked horizontal bands with rounded ends; rows: {label, sub?, vals:[...], right, tip, partial, slim?}
function bands(el, rows, colors, names, opt = {}) {
  const w = W(el), nw = narrow(w), rowH = opt.rowH || 34, slimH = 16, lw = nw ? (opt.ln || 112) : (opt.l || 200), rw = nw ? (opt.rn || 56) : (opt.r || 120);

    const bh = r.slim ? slimH - 4 : rowH - 12, y0 = y + (r.slim ? 1 : 6), tot = sum(r.vals), id = 'cb' + (++CLIPN);

// a heat matrix: rows {label, sub, vals, n, tip}; columns names; colour by share of the row's total
function heat(el, rows, cols, opt = {}) {
  const w = W(el), nw = narrow(w), lw = nw ? (opt.ln || 120) : (opt.l || 300), rw = nw ? 0 : (opt.r || 70);
  const cw = Math.max(nw ? 18 : 30, Math.min(opt.maxCw || 64, (w - lw - rw) / cols.length));

  const h = m.t + m.b + sum(heights), svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
  const ramp = d3.interpolateRgb(css('--seq-lo'), css('--seq-hi')), maxS = opt.max || 1, col = s => ramp(Math.pow(Math.min(1, s / maxS), .6));
  cols.forEach((c, j) => g.append('text').attr('class', 'lbl ' + (opt.hl && opt.hl(j) ? 'strong' : '')).attr('x', j * cw + cw / 2).attr('y', -8).attr('text-anchor', 'middle').text(nw && opt.colsShort ? opt.colsShort[j] : c));
  if (opt.hl) cols.forEach((c, j) => { if (opt.hl(j)) g.append('rect').attr('x', j * cw).attr('y', -2).attr('width', cw).attr('height', sum(heights) + 2).attr('rx', 6).attr('fill', 'none').attr('stroke', css('--text-3')).attr('stroke-dasharray', '3 3'); });
  let y = 0;
  rows.forEach((r, i) => {

      if (cw >= 26 || (nw && cw >= 18 && s >= .1)) {

        if (t) g.append('text').attr('class', 'lbl').attr('x', j * cw + cw / 2).attr('y', y + hh / 2 + 4).attr('text-anchor', 'middle').style('fill', v ? ink(col(s)) : css('--text-2')).style('font-size', nw ? '10px' : '11px').text(t);
      }
    });
    const lab = g.append('text').attr('class', 'lbl').attr('x', -10).attr('text-anchor', 'end');
    if (nw || !r.sub) lab.attr('y', y + hh / 2 + 4).append('tspan').attr('class', 'strong').style('font-weight', 500).style('fill', css('--text')).text(nw && r.nl ? `${r.label} ${r.nl}` : r.label);
    else { lab.attr('y', y + hh / 2 - 2); lab.append('tspan').style('font-weight', 500).style('fill', css('--text')).text(r.label); lab.append('tspan').attr('x', -10).attr('dy', 12).style('fill', css('--text-3')).style('font-size', '10.5px').text(r.sub); }
    if (!nw && r.right) g.append('text').attr('class', 'lbl').attr('x', cols.length * cw + 10).attr('y', y + hh / 2 + 4).text(r.right);
    if (r.tip) bindTip(g.append('rect').attr('class', 'hit').attr('x', -m.l).attr('width', m.l + cols.length * cw + rw).attr('y', y).attr('height', hh).datum(r), r.tip);

part('p3', 'III. Who makes the law, and how it changes', 'Parliaments pass laws, but governments in several of these countries may make acts with the force of law; and most new laws change old ones, often many at once.');

    title: `Lawmaking by the government: in 2020, ${fmt(fr[2])} ordinances in France, ${fmt(es[2])} royal decree-laws in Spain, ${fmt(al[2])} normative acts in Albania`,
    dek: `Above each axis, the laws Parliament passed each year; below it, the government’s acts with the force of law. In 2020 France signed ${fmt(fr[2])} ordinances against ${fmt(fr[1])} laws, Spain ${fmt(es[2])} decree-laws against ${fmt(es[1])} laws. Croatia’s Government amended a law by decree ${fmt(hr.tot[1])} times, most in ${hr.peak[0]} (${fmt(hr.peak[2])}); in Bosnia and Herzegovina the High Representative enacted ${fmt(ba.tot[1])} laws and amendments, ${fmt(ba00[2])} of the ${fmt(ba00[1] + ba00[2])} of 2000.`,
    draw(el) {
      const s = S8(), cP = s[0], cG = s[1];

        const pk = rows.reduce((a, r) => r[2] > a[2] ? r : a, rows[0]);

function fitLeftLabels(fig) {

    if (this.getAttribute('text-anchor') !== 'end' || !(+this.getAttribute('x') < 0) || this.querySelector('tspan')) return;
    const svg = this.ownerSVGElement, room = this.getBoundingClientRect().right - svg.getBoundingClientRect().left - 2;

function render() {

d3.selectAll('[data-theme-set]').on('click', function () {
