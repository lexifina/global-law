<svg xmlns="http://www.w3.org/2000/svg" width="900" height="276" viewBox="0 0 900 276" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" role="img"><title>Anatomy of a late extension</title><rect x="0.5" y="0.5" width="899" height="275" rx="8" fill="#ffffff" stroke="#dfe5e1"/><text x="28" y="40" font-size="18" font-weight="700" fill="#14201a">Anatomy of a late extension</text><text x="28" y="62" font-size="12.5" fill="#5f6e66">Albania, VKM 98/2009 point 3: the deadline to buy the land of privatised enterprises</text><line x1="60" y1="150" x2="860" y2="150" stroke="#5f6e66" stroke-width="1.5"/><line x1="60.0" y1="150" x2="60.0" y2="156" stroke="#5f6e66"/><text x="60.0" y="170" font-size="11" fill="#5f6e66" text-anchor="middle">Mar 2009</text><line x1="202.1" y1="150" x2="202.1" y2="156" stroke="#5f6e66"/><text x="202.1" y="170" font-size="11" fill="#5f6e66" text-anchor="middle">Jun 2009</text><line x1="344.2" y1="150" x2="344.2" y2="156" stroke="#5f6e66"/><text x="344.2" y="170" font-size="11" fill="#5f6e66" text-anchor="middle">Sep 2009</text><line x1="484.7" y1="150" x2="484.7" y2="156" stroke="#5f6e66"/><text x="484.7" y="170" font-size="11" fill="#5f6e66" text-anchor="middle">Dec 2009</text><line x1="623.7" y1="150" x2="623.7" y2="156" stroke="#5f6e66"/><text x="623.7" y="170" font-size="11" fill="#5f6e66" text-anchor="middle">Mar 2010</text><line x1="765.8" y1="150" x2="765.8" y2="156" stroke="#5f6e66"/><text x="765.8" y="170" font-size="11" fill="#5f6e66" text-anchor="middle">Jun 2010</text><rect x="60.0" y="128" width="140.5" height="14" rx="3" fill="#1a7f4b"/><rect x="202.1" y="128" width="194.6" height="14" rx="3" fill="#eb6834"/><rect x="398.2" y="128" width="412.4" height="14" rx="3" fill="#1a7f4b"/><line x1="200.5" y1="124" x2="200.5" y2="100" stroke="#5f6e66" stroke-dasharray="3 3"/><text x="200.5" y="92" font-size="12" fill="#14201a" text-anchor="middle">31 May 2009: the deadline</text><line x1="345.7" y1="176" x2="345.7" y2="190" stroke="#5f6e66" stroke-dasharray="3 3"/><text x="345.7" y="202" font-size="12" fill="#14201a" text-anchor="middle">2 Sep 2009: VKM 923 adopted</text><line x1="398.2" y1="124" x2="398.2" y2="100" stroke="#5f6e66" stroke-dasharray="3 3"/><text x="398.2" y="92" font-size="12" fill="#14201a" text-anchor="start">6 Oct 2009: in force on publication</text><line x1="810.6" y1="176" x2="810.6" y2="190" stroke="#5f6e66" stroke-dasharray="3 3"/><text x="810.6" y="202" font-size="12" fill="#14201a" text-anchor="end">30 Jun 2010: the new deadline</text><text x="299.4" y="120" font-size="12.5" font-weight="700" fill="#14201a" text-anchor="middle">127 days with no rule</text><rect x="28" y="226" width="12" height="10" rx="2" fill="#1a7f4b"/><text x="46" y="235" font-size="11.5" fill="#5f6e66">a deadline in force</text><rect x="170" y="226" width="12" height="10" rx="2" fill="#eb6834"/><text x="188" y="235" font-size="11.5" fill="#5f6e66">no deadline in force</text><text x="28" y="260" font-size="12" fill="#5f6e66">The extending decision changed the date in the same sentence and said nothing about the months already passed.</text></svg>