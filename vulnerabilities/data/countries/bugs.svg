<svg xmlns="http://www.w3.org/2000/svg" width="900" height="412" viewBox="0 0 900 412" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" role="img"><title>What had to be fixed, by part of the pipeline</title><rect x="0.5" y="0.5" width="899" height="411" rx="8" fill="#ffffff" stroke="#dfe5e1"/><text x="28" y="40" font-size="18" font-weight="700" fill="#14201a">What had to be fixed, by part of the pipeline</text><text x="28" y="62" font-size="12.5" fill="#5f6e66">179 bugs found while running the detectors country by country: 143 fixed, 36 still open (stated in each README)</text><rect x="670" y="50" width="10" height="10" rx="2" fill="#1a7f4b"/><text x="686" y="59" font-size="12" fill="#5f6e66">fixed</text><rect x="740" y="50" width="10" height="10" rx="2" fill="#2a78d6"/><text x="756" y="59" font-size="12" fill="#5f6e66">open</text><text x="258" y="107" font-size="13" fill="#14201a" text-anchor="end">Dates and time limits</text><rect x="270" y="95" width="402.1" height="18" rx="4" fill="#1a7f4b"/><rect x="674.1" y="95" width="125.9" height="18" rx="4" fill="#2a78d6"/><text x="808.0" y="109" font-size="12.5" fill="#14201a" font-family="'IBM Plex Mono', ui-monospace, Consolas, monospace" font-weight="600">29</text><text x="258" y="137" font-size="13" fill="#14201a" text-anchor="end">Currencies</text><rect x="270" y="125" width="420.3" height="18" rx="4" fill="#1a7f4b"/><rect x="692.3" y="125" width="52.8" height="18" rx="4" fill="#2a78d6"/><text x="753.2" y="139" font-size="12.5" fill="#14201a" font-family="'IBM Plex Mono', ui-monospace, Consolas, monospace" font-weight="600">26</text><text x="258" y="167" font-size="13" fill="#14201a" text-anchor="end">References</text><rect x="270" y="155" width="274.1" height="18" rx="4" fill="#1a7f4b"/><rect x="546.1" y="155" width="125.9" height="18" rx="4" fill="#2a78d6"/><text x="680.1" y="169" font-size="12.5" fill="#14201a" font-family="'IBM Plex Mono', ui-monospace, Consolas, monospace" font-weight="600">