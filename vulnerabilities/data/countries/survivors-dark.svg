<svg xmlns="http://www.w3.org/2000/svg" width="900" height="352" viewBox="0 0 900 352" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" role="img"><title>What the survivors turned out to be</title><rect x="0.5" y="0.5" width="899" height="351" rx="8" fill="#0c120f" stroke="#26332c"/><text x="28" y="40" font-size="18" font-weight="700" fill="#e9f2ec">What the survivors turned out to be</text><text x="28" y="62" font-size="12.5" fill="#93a69b">How the hand check sorted the 1,304 flags that survived the model review, across all 50 runs</text><text x="288" y="107" font-size="13" fill="#e9f2ec" text-anchor="end">How the repository is built or dated</text><rect x="300" y="95" width="500.0" height="18" rx="4" fill="#2f9e66"/><text x="808.0" y="109" font-size="12.5" fill="#e9f2ec" font-family="'IBM Plex Mono', ui-monospace, Consolas, monospace" font-weight="600">400</text><text x="841.0" y="109" font-size="12" fill="#93a69b">31%</text><text x="288" y="137" font-size="13" fill="#e9f2ec" text-anchor="end">Lawful (deliberate, cured, no gap)</text><rect x="300" y="125" width="368.8" height="18" rx="4" fill="#2f9e66"/><text x="676.8" y="139" font-size="12.5" fill="#e9f2ec" font-family="'IBM Plex Mono', ui-monospace, Consolas, monospace" font-weight="600">295</text><text x="709.8" y="139" font-size="12" fill="#93a69b">23%</text><text x="288" y="167" font-size="13" fill="#e9f2ec" text-anchor="end">Spent (ran out as planned)</text><rect x="300" y="155" width="303.8" height="18" rx="4" fill="#2f9e66"/><text x="611.8" y="169" font-size="12.5" fill="#e9f2ec" font-family="'IBM Plex Mono', ui-monospace, Consolas, monospace" font-weight="600">243</text><text x="644.8" y="169" font-size="12" fill="#93a69b">19%</text><text x="288" y="197" font-size="13" fill="#e9f2ec" text-anchor="end">Other</text><rect x="300" y="185" width="157.5" height="18" rx="4" fill="#2f9e66"/><text x="465.5" y="199" font-size="12.5" fill="#e9f2ec" font-family="'IBM Plex Mono', ui-monospace, Consolas, monospace" font-weight="600">126</text><text x="498.5" y="199" font-size="12" fill="#93a69b">10%</text><text x="288" y="227" font-size="13" fill="#e9f2ec" text-anchor="end">Misread by a detector</text><rect x="300" y="215" width="127.5" height="18" rx="4" fill="#2f9e66"/><text x="435.5" y="229" font-size="12.5" fill="#e9f2ec" font-family="'IBM Plex Mono', ui-monospace, Consolas, monospace" font-weight="600">102</text><text x="468.5" y="229" font-size="12" fill="#93a69b">8%</text><text x="288" y="257" font-size="13" fill="#e9f2ec" text-anchor="end">Left open</text><rect x="300" y="245" width="96.2" height="18" rx="4" fill="#2f9e66"/><text x="404.2" y="259" font-size="12.5" fill="#e9f2ec" font-family="'IBM Plex Mono', ui-monospace, Consolas, monospace" font-weight="600">77</text><text x="428.2" y="259" font-size="12" fill="#93a69b">6%</text><text x="288" y="287" font-size="13" fill="#e9f2ec" text-anchor="end">Likely real mistake</text><rect x="300" y="275" width="67.5" height="18" rx="4" fill="#d95926"/><text x="375.5" y="289" font-size="12.5" fill="#e9f2ec" font-family="'IBM Plex Mono', ui-monospace, Consolas, monospace" font-weight="600">54</text><text x="399.5" y="289" font-size="12" fill="#93a69b">4%</text><text x="288" y="317" font-size="13" fill="#e9f2ec" text-anchor="end">Not law (decisions, notes, drafts)</text><rect x="300" y="305" width="8.8" height="18" rx="4" fill="#2f9e66"/><text x="316.8" y="319" font-size="12.5" fill="#e9f2ec" font-family="'IBM Plex Mono', ui-monospace, Consolas, monospace" font-weight="600">7</text><text x="331.8" y="319" font-size="12" fill="#93a69b">1%</text></svg>