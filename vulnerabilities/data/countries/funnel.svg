<svg xmlns="http://www.w3.org/2000/svg" width="900" height="312" viewBox="0 0 900 312" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" role="img"><title>From flags to findings</title><rect x="0.5" y="0.5" width="899" height="311" rx="8" fill="#ffffff" stroke="#dfe5e1"/><text x="28" y="40" font-size="18" font-weight="700" fill="#14201a">From flags to findings</text><text x="28" y="62" font-size="12.5" fill="#5f6e66">50 jurisdictions, each run on its own; log scale. The last bar also counts mistakes found by reading categories the model does not review</text><line x1="300.0" y1="104" x2="300.0" y2="280" stroke="#e9eeeb" stroke-width="1"/><text x="300.0" y="96" font-size="11" fill="#5f6e66" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Consolas, monospace">1</text><line x1="381.7" y1="104" x2="381.7" y2="280" stroke="#e9eeeb" stroke-width="1"/><text x="381.7" y="96" font-size="11" fill="#5f6e66" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Consolas, monospace">10</text><line x1="463.3" y1="104" x2="463.3" y2="280" stroke="#e9eeeb" stroke-width="1"/><text x="463.3" y="96" font-size="11" fill="#5f6e66" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Consolas, monospace">100</text><line x1="545.0" y1="104" x2="545.0" y2="280" stroke="#e9eeeb" stroke-width="1"/><text x="545.0" y="96" font-size="11" fill="#5f6e66" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Consolas, monospace">1,000</text><line x1="626.7" y1="104" x2="626.7" y2="280" stroke="#e9eeeb" stroke-width="1"/><text x="626.7" y="96" font-size="11" fill="#5f6e66" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Consolas, monospace">10,000</text><line x1="708.3" y1="104" x2="708.3" y2="280" stroke="#e9eeeb" stroke-width="1"/><text x="708.3" y="96" font-size="11" fill="#5f6e66" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Consolas, monospace">100,000</text><line x1="790.0" y1="104" x2="790.0" y2="280" stroke="#e9eeeb" stroke-width="1"/><text x="790.0" y="96" font-size="11" fill="#5f6e66" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Consolas, monospace">1,000,000</text><text x="28" y="131" font-size="13" fill="#14201a">Flags raised by the detectors</text><rect x="300" y="116" width="445.6" height="22" rx="4" fill="#2a78d6"/><text x="753.6" y="132" font-size="13" font-weight="600" fill="#14201a" font-family="'IBM Plex Mono', ui-monospace, Consolas, monospace">285,589</text><text x="28" y="175" font-size="13" fill="#14201a">Reviewed by a language model</text><rect x="300" y="160" width="311.6" height="22" rx="4" fill="#2a78d6"/><text x="619.6" y="176" font-size="13" font-weight="600" fill="#14201a" font-family="'IBM Plex Mono', ui-monospace, Consolas, monospace">6,535</text><text x="28" y="219" font-size="13" fill="#14201a">Survived the model&#x27;s own rebuttal</text><rect x="300" y="204" width="254.4" height="22" rx="4" fill="#1a7f4b"/><text x="562.4" y="220" font-size="13" font-weight="600" fill="#14201a" font-family="'IBM Plex Mono', ui-monospace, Consolas, monospace">1,304</text><text x="28" y="263" font-size="13" fill="#14201a">Likely real mistakes, found by hand</text><rect x="300" y="248" width="167.7" height="22" rx="4" fill="#eb6834"/><text x="475.7" y="264" font-size="13" font-weight="600" fill="#14201a" font-family="'IBM Plex Mono', ui-monospace, Consolas, monospace">113</text></svg>