<svg xmlns="http://www.w3.org/2000/svg" width="900" height="296" viewBox="0 0 900 296" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" role="img"><title>Problems in the repositories</title><rect x="0.5" y="0.5" width="899" height="295" rx="8" fill="#ffffff" stroke="#dfe5e1"/><text x="28" y="40" font-size="18" font-weight="700" fill="#14201a">Problems in the repositories</text><text x="28" y="62" font-size="12.5" fill="#5f6e66">The 144 problems the hand check found in the repositories themselves, by kind, each with one example</text><text x="198" y="103" font-size="12.5" fill="#14201a" text-anchor="end">Files and layout</text><rect x="210" y="91" width="550.0" height="16" rx="4" fill="#1a7f4b"/><text x="768.0" y="104" font-size="12.5" fill="#14201a" font-family="'IBM Plex Mono', ui-monospace, Consolas, monospace" font-weight="600">60</text><text x="210" y="124" font-size="11.5" fill="#5f6e66">Azerbaijan: the whole text of the Competition Code is held in the file of its Article 84</text><text x="198" y="153" font-size="12.5" fill="#14201a" text-anchor="end">Dated or credited wrongly</text><rect x="210" y="141" width="449.2" height="16" rx="4" fill="#1a7f4b"/><text x="667.2" y="154" font-size="12.5" fill="#14201a" font-family="'IBM Plex Mono', ui-monospace, Consolas, monospace" font-weight="600">49</text><text x="210" y="174" font-size="11.5" fill="#5f6e66">Japan: the tax-measures act&#x27;s changes by Act No. 4 of 2017 are dated 1 May 2017, though they took effect on 1 April</text><text x="198" y="203" font-size="12.5" fill="#14201a" text-anchor="end">Missing or doubled</text><rect x="210" y="191" width="174.2" height="16" rx="4" fill="#1a7f4b"/><text x="392.2" y="204" font-size="12.5" fill="#14201a" font-family="'IBM Plex Mono', ui-monospace, Consolas, monospace" font-weight="600">19</text><text x="210" y="224" font-size="11.5" fill="#5f6e66">Slovakia: the whole history of 1,432 act folders is in the record twice</text><text x="198" y="253" font-size="12.5" fill="#14201a" text-anchor="end">Damaged text</text><rect x="210" y="241" width="146.7" height="16" rx="4" fill="#1a7f4b"/><text x="364.7" y="254" font-size="12.5" fill="#14201a" font-family="'IBM Plex Mono', ui-monospace, Consolas, monospace" font-weight="600">16</text><text x="210" y="274" font-size="11.5" fill="#5f6e66">North Macedonia: in 1,742 acts the Gazette&#x27;s quotation marks came out as the letters &quot;С&quot; and &quot;м&quot;</text></svg>