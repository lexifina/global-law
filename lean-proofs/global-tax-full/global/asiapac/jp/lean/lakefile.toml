name = "JpGlobal"
version = "0.1.0"
defaultTargets = ["JpGlobal", "jpglobal"]

# kernel-2.0 project (cmp20/global/DESIGN.md §6); JpTax = the 1.x model (cmp/jp/lean, not built on the kernel),
# vendored; its Main.lean is JpTax/Legacy.lean with `main` renamed `legacyMain`.
[[require]]
name = "TaxKernel"
path = "../../../../kernel"

[[lean_lib]]
name = "JpTax"

[[lean_lib]]
name = "JpGlobal"

[[lean_exe]]
name = "jpglobal"
root = "JpGlobal.Main"
