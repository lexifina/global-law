name = "TaxKernel"
version = "1.0.0"
defaultTargets = ["TaxKernel", "TaxKernelGlobal"]

# The shared kernel of the 20-country comparison (cmp20/CONTRACT20.md). Lean 4.35 core only.
[[lean_lib]]
name = "TaxKernel"

# Kernel 2.0 (full tax coverage, cmp20/global/DESIGN.md): the modules under TaxKernel.Global (and, from 2.1.0, the
# parts asked for in global/KERNEL_REQUESTS.md under TaxKernel.Global2, imported by nothing else), built by plain
# `lake build`. Not imported by the root `TaxKernel`, so no 1.x model's build changes (checked on all 192
# kernel-built models: cmp20/global/kcheck/adapter.json).
[[lean_lib]]
name = "TaxKernelGlobal"
roots = ["TaxKernel.Global", "TaxKernel.Global2"]

# Fidelity check (not needed by country projects): UK and German rules re-expressed with kernel parts; `lake build kfid`
[[lean_lib]]
name = "Fidelity"
globs = ["Fidelity.+"]

[[lean_exe]]
name = "kfid"
root = "Fidelity.Main"
