<script type="module">

const DATA = window.DATA;

// ---------------- starfield ----------------
{ const n = 9000, p = new Float32Array(n * 3), c = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { const v = V(gauss(), gauss(), gauss()).normalize().multiplyScalar(1400 + R() * 2200); p.set([v.x, v.y, v.z], i * 3);

// ---------------- galaxy: one star per flag ----------------
const J = DATA.jurisdictions;

  j.center = V(r * Math.cos(a), (R() - .5) * 14, r * Math.sin(a)); j.size = 5 + Math.sqrt(j.total) * .42; });

    const v = V(gauss(), gauss() * .32, gauss()).normalize().multiplyScalar(s * Math.pow(R(), .5)).add(j.center); FL.push({ pos: v, kind, j, ...extra(k) }); } };

FL.forEach((f, i) => flagPos.set([f.pos.x, f.pos.y, f.pos.z], i * 3));

{ const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(dustPos, 3)); g.setAttribute('color', new THREE.BufferAttribute(dustCol, 3));

scene.add(new THREE.LineSegments(arcGeo, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false })));

// ---------------- hero: AWaffV § 34 → § 12 ----------------
const hero = new THREE.Group(); hero.position.copy(germany.center).add(V(0, 52, 0)); scene.add(hero);
const glowSphere = (r, color) => new THREE.Mesh(new THREE.IcosahedronGeometry(r, 4), new THREE.MeshBasicMaterial({ color }));
const s34 = glowSphere(2.2, '#eaf2ff'), s12 = glowSphere(2.2, '#7dffb8'), s27 = glowSphere(1.8, '#6aa8ff');
s34.position.set(-16, 0, 0); s12.position.set(16, -2, 2); s27.position.set(10, 13, -14); hero.add(s34, s12, s27);
const beamCurve = new THREE.QuadraticBezierCurve3(s34.position.clone(), V(0, 9, 2), s12.position.clone());
const beam = new THREE.Mesh(new THREE.TubeGeometry(beamCurve, 120, .5, 14), new THREE.MeshBasicMaterial({ color: '#5fe0ff', transparent: true })); hero.add(beam);
const flowN = 60, flowPos = new Float32Array(flowN * 3), flowCol = new Float32Array(flowN * 3);
const flowGeo = new THREE.BufferGeometry(); flowGeo.setAttribute('position', new THREE.BufferAttribute(flowPos, 3)); flowGeo.setAttribute('color', new THREE.BufferAttribute(flowCol, 3));
hero.add(new THREE.Points(flowGeo, pointsMat(2.6)));
const ring = new THREE.Mesh(new THREE.RingGeometry(.9, 1, 96), new THREE.MeshBasicMaterial({ color: '#ff7a5c', transparent: true, side: THREE.DoubleSide })); ring.position.copy(s12.position); hero.add(ring);

const burstGeo = new THREE.BufferGeometry(); burstGeo.setAttribute('position', new THREE.BufferAttribute(burstPos, 3)); burstGeo.setAttribute('color', new THREE.BufferAttribute(burstCol, 3));
hero.add(new THREE.Points(burstGeo, pointsMat(1.1)));

const G = DATA.graphs['Legal.AWaffV.fine_dead'];
const treeOrigin = V(0, -900, 0);
const treeShift = V(-34, 0, 0); const tree = new THREE.Group(); tree.position.copy(treeOrigin).add(treeShift); scene.add(tree);
const maxD = Math.max(...G.nodes.map(n => n.depth));
const byD = {}; G.nodes.forEach(n => (byD[n.depth] = byD[n.depth] || []).push(n));
const NP = {};
Object.entries(byD).forEach(([d, ns]) => { d = +d; ns.forEach((n, i) => { const a = i / ns.length * 6.2831853 + d * .7, r = d === 0 ? 0 : 10 + d * 13;
  NP[n.id] = V(r * Math.cos(a), 34 - d * 19, r * Math.sin(a)); n.legal = n.id.startsWith('Legal'); }); });
const nodeMeshes = {};
G.nodes.forEach(n => { const m = glowSphere(n.depth === 0 ? 2.6 : (n.legal ? 1.25 : .7), n.depth === 0 ? '#ffffff' : (n.legal ? '#f2c46a' : '#5f8fd8'));
  m.position.copy(NP[n.id]); tree.add(m); nodeMeshes[n.id] = m; });
const edges = G.edges.filter(([a, b]) => NP[a] && NP[b]);
const ePos = new Float32Array(edges.length * 6), eCol = new Float32Array(edges.length * 6);
edges.forEach(([a, b], i) => ePos.set([NP[a].x, NP[a].y, NP[a].z, NP[b].x, NP[b].y, NP[b].z], i * 6));
const eGeo = new THREE.BufferGeometry(); eGeo.setAttribute('position', new THREE.BufferAttribute(ePos, 3)); eGeo.setAttribute('color', new THREE.BufferAttribute(eCol, 3));
tree.add(new THREE.LineSegments(eGeo, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false })));
const pulseN = edges.length * 2, pulsePos = new Float32Array(pulseN * 3), pulseCol = new Float32Array(pulseN * 3);
const pGeo = new THREE.BufferGeometry(); pGeo.setAttribute('position', new THREE.BufferAttribute(pulsePos, 3)); pGeo.setAttribute('color', new THREE.BufferAttribute(pulseCol, 3));
tree.add(new THREE.Points(pGeo, pointsMat(2.2)));
const rootRing = new THREE.Mesh(new THREE.RingGeometry(.95, 1, 128), new THREE.MeshBasicMaterial({ color: '#5fd3a0', transparent: true, side: THREE.DoubleSide }));
rootRing.position.copy(NP['Legal.AWaffV.fine_dead']); rootRing.rotation.x = Math.PI / 2; tree.add(rootRing);

const amOrigin = V(0, 900, 0); const am = new THREE.Group(); am.position.copy(amOrigin); scene.add(am);
function column(x) { const g = new THREE.Group(); g.position.x = x; const slabs = [];
  for (let i = 0; i < 8; i++) { const m = new THREE.Mesh(new THREE.BoxGeometry(16, 1.7, 6), new THREE.MeshBasicMaterial({ color: '#16233a', transparent: true }));

const pA = [patch('#f2b24a'), patch('#f2b24a')], pB = [patch('#5fe0ff'), patch('#5fe0ff')], pC = [patch('#ff5ad1'), patch('#ff5ad1')], pD = [patch('#7dff8a'), patch('#7dff8a')], pG = patch('#f2b24a');

const $ = id => document.getElementById(id);
const labels = $('labels'); const labPool = [];
function label(i, text, v3, alpha, cls = '', color = '') { while (labPool.length <= i) { const d = document.createElement('div'); d.className = 'lab'; labels.appendChild(d); labPool.push(d); }

const codeHTML = `<span class="c">-- Cases/AWaffV.lean</span>

window.render = function (t) {

  const heroVis = t > 14 && t < 31.4; hero.visible = heroVis;
  const T0 = 24.6; // § 12 goes
  const dead = seg(t, T0, T0 + .4);
