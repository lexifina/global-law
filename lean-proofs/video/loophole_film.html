<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">

const L = window.LH;
const W = 1920, H = 1080, DUR = 88;
const V = (x, y, z) => new THREE.Vector3(x, y, z);

const mill = n => n >= 1e9 ? '$' + (n / 1e9).toFixed(2) + 'B' : '$' + (n / 1e6).toFixed(1) + 'M';

const R = rng(2026);

{ const n = 6000, p = new Float32Array(n * 3), c = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { const th = R() * 6.283, ph = Math.acos(2 * R() - 1), r = 1500 + R() * 2000; p.set([3000 + r * Math.sin(ph) * Math.cos(th), Math.abs(r * Math.cos(ph)) - 300, r * Math.sin(ph) * Math.sin(th)], i * 3);

// ============ 1. two billions ============

const TH = 60, payTax = L.billion.salary / 1e9;
const towers = [-18, 18].map((x, i) => { const g = new THREE.Group(); g.position.x = x; G1.add(g);
  const shell = box(14, TH, 14, glass()); shell.position.y = TH / 2; edges(shell, '#7cc7ff'); g.add(shell);

// ============ 2. the Roth vault ============
const G2 = new THREE.Group(); G2.position.set(1000, 0, 0); scene.add(G2); grid(1000);
const vault = box(44, 44, 44, glass('#5fe0ff', .07)); vault.position.y = 22; G2.add(vault); const vaultE = edges(vault, '#5fe0ff');

const walker = glow(1.6, '#ffffff'); G3.add(walker);

const MU = .3, CAPH = 15 * MU; // $1M = 0.3 units; the cap is $15M

const names = ['founder', 'spouse', 'A', 'B', 'C', 'A', 'B', 'C', 'GC', 'GC'];
const slices = names.map((n, k) => { const m = ubox(5, 5, solid('#3fdc9a', .3)); m.scale.y = CAPH; G5.add(m); return { m, k, n }; });
const overRed = ubox(5.3, 5.3, solid('#ff5a46', .55)); G5.add(overRed);
const rowX = k => -29 + k * 6.4;

const G6 = new THREE.Group(); G6.position.set(5000, 0, 0); scene.add(G6); grid(5000);
const salt = L.salt, bars = salt.map(([w, r], i) => { const band = r > 4000; const m = ubox(.9, 5, solid(band ? '#ff5a46' : '#3b82f6', band ? .7 : .2)); m.position.x = -50 + i; G6.add(m); return { m, h: r / 100 * .8, band }; });

// ============ 7. ACA cliff ============
const G7 = new THREE.Group(); G7.position.set(6000, 0, 0); scene.add(G7); grid(6000);
const AX = m => (m - 84600) / 400, AY = c => c / 1000 * 1.1;
const plateau = new THREE.Shape(); { const pts = L.aca.filter(([m]) => m <= 84600); plateau.moveTo(AX(70000), 0); pts.forEach(([m, c]) => plateau.lineTo(AX(m), AY(c))); plateau.lineTo(AX(84600), AY(23402)); plateau.lineTo(AX(84600), 0); }

const mesa = new THREE.Mesh(pg7, solid('#2563eb', .18)); G7.add(mesa); edges(mesa, '#8ab4ff');
const cliffEdge = box(.4, AY(23402), 16.4, new THREE.MeshBasicMaterial({ color: '#ff5a46' })); cliffEdge.position.set(AX(84600) + .2, AY(23402) / 2, 0); G7.add(cliffEdge);
const floor7 = box(AX(110000) - AX(84600), .3, 16, solid('#1d2a3a', .1)); floor7.position.set((AX(110000) + AX(84600)) / 2, .15, 0); G7.add(floor7);
const pair7 = [glow(1.1, '#ffffff'), glow(1.1, '#ffd27a')]; pair7.forEach(p => G7.add(p));
const coin7 = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.6, .35, 48), solid('#ffcc55', .6)); coin7.rotation.x = Math.PI / 2; G7.add(coin7);

// ============ overlay ============
const $ = id => document.getElementById(id);
const pool = [];
function label(i, text, v3, a, color = '', cls = 'lab') { while (pool.length <= i) { const d = document.createElement('div'); $('labels').appendChild(d); pool.push(d); }
  const d = pool[i]; d.className = cls; const p = v3.clone().project(camera); if (a <= .01 || p.z > 1) { d.style.opacity = 0; return; }
  d.textContent = text; d.style.color = color; d.style.left = ((p.x + 1) / 2 * W) + 'px'; d.style.top = ((1 - p.y) / 2 * H) + 'px'; d.style.opacity = a; }

const kw = s => `<span class="kw">${s}</span>`, ok = s => `<span class="ok">${s}</span>`, nn = s => `<span class="n">${s}</span>`;

  if (t < S.t5) { const a = (t - S.t4) * .06; return [V(3000 + 95 * Math.sin(-.8 + a), 62, 95 * Math.cos(-.8 + a)), V(3000, 6, 0)]; }
  if (t < S.t6) { const k = ease(seg(t, 58, 61)); return [V(4000 + 20 - 3 * (t - S.t5), 34 - 14 * k, 150 - 78 * k), V(4000 - 4 * k, 22 - 18 * k, 0)]; }

  if (t < S.t8) { const a = (t - S.t7) * .05; return [V(6000 + 4 + 20 * Math.sin(a), 30, 100), V(6000 + 6, 17, 0)]; }

window.render = function (t) {

  $('big').style.opacity = fadeIO(t, .8, 6.6, 1); $('big').style.transform = `translateY(${(1 - easeOut(seg(t, .8, 3))) * 30}px)`;

  towers.forEach((tw, i) => { const fill = easeOut(seg(t, 7.4 + i * .3, 9.4)); tw.gold.scale.y = Math.max(.01, TH * fill);

  for (let i = 0; i < RAIN; i++) { const [x, y0, z, sp] = rain0[i]; const yy = y0 - sp * Math.max(0, t - 18); const stop = 44.5;

  rbVal.g.attributes.color.needsUpdate = true; rbVal.top.material.color.copy(redC.clone().lerp(greenC, stepK));

  stepPlane.position.set(YX(30), VY(life[30].borrowValue) * stepK / 2, 0); stepPlane.scale.set(1, Math.max(.01, VY(life[30].borrowValue) * stepK), 18);
