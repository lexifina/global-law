<style>

.row{display:flex;align-items:center;justify-content:space-between;gap:14px;font:400 20px/1.3 'IBM Plex Sans';color:#c9d4e6;padding:7px 0 7px 16px;border-left:2px solid rgba(140,170,210,.3)}
.bar{display:grid;grid-template-columns:250px 1fr 90px;align-items:center;column-gap:14px;font:400 19px 'JetBrains Mono',monospace;color:#c9d4e6;height:44px}

.cap .num{display:block;font:700 76px/1.05 'Source Serif 4',serif;margin-bottom:6px}
.cap small{display:block;font:400 20px/1.42 'IBM Plex Sans';color:#a6b5cc;margin-top:8px}
.mut{display:grid;grid-template-columns:repeat(14,26px);gap:7px;justify-content:center;margin-top:18px}

.fr{display:grid;grid-template-columns:22px 190px 1fr;column-gap:14px;align-items:center;height:92px;border-top:1px solid rgba(120,160,220,.16)}

.fr .n{font:700 44px 'Source Serif 4',serif;text-align:right}
.fr .l{font:400 21px/1.25 'IBM Plex Sans';color:#d8e2f2}.fr .l small{display:block;font:400 15px 'JetBrains Mono',monospace;color:#8fa2bd;margin-top:3px}
#big{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}

#big .bt{font:700 96px/1.05 'Source Serif 4',serif;margin:0 0 36px;text-shadow:0 0 70px rgba(80,220,160,.25)}
#big .bs{font:400 36px 'IBM Plex Sans';color:#a8b8d0}

#card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}

#card .c2{font:600 50px/1.25 'Source Serif 4',serif;max-width:1500px;margin-top:20px}
#card .c3{margin-top:40px;display:grid;grid-template-columns:auto auto;column-gap:34px;row-gap:14px;text-align:left;font:400 30px/1.35 'IBM Plex Sans';color:#d8e2f2}
#card .c3 .h{font:600 30px 'JetBrains Mono',monospace;color:#eef1f5;text-align:right}
#card .c4{margin-top:34px;font:400 26px 'IBM Plex Sans';color:#a8b8d0}
#heat{position:absolute;left:0;top:0;width:1920px;height:1080px}
svg text{font-family:'IBM Plex Sans',sans-serif}
</style></head><body>
<div id="ov">
  <canvas id="heat" width="1920" height="1080"></canvas>
  <div id="big"><div class="bt">Formalising US Caselaw in Lean</div><div class="bs" id="bs"></div></div>
  <div id="scrim"></div>
  <div class="k" id="k"></div><div class="t" id="tt"></div><div class="s" id="ss"></div>
  <div id="hud"></div>

  <div id="card"></div><div id="fade"></div>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const D = window.CL2, S = D.S;
const W = 1920, H = 1080;
// scene starts; each scene runs to the next start
const T = { sa: 4.6, s2: 10.8, s5: 19.8, s6: 29.8, s8: 37.2, s10: 44.8, s11: 52, s12: 60.6, sb: 68.4, s7: 77, end: 85.6 };
const DUR = 85.6;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const seg = (t, a, b) => clamp((t - a) / (b - a));
const fadeIO = (t, a, b, d = .6) => seg(t, a, a + d) * (1 - seg(t, b - d, b));
function rng(s) { return () => (s = (s * 16807) % 2147483647) / 2147483647; }
const R = rng(2026);
const fmt = n => Math.round(n).toLocaleString('en-US');
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const $ = id => document.getElementById(id);
const CY = '#5fe0ff', AM = '#f2b24a', GR = '#5fd3a0', RD = '#ff6a55', MU = '#8fa2bd';

// ---------- three.js: one camera in which a world unit is a pixel ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1); renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#04070d');
const camera = new THREE.PerspectiveCamera(40, W / H, 1, 12000);
camera.position.set(0, 0, 540 / Math.tan(20 * Math.PI / 180)); camera.lookAt(0, 0, 0);
const composer = new EffectComposer(renderer); composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), .55, .5, .3)); composer.addPass(new OutputPass());
const spriteTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.3, 'rgba(255,255,255,.75)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c); })();
const cloudMat = () => new THREE.ShaderMaterial({ uniforms: { map: { value: spriteTex } }, transparent: true, depthWrite: false, depthTest: false, blending: THREE.AdditiveBlending,
  vertexShader: 'attribute float size; attribute vec3 col; varying vec3 vC; void main(){ vC = col; gl_PointSize = size; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: 'uniform sampler2D map; varying vec3 vC; void main(){ float a = texture2D(map, gl_PointCoord).a; gl_FragColor = vec4(vC, a); }' });
function cloud(n, size) { const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 3), 3)); g.setAttribute('col', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
  g.setAttribute('size', new THREE.BufferAttribute(new Float32Array(n).fill(size), 1));
  const p = new THREE.Points(g, cloudMat()); p.frustumCulled = false; p.visible = false; scene.add(p);
  return { p, pos: g.attributes.position, col: g.attributes.col, size: g.attributes.size }; }
const px = (x, y, z = 0) => [x - 960, 540 - y, z];
const stars = cloud(3600, 4);
for (let i = 0; i < 3600; i++) { const th = R() * 6.283, ph = Math.acos(2 * R() - 1), r = 2600 + R() * 3200;
  stars.pos.array.set([r * Math.sin(ph) * Math.cos(th), r * Math.cos(ph), -Math.abs(r * Math.sin(ph) * Math.sin(th)) - 600], i * 3);
  const b = (.2 + R() * .4) * .45; stars.col.array.set([b * .8, b * .9, b], i * 3); }
stars.p.visible = true;

// ---------- scene 2: the declaration map ----------
const A = D.anat, AX0 = 130, AXW = 1660, AY0 = 446, AYH = 574;
const ax = x => AX0 + (x - A.x0) / (A.x1 - A.x0) * AXW, ay = y => AY0 + y / A.h * AYH;
const v2cols = A.cols.map((c, k) => k).filter(k => A.cols[k].panel === 1);
const CC = A.cols.map(c => new THREE.Color(c.color));
const AD = A.dots.map(([x, y, c, d, thm, users]) => { const p = A.cols[c].panel;
  const born = p === 0 ? T.s2 + .5 + .8 * d / 8 : T.s2 + 2.5 + 3.0 * v2cols.indexOf(c) / v2cols.length + .8 * d / A.maxd;
  return { x: ax(x), y: ay(y), c, p, thm, born, sz: Math.min(4.6, 1.3 + .75 * Math.sqrt(users)) * (p === 0 ? 4.6 : 3.7) + 3 }; });
const adots = cloud(AD.length, 8);
AD.forEach((o, i) => { adots.pos.array.set(px(o.x, o.y), i * 3); adots.size.array[i] = o.sz; });
const NSEG = 8, aedge = (() => { const n = A.edges.length * NSEG * 2, g = new THREE.BufferGeometry(), pa = new Float32Array(n * 3);
  A.edges.forEach(([i, j], e) => { const a = AD[i], b = AD[j], my = (a.y + b.y) / 2;
    const P = u => { const v = 1 - u; return [v * v * v * a.x + 3 * v * v * u * a.x + 3 * v * u * u * b.x + u * u * u * b.x, v * v * v * a.y + 3 * v * v * u * my + 3 * v * u * u * my + u * u * u * b.y]; };
    for (let s = 0; s < NSEG; s++) { pa.set(px(...P(s / NSEG)), (e * NSEG + s) * 6); pa.set(px(...P((s + 1) / NSEG)), (e * NSEG + s) * 6 + 3); } });
  g.setAttribute('position', new THREE.BufferAttribute(pa, 3)); g.setAttribute('color', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
  const l = new THREE.LineSegments(g, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, depthWrite: false, depthTest: false, blending: THREE.AdditiveBlending }));
  l.frustumCulled = false; l.visible = false; scene.add(l); return l; })();

// ---------- scene 3: rows crossing the trust boundary ----------
const NB = 110, BLINE = 598, brow = cloud(NB, 9);
const BR = [...Array(NB)].map((_, i) => ({ x: 170 + R() * 660, ph: R(), bad: i % 9 === 4 }));

// ---------- scene 8: the corpus ----------
const FX0 = 150, FXW = 1040, FY0 = 430, FYH = 560;
const fx = y => FX0 + (Math.max(1790, y) - 1790) / (2026 - 1790) * FXW, fy = r => FY0 + r / 56 * FYH;
const NEU = new THREE.Color('#a9c4ec');
const FCOL = ['#f2b24a', '#ff6a55', '#c58bd6', '#5fe0ff', '#9aa6b5', '#5fd3a0'], FC = FCOL.map(c => new THREE.Color(c));
const CP = D.pts.map(([y, r]) => ({ x: fx(y) + (R() - .5) * 4, y: fy(r) + (R() - .5) * 9, yr: Math.max(1790, y) }));
const cdots = cloud(CP.length, 2.4); CP.forEach((o, i) => cdots.pos.array.set(px(o.x, o.y), i * 3));
const FP = D.fnd.map(([y, r, k]) => ({ x: fx(y) + (R() - .5) * 4, y: fy(r) + (R() - .5) * 9, yr: Math.max(1790, y), k }));
const fdots = cloud(FP.length, 3.6); FP.forEach((o, i) => fdots.pos.array.set(px(o.x, o.y, 1), i * 3));

// ---------- opening: every decision (the v1 film's points) ----------
const OX0 = 430, OXW = 1190, OY0 = 452, OYH = 548, ox = y => OX0 + (Math.max(1790, y) - 1790) / (2026 - 1790) * OXW, oy = r => OY0 + r / (D.v1rows - 1) * OYH;
const OP = D.v1pts.map(([y, r]) => ({ x: ox(y) + (R() - .5) * 4.6, y: oy(r) + (R() - .5) * 8.6, yr: Math.max(1790, y) }));
const odots = cloud(OP.length, 3); OP.forEach((o, i) => odots.pos.array.set(px(o.x, o.y), i * 3));

// ---------- DOM scenes ----------
const st = $('stage');
const mk = (id, html) => { const d = document.createElement('div'); d.className = 'sc'; d.id = id; d.innerHTML = html; st.appendChild(d); return d; };
const at = (a, style = '') => `data-a="${a}" style="${style}"`;
const cnt = (n, a, d = 1.6) => `<span data-n="${n}" data-c="${a}" data-d="${d}">0</span>`;
const chip = (txt, col) => `<span class="chip" style="color:${col}">${txt}</span>`;

// opening labels
mk('sa', [1800, 1850, 1900, 1950, 2000].map(y => `<div class="lab" ${at(.5, `left:${ox(y)}px;top:${OY0 + OYH + 22}px;color:${MU}`)}>${y}</div>`).join('') +
  `<div class="lab" ${at(.5, `left:${OX0 - 18}px;top:${oy(0) - 10}px;color:${MU};transform:translateX(-100%)`)}>Federal courts</div>` +
  `<div class="lab" ${at(.5, `left:${OX0 - 18}px;top:${oy(D.v1rows / 2) - 10}px;color:${MU};transform:translateX(-100%)`)}>the 50 states, DC and territories</div>`);

// scene 2 labels
mk('s2', A.cols.map(c => `<div class="lab" ${at(c.panel ? 2.6 : .5, `left:${ax(c.x + c.w / 2)}px;top:408px;color:${c.color}`)}>${c.name}</div>`).join('') +
  `<div class="tag" ${at(.4, `left:${AX0}px;top:372px`)}>THE FIRST MODEL</div><div class="tag" ${at(2.4, `left:${ax(A.cols[2].x)}px;top:372px`)}>THIS MODEL</div>` +
  `<div ${at(2.2, `left:${(ax(A.cols[1].x + A.cols[1].w) + ax(A.cols[2].x)) / 2}px;top:372px;height:660px;border-left:1px dashed rgba(140,170,210,.35)`)}></div>`);

// scene 3
const PT = D.partial;
mk('s3', `
 <div class="panel" ${at(.5, 'left:120px;top:322px;width:770px')}><div class="ph" style="color:${RD}">Untrusted · may be wrong</div>
   <div class="body">Python and LLM readers, and the doctrine tables. They propose rows: “this court overruled that holding”.<br><small>${fmt(S.treat_rows + S.hist_rows)} treatment and same-case history rows read</small></div></div>
 <div class="panel" ${at(1.3, 'left:1000px;top:322px;width:800px')}><div class="ph">A certificate travels with every row</div>
   <div class="cl" style="grid-template-columns:170px 1fr"><span class="a">quote</span><span>the court’s own words</span><span class="a">offset</span><span>characters ${fmt(PT.start)}–${fmt(PT.end)} of the opinion</span><span class="a">part</span><span>${esc(PT.part)} opinion, not a dissent</span><span class="a">target</span><span>the decision named in the quote</span></div></div>
 <div ${at(2.1, `left:120px;top:${BLINE}px;width:1680px;border-top:2px dashed ${AM}`)}></div>
 <div class="tag" ${at(2.1, `left:1000px;top:${BLINE - 34}px;color:${AM}`)}>TRUST BOUNDARY</div>
 <div class="note" ${at(2.1, `left:1000px;top:${BLINE + 10}px;width:800px`)}>Nothing from above the line is believed unless the checker admits it.</div>
 <div class="panel" ${at(2.9, 'left:120px;top:682px;width:770px')}><div class="ph" style="color:${GR}">Certificate checker · compiled Lean</div>
   <div class="body">Is the quote at that offset, in the majority, naming the target, by a court with the power? Its soundness theorem says what passing means.</div>
   <div class="res"><b>${cnt(S.admitted, 3.4, 2.4)} admitted</b> · <b class="x">${cnt(S.rejected, 3.4, 2.4)} rejected</b></div></div>
 <div class="panel" ${at(4.2, 'left:1000px;top:682px;width:345px;height:196px')}><div class="ph">Spec</div><div class="body">Short definitions a lawyer can read: each rule a default with named exceptions.</div></div>
 <div ${at(4.9, `left:1345px;top:752px;width:110px;text-align:center;font:600 34px 'JetBrains Mono';color:${GR}`)}>⇄<div style="font:600 15px/1.2 'IBM Plex Sans';letter-spacing:.08em;text-transform:uppercase;margin-top:4px">proved<br>equal</div></div>
 <div class="panel" ${at(4.5, 'left:1455px;top:682px;width:345px;height:196px')}><div class="ph">Exec</div><div class="body">The same functions over hash maps, fast enough for 6.9 million decisions.</div></div>
 <div class="note" ${at(5.4, 'left:1000px;top:902px;width:800px')}><b style="color:#eef1f5;font-weight:600">${S.locked} theorems, each statement locked.</b> No sorry, no added axiom, no native_decide.</div>`);

// one worked case
const LW = D.law;
mk('sb', `
 <div class="panel" ${at(.5, 'left:300px;top:300px;width:1320px')}><div class="ph">The decision’s own words <i>· ${esc(LW.by)} · ${esc(LW.by_day)}</i></div><div class="qq">“${esc(LW.quote)}”</div></div>
 <div class="panel" ${at(1.7, 'left:300px;top:448px;width:1320px')}><div class="ph" style="color:${GR}">Lean checks the certificate</div><div class="cl" style="grid-template-columns:230px 1fr">` +
  [['quote at offset', `characters ${fmt(LW.start)}–${fmt(LW.end)} of the opinion <span class="v">✓</span>`], ['part', `${esc(LW.part)} opinion <span class="v">✓</span>`], ['target', `${esc(LW.target)} <span class="v">✓</span>`],
   ['power', `${LW.same_court ? 'the same court' : 'a higher court'} → <span class="v">may overrule</span>`], ['result', `<span class="v">admitted</span> · ${esc(LW.kind)}, scope: ${esc(LW.scope)}`]]
   .map(([x, y], k) => `<span class="a" data-a="${2.1 + k * .4}">${x}</span><span data-a="${2.1 + k * .4}">${y}</span>`).join('') + `</div>
   <div class="res" data-a="4.3" style="font-size:24px"><b class="x">Bowers is overruled from ${esc(LW.from_day)}</b>, on Lean’s reading of the rules.</div></div>
 <div class="panel" ${at(5, 'left:300px;top:772px;width:1320px')}><div class="ph">What later courts say <i>· a note of ${esc(LW.note_day)}, held back from the readers and from Lean</i></div>
   <div class="qq md">“${esc(LW.note)}”</div><div class="res" data-a="5.9"><b>✓ Same answer.</b> ${LW.notes} later notes name Lawrence as the overruling decision.</div></div>`);

// scene 4
const FORCE = [['none', '#66758c'], ['notCitable', '#7c8aa0'], ['citableNoWeight', '#93a1b8'], ['persuasive', '#5fe0ff'], ['persuasiveStrong', '#7fd8c8'], ['bindingAbsentConflict', '#e8c46a'], ['binding', AM]];
