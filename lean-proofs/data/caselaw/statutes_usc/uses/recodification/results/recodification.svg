<text x="1196" y="588" font-family="JetBrains Mono,ui-monospace,monospace" font-size="12" fill="#c9d1db">255 / 39<tspan fill="#ff6a55"></tspan></text>
<rect x="44" y="664" width="12" height="12" rx="2" fill="#2a3a4c"/>
<text x="64" y="675" font-family="IBM Plex Sans,system-ui,sans-serif" font-size="13" fill="#c9d1db">mapped to a new section</text>
<rect x="304" y="664" width="12" height="12" rx="2" fill="#ffb35c"/>
<text x="324" y="675" font-family="IBM Plex Sans,system-ui,sans-serif" font-size="13" fill="#c9d1db">kept as a note, or omitted with a stated reason</text>
<rect x="724" y="664" width="12" height="12" rx="2" fill="#ff6a55"/>
<text x="744" y="675" font-family="IBM Plex Sans,system-ui,sans-serif" font-size="13" fill="#c9d1db">in no table row</text>
<text x="44" y="720" font-family="IBM Plex Sans,system-ui,sans-serif" font-size="16" fill="#d6dbe2">The one provision in no row is 40 U.S.C. 207b-2, Capitol Police bonuses; it lives on at 2 U.S.C. 1927. Lean checks every row against the record.</text>
<text x="44" y="746" font-family="IBM Plex Sans,system-ui,sans-serif" font-size="13" fill="#8b97a6">Title 46: the record does not hold the Appendix, so its provisions are those the table names. Title 46 keeps 396 of its own 404 sections; Code notes account for the other 8.</text>
</svg>