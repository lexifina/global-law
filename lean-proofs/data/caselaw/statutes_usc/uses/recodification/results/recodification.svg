<svg viewBox="0 0 1400 794" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="For six titles of the US Code restated as positive law between 1998 and 2014, the share of old provisions the official tables map to a new section, omit with a reason, or leave unaccounted">
<rect width="1400" height="794" rx="14" fill="#0f1720"/>
