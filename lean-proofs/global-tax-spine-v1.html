    if(d[6])s+='<br><span class="k">'+esc(d[6])+'</span>'}

  const c=nodeCites(n);if(c.length)s+='<br><span class="k">cites</span> '+esc(c.join(' · '));
  if(n[0]==='m'&&M[n[1]][8])s+='<br><span class="k">'+esc(M[n[1]][8])+'</span>';
  return s}
const tt=document.getElementById('tt'), info=document.getElementById('info');
function showTip(v,sx,sy){if(!v){tt.style.display='none';return}tt.innerHTML=describe(v);tt.style.display='block';
  const w=tt.offsetWidth,h=tt.offsetHeight;let x=sx+14,y=sy+14;if(x+w>vw-8)x=sx-w-14;if(y+h>vh-8)y=sy-h-14;tt.style.left=Math.max(8,x)+'px';tt.style.top=Math.max(8,y)+'px'}
function renderInfo(pa){
  if(!sel){info.style.display='none';return}
  let head='';
  if(sel.kind==='node')head=describe({t:'n',i:sel.i});else if(sel.kind==='dust')head=describe({t:'u',k:sel.k});
  else{const m=M[sel.mi],pk=P[m[1]];head='<b>'+esc(m[0])+'</b><br><span class="k">not drawn (outside the sample)</span><br>'+esc(pk[0])+'<br><span class="k">file</span> '+esc(modFile(sel.mi))+'<br><span class="k">lines</span> '+fmt(m[2])+(m[6].length?'<br><span class="k">cites</span> '+esc(m[6].join(' · ')):'')}
  let body='';
  if(pa){const steps=pa.steps;body='<div style="margin-top:8px" class="k">'+(pa.spine?'path to the root along the spine':'shortest import path to the root')+' ('+(steps.length-1)+' steps; grey = not drawn)</div><ol start="0">'+
    steps.map(s=>'<li'+(s.n<0?' class="d"':'')+'>'+esc(s.l)+'</li>').join('')+'</ol>'}
  else if(sel.kind==='dust'||sel.kind==='mod')body='<div style="margin-top:8px" class="k">No path: no country’s Main imports this file, directly or through other modules.</div>';
  info.innerHTML='<button class="x" aria-label="Close">close</button>'+head+body;info.style.display='block';
  info.querySelector('.x').onclick=()=>setSel(null)}
// ---------------------------------------------------------------- pointer: pan, pinch, hover, click
const pts=new Map();let down=null,moved=false,pinch=null;
cv.addEventListener('pointerdown',e=>{try{cv.setPointerCapture(e.pointerId)}catch(_){}pts.set(e.pointerId,[e.clientX,e.clientY]);moved=false;
  if(pts.size===1)down=[e.clientX,e.clientY,tx,ty];
  if(pts.size===2){const[a,b]=[...pts.values()];pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),s:sc}}});
cv.addEventListener('pointermove',e=>{
  if(pts.has(e.pointerId))pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(pts.size===2&&pinch){const[a,b]=[...pts.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);zoomAt(pinch.s*d/pinch.d/sc,(a[0]+b[0])/2,(a[1]+b[1])/2);moved=true;return}
  if(down&&pts.size===1){const dx=e.clientX-down[0],dy=e.clientY-down[1];if(Math.abs(dx)+Math.abs(dy)>4){moved=true;cv.classList.add('drag')}
    if(moved){tx=down[2]+dx;ty=down[3]+dy;dirty=true;showTip(null);return}}
  if(e.pointerType==='mouse'){const v=hit(e.clientX,e.clientY);if((v&&v.t)!==(hover&&hover.t)||(v&&(v.i!==hover.i||v.k!==hover.k))){hover=v;dirty=true}showTip(v,e.clientX,e.clientY)}});
function up(e){pts.delete(e.pointerId);cv.classList.remove('drag');if(pts.size<2)pinch=null;
  if(down&&!moved&&pts.size===0){const v=hit(e.clientX,e.clientY);
    if(!v)setSel(null);else if(v.t==='u')setSel({kind:'dust',k:v.k});else if(v.t==='n')setSel({kind:'node',i:v.i});
    else{const ed=E[v.k];setSel({kind:'node',i:ed[2]==='cross'?ed[0]:ed[1]})}
    if(e.pointerType!=='mouse')showTip(null)}
  if(pts.size===0)down=null}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('pointerleave',()=>{hover=null;showTip(null);dirty=true});
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(Math.exp(-e.deltaY*0.0015),e.clientX,e.clientY)},{passive:false});
document.getElementById('zi').onclick=()=>zoomAt(1.4,vw/2,vh/2);
document.getElementById('zo').onclick=()=>zoomAt(1/1.4,vw/2,vh/2);
document.getElementById('rs').onclick=()=>{fit();setSel(null)};
document.getElementById('dust').onchange=e=>{showDust=e.target.checked;dirty=true};
addEventListener('keydown',e=>{if(e.key==='Escape'){setSel(null);clearSearch()}});
// ---------------------------------------------------------------- search
const q=document.getElementById('q'), res=document.getElementById('res');
function clearSearch(){match=null;res.style.display='none';dirty=true}
function search(s){
  s=s.trim().toLowerCase();if(s.length<2){clearSearch();return}
  const nodes=new Set(),dust=new Set(),list=[];
  const pkHit=P.map(p=>p[0].toLowerCase().includes(s)||p[1]===s);
  const okMod=mi=>{const m=M[mi];return m[0].toLowerCase().includes(s)||pkHit[m[1]]||m[6].some(c=>c.toLowerCase().includes(s))};
  N.forEach((n,i)=>{if(n[0]==='r')return;let ok;
    if(n[0]==='m')ok=okMod(n[1]);else{const d=DC[n[1]];ok=d[0].toLowerCase().includes(s)||pkHit[M[d[2]][1]]||d[5].some(c=>c.toLowerCase().includes(s))}
    if(ok){nodes.add(i);list.push({kind:'node',i,l:nodeName(n),m:(pkgOf(n)||[''])[0]})}});
  DU.forEach((d,k)=>{if(okMod(d.mi)){dust.add(k);list.push({kind:'dust',k,l:M[d.mi][0],m:'dust · '+P[M[d.mi][1]][0]})}});
  let extra=0;const shownMods=new Set(N.filter(n=>n[0]==='m').map(n=>n[1]));const dustMods=new Set(D.dust);
  M.forEach((m,mi)=>{if(!shownMods.has(mi)&&!dustMods.has(mi)&&okMod(mi)){extra++;if(extra<=40)list.push({kind:'mod',mi,l:m[0],m:'not drawn · '+P[m[1]][0]})}});
  match={nodes,dust};dirty=true;
  res.innerHTML='<div class="h">'+nodes.size+' drawn, '+dust.size+' dust, '+extra+' not drawn</div>'+
    list.slice(0,60).map((r,j)=>'<div class="r" tabindex="0" data-j="'+j+'">'+esc(r.l)+' <span class="m">'+esc(r.m)+'</span></div>').join('');
  res.style.display='block';
  res.querySelectorAll('.r').forEach(el=>{const go=()=>{const r=list[+el.dataset.j];
    if(r.kind==='node')setSel({kind:'node',i:r.i});else if(r.kind==='dust'){if(!showDust){showDust=true;document.getElementById('dust').checked=true}setSel({kind:'dust',k:r.k})}else setSel({kind:'mod',mi:r.mi});
    const[x,y]=r.kind==='node'?[X[r.i],Y[r.i]]:r.kind==='dust'?[DU[r.k].x,DU[r.k].y]:[null,null];
    if(x!==null){const[sx,sy]=toS(x,y);if(sx<40||sx>vw-40||sy<80||sy>vh-60){tx+=vw/2-sx;ty+=vh/2-sy;dirty=true}}};
    el.onclick=go;el.onkeydown=e=>{if(e.key==='Enter')go()}})}
let qt=null;q.addEventListener('input',()=>{clearTimeout(qt);qt=setTimeout(()=>search(q.value),160)});
// ---------------------------------------------------------------- static text
document.getElementById('sub').textContent='a '+S.module_spine_steps+'-step import chain through '+fmt(S.lines)+' lines of Lean across '+S.jurisdictions+
  ' jurisdictions, and the files that compile but go nowhere';
const nb=(S.drawn.branch||0)+(S.drawn.name||0)+(S.drawn.main||0);
document.getElementById('lg').innerHTML=
  'trunk = '+S.module_spine_steps+'-step import spine, root → '+esc(S.module_spine[0])+' → '+esc(S.module_spine[S.module_spine.length-1])+'<br>'+
  'branches = '+fmt(nb)+' sampled: '+S.drawn.main+' country Mains, '+((S.drawn.branch||0))+' modules the spine imports or is imported by, '+S.drawn.name+' declarations it names<br>'+
  '<span class="more">tendrils = '+fmt(S.drawn.tendril||0)+' sampled imports or names one step further out · thin lines = other imports between drawn modules<br></span>'+
  'dust = '+fmt(S.dust)+' Lean files no country’s Main reaches (position arbitrary)<br>'+
  '<i class="more">height = longest import chain down to TaxKernel.Basic</i>';
const rows=[['jurisdictions',S.jurisdictions],['Lean files',fmt(S.files)],['Lean lines',fmt(S.lines)],['declarations',fmt(S.decls)],
  ['import edges',fmt(S.import_edges)],['name references',fmt(S.decl_edges)],['spine (imports)',S.module_spine_steps+' steps'],
  ['longest declaration chain',S.spine_steps+' steps'],['dust files',fmt(S.dust)],['dust lines',fmt(S.dust_lines)]];
document.getElementById('stt').innerHTML=rows.map(r=>'<tr><td class="k">'+r[0]+'</td><td>'+r[1]+'</td></tr>').join('')+
  '<tr><td class="k" colspan="2" style="padding-top:4px;max-width:260px">declaration chain: '+esc((S.decl_spine_country||'')+' '+S.decl_spine[0])+' → … → '+esc(S.decl_spine[S.decl_spine.length-1])+'<br>built '+esc(S.built)+'</td></tr>';
if(innerWidth<720)document.getElementById('st').open=false;
resize();loop();
})();
