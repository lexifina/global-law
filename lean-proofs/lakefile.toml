name = "LegalProofs"
version = "0.1.0"
defaultTargets = ["LegalProofs"]

[[lean_lib]]
name = "LegalProofs"

[[lean_lib]]
name = "TaxCode"

[[lean_exe]]
name = "taxcheck"
root = "TaxCode.Main"

# kernel-checked certificates for the confirmed drafting faults (generated by tools/taxcode/certs.py)
[[lean_lib]]
name = "TaxCodeCerts"
roots = ["TaxCode.Certs.All"]

# the French income tax, 2020-2025 (FrTax/README.md)
[[lean_lib]]
name = "FrTax"

[[lean_exe]]
name = "frtax"
root = "FrTax.Main"

# IRS guidance checked against the statute (irs-audit/README.md). The generated run files in irs-audit/lean are run
# with `lake env lean --run`; these are the library modules.
[[lean_lib]]
name = "IrsAudit"
srcDir = "irs-audit/lean"
roots = ["Audit.Flags2", "flags.AfrFlags"]
globs = ["Audit.Formula", "Audit.CPI", "Audit.Alfred", "Audit.Flags2", "flags.AfrFlags"]

# Tax Court penalties and additions to tax against the statute (irs-audit/penalties/README.md)
[[lean_lib]]
name = "TaxCourtPenalties"
srcDir = "irs-audit/penalties/lean"
roots = ["Penalties", "Verified", "Verified2"]
