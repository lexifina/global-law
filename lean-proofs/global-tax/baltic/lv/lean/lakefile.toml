name = "LvTax"
version = "0.1.0"
defaultTargets = ["LvTax", "lvtax"]

# A country project depends on the shared kernel by path. From ~/cmp20/<owner>/<cc>/lean the path is
# "../../../kernel"; this example lives inside the kernel, so its path is "../../..".
[[require]]
name = "TaxKernel"
path = "../../../kernel"

[[lean_lib]]
name = "LvTax"

[[lean_exe]]
name = "lvtax"
root = "LvTax.Main"
