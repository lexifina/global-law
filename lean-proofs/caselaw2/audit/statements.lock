 },
 {
  "name": "CaseLaw2.Cert.checkAnchored_window_hash",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**Anchor window hash**: an admitted anchored row's anchor sits in a well-formed window whose SHA-1, computed by the checker itself, equals the recorded digest; when the hash file is supplied, a digest must have been recorded.",
  "statement": "CaseLaw2.Cert.checkAnchored_window_hash : ∀ (c : CaseLaw2.Cert.Input) (a : CaseLaw2.Cert.Anchor),\n  (CaseLaw2.Cert.checkAnchored c a).admitted = true →\n    ∃ w,\n      CaseLaw2.Cert.coveringWindow (a.input c) = some w ∧\n        CaseLaw2.Cert.quoteAt (a.input c) w = true ∧\n          CaseLaw2.Cert.wellFormed (a.input c) w = true ∧\n            (∀ (s : String), w.hash = some s → CaseLaw2.Sha1.hex w.text = s) ∧\n              (c.hashRequired = true → w.hash.isSome = true)",
