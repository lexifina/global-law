 {
  "name": "CaseLaw2.Cert.checkCert_cite_index",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**Citation-index resolution**: when the citation index is supplied, an admitted row whose target evidence is a citation (and whose quote is not the target's own text) cites a citation that the index resolves to the row's target node: `index(cite) = target`.",
  "statement": "CaseLaw2.Cert.checkCert_cite_index : ∀ (c : CaseLaw2.Cert.Input),\n  (CaseLaw2.Cert.check c).admitted = true →\n    c.selfText = false →\n      c.evidence.startsWith \"cite:\" = true →\n        ∀ (m : Std.HashMap String Nat),\n          c.citeIndex = some m → m.get? (CaseLaw2.Cert.compact (c.evidence.drop 5).toString) = some c.target",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.checkCert_quote_nonempty",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**Non-empty quote** (FB-L2): an admitted row quotes at least one character, at a non-empty span.",
  "statement": "CaseLaw2.Cert.checkCert_quote_nonempty : ∀ (c : CaseLaw2.Cert.Input),\n  (CaseLaw2.Cert.check c).admitted = true → c.quote ≠ \"\" ∧ c.start < c.stop",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.checkCert_sound",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**Certificate soundness**: an admitted row satisfies every condition, and `ok` also has verified power.",
  "statement": "CaseLaw2.Cert.checkCert_sound : ∀ (c : CaseLaw2.Cert.Input),\n  (CaseLaw2.Cert.check c).admitted = true →\n    CaseLaw2.Cert.shaOk c = true ∧\n      (∃ w, CaseLaw2.Cert.coveringWindow c = some w ∧ CaseLaw2.Cert.quoteAt c w = true) ∧\n        CaseLaw2.Cert.hasCue c = true ∧\n          CaseLaw2.Cert.disqualified c = false ∧\n            CaseLaw2.Cert.resolves c = true ∧\n              CaseLaw2.Cert.partOk c = true ∧\n                c.ordered = true ∧\n                  (CaseLaw2.Cert.check c = CaseLaw2.Cert.Result.ok → c.authority = some true) ∧\n                    (CaseLaw2.Cert.check c = CaseLaw2.Cert.Result.okUnverifiedBy → c.authority = none)",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.checkCert_window_hash",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**Window hash** (TRUST.md): an admitted row's quote sits in a well-formed window whose SHA-1, computed by the checker itself (`Sha1.hex`), equals the digest the audit copy recorded for that window; when the hash file is supplied, a digest must have been recorded.",
  "statement": "CaseLaw2.Cert.checkCert_window_hash : ∀ (c : CaseLaw2.Cert.Input),\n  (CaseLaw2.Cert.check c).admitted = true →\n    ∃ w,\n      CaseLaw2.Cert.coveringWindow c = some w ∧\n        CaseLaw2.Cert.quoteAt c w = true ∧\n          CaseLaw2.Cert.wellFormed c w = true ∧\n            (∀ (s : String), w.hash = some s → CaseLaw2.Sha1.hex w.text = s) ∧\n              (c.hashRequired = true → w.hash.isSome = true)",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.checkWitness_inferred",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**A witness row is never explicit**: an admitted witness row carries `explicit = false`, so the event built from it has no status effect (with `Spec.inferred_treatment_no_effect`: `Examples.witness_row_no_effect`).",
  "statement": "CaseLaw2.Cert.checkWitness_inferred : ∀ (c : CaseLaw2.Cert.Input) (w : CaseLaw2.Cert.Witness),\n  (CaseLaw2.Cert.checkWitness c w).admitted = true → w.explicit = false",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.checkWitness_sound",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**Witness soundness**: an admitted witness row is `explicit = 0` with a status-changing kind and a known witness; W's text passes every text check with X as the target; Y is named; the dates are ordered X ≤ Y ≤ W; and W has standing.",
  "statement": "CaseLaw2.Cert.checkWitness_sound : ∀ (c : CaseLaw2.Cert.Input) (w : CaseLaw2.Cert.Witness),\n  (CaseLaw2.Cert.checkWitness c w).admitted = true →\n    w.known = true ∧\n      w.explicit = false ∧\n        w.changes = true ∧\n          (CaseLaw2.Cert.textCheck c).admitted = true ∧\n            CaseLaw2.Cert.byResolves c w = true ∧ c.ordered = true ∧ w.witnessOrdered = true ∧ w.standing = true",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.check_fail_reason",
