  "statement": "@CaseLaw2.Spec.Horty.consistent_sublist : ∀ {Γ Γ' : List CaseLaw2.Spec.Horty.FCase},\n  (∀ (x : CaseLaw2.Spec.Horty.FCase), x ∈ Γ' → x ∈ Γ) →\n    CaseLaw2.Spec.Horty.consistent Γ = true → CaseLaw2.Spec.Horty.consistent Γ' = true",
