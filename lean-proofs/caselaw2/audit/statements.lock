  "statement": "CaseLaw2.Spec.Horty.answers_consistent_iff : ∀ (as : List Bool),\n  CaseLaw2.Spec.Horty.consistent (List.map CaseLaw2.Spec.Horty.answerCase as) = true ↔\n    ∀ (a : Bool), a ∈ as → ∀ (b : Bool), b ∈ as → a = b",
