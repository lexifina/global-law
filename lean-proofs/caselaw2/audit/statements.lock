  "name": "CaseLaw2.Cert.checkHistory_no_anchor",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**No anchor, no change**: a history row without an anchor line gets `check`'s verdict.",
  "statement": "CaseLaw2.Cert.checkHistory_no_anchor : ∀ (c : CaseLaw2.Cert.Input),\n  CaseLaw2.Cert.checkHistory c none = CaseLaw2.Cert.check c",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.checkJoinedFarWith_rel",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "",
  "statement": "CaseLaw2.Cert.checkJoinedFarWith_rel : ∀ (fr : CaseLaw2.Cert.Input → CaseLaw2.Cert.Joined → Option CaseLaw2.Cert.Reason)\n  (c : CaseLaw2.Cert.Input) (e : Bool) (cl : CaseLaw2.Cert.TClaim) (js : List CaseLaw2.Cert.Joined),\n  (CaseLaw2.Cert.checkJoinedFarWith fr c e cl js).admitted = true →\n    List.findSome? (CaseLaw2.Cert.farRelWith fr cl c) js = none",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.checkJoinedFar_eq",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "A row the joined check admits gets the same verdict from the far check.",
  "statement": "CaseLaw2.Cert.checkJoinedFar_eq : ∀ (fr : CaseLaw2.Cert.Input → CaseLaw2.Cert.Joined → Option CaseLaw2.Cert.Reason)\n  (c : CaseLaw2.Cert.Input) (e : Bool) (cl : CaseLaw2.Cert.TClaim) (js : List CaseLaw2.Cert.Joined),\n  (CaseLaw2.Cert.checkJoined c e cl js).admitted = true →\n    CaseLaw2.Cert.checkJoinedFarWith fr c e cl js = CaseLaw2.Cert.checkJoined c e cl js",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.checkJoined_admitted_bool",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "The six checks as booleans (the form the other theorems unpack).",
  "statement": "CaseLaw2.Cert.checkJoined_admitted_bool : ∀ (c : CaseLaw2.Cert.Input) (e : Bool) (cl : CaseLaw2.Cert.TClaim)\n  (js : List CaseLaw2.Cert.Joined),\n  (CaseLaw2.Cert.checkJoined c e cl js).admitted = true ↔\n    (CaseLaw2.Cert.joinedCountOk js && js.all (CaseLaw2.Cert.joinedQuoteOk c)) = true ∧\n      js.all CaseLaw2.Cert.joinedPartOk = true ∧\n        js.any (CaseLaw2.Cert.joinedDisqualified c) = false ∧\n          js.all (CaseLaw2.Cert.relationOk cl c) = true ∧\n            js.any (CaseLaw2.Cert.joinedResolves c) = true ∧\n              (CaseLaw2.Cert.mainCheck\n                    { kind := c.kind, textSha := c.textSha, start := c.start, stop := c.stop, quote := c.quote,\n                      evidence := c.evidence, part := c.part, shas := c.shas, windows := c.windows,\n                      ordered := c.ordered, authority := c.authority, selfText := true, hashRequired := c.hashRequired,\n                      target := c.target, citeIndex := c.citeIndex, mode := c.mode }\n                    e cl).admitted =\n                true",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.checkJoined_admitted_iff",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**Admission is exactly the six checks** (with the count bound in check 1).",
  "statement": "CaseLaw2.Cert.checkJoined_admitted_iff : ∀ (c : CaseLaw2.Cert.Input) (e : Bool) (cl : CaseLaw2.Cert.TClaim)\n  (js : List CaseLaw2.Cert.Joined),\n  (CaseLaw2.Cert.checkJoined c e cl js).admitted = true ↔\n    CaseLaw2.Cert.joinedCountOk js = true ∧\n      (∀ (j : CaseLaw2.Cert.Joined), j ∈ js → CaseLaw2.Cert.joinedQuoteOk c j = true) ∧\n        (∀ (j : CaseLaw2.Cert.Joined), j ∈ js → CaseLaw2.Cert.joinedPartOk j = true) ∧\n          (∀ (j : CaseLaw2.Cert.Joined), j ∈ js → CaseLaw2.Cert.joinedDisqualified c j = false) ∧\n            (∀ (j : CaseLaw2.Cert.Joined), j ∈ js → CaseLaw2.Cert.relationOk cl c j = true) ∧\n              (∃ j, j ∈ js ∧ CaseLaw2.Cert.joinedResolves c j = true) ∧\n                (CaseLaw2.Cert.mainCheck\n                      { kind := c.kind, textSha := c.textSha, start := c.start, stop := c.stop, quote := c.quote,\n                        evidence := c.evidence, part := c.part, shas := c.shas, windows := c.windows,\n                        ordered := c.ordered, authority := c.authority, selfText := true,\n                        hashRequired := c.hashRequired, target := c.target, citeIndex := c.citeIndex, mode := c.mode }\n                      e cl).admitted =\n                  true",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.checkJoined_bounded",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**One or two joined lines.**",
  "statement": "CaseLaw2.Cert.checkJoined_bounded : ∀ (c : CaseLaw2.Cert.Input) (e : Bool) (cl : CaseLaw2.Cert.TClaim)\n  (js : List CaseLaw2.Cert.Joined),\n  (CaseLaw2.Cert.checkJoined c e cl js).admitted = true → 1 ≤ js.length ∧ js.length ≤ 2",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.checkJoined_cite_index",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**Citation index**: with a citation index and `cite:` evidence, an admitted joined row's citation is one the index resolves to the row's target node.",
  "statement": "CaseLaw2.Cert.checkJoined_cite_index : ∀ (c : CaseLaw2.Cert.Input) (e : Bool) (cl : CaseLaw2.Cert.TClaim)\n  (js : List CaseLaw2.Cert.Joined),\n  (CaseLaw2.Cert.checkJoined c e cl js).admitted = true →\n    c.evidence.startsWith \"cite:\" = true →\n      ∀ (m : Std.HashMap String Nat),\n        c.citeIndex = some m → m.get? (CaseLaw2.Cert.compact (c.evidence.drop 5).toString) = some c.target",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.checkJoined_disposition",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**The main quote of an admitted joined row**: every conjunct of `checkCert_sound` except `resolves` (a joined quote carries the target evidence), read in the row's mode: a known hash, the quote at its offset in a usable window, a cue, no disqualifier, an allowed part, the date order.",
  "statement": "CaseLaw2.Cert.checkJoined_disposition : ∀ (c : CaseLaw2.Cert.Input) (e : Bool) (cl : CaseLaw2.Cert.TClaim)\n  (js : List CaseLaw2.Cert.Joined),\n  (CaseLaw2.Cert.checkJoined c e cl js).admitted = true →\n    CaseLaw2.Cert.shaOk c = true ∧\n      (∃ w, CaseLaw2.Cert.coveringWindow c = some w ∧ CaseLaw2.Cert.quoteAt c w = true) ∧\n        CaseLaw2.Cert.hasCue (cl.apply c) = true ∧\n          CaseLaw2.Cert.disqualified (cl.apply c) = false ∧ CaseLaw2.Cert.partOk c = true ∧ c.ordered = true",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.checkJoined_quote_nonempty",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**Joined quotes are non-empty**, each at a non-empty span.",
  "statement": "CaseLaw2.Cert.checkJoined_quote_nonempty : ∀ (c : CaseLaw2.Cert.Input) (e : Bool) (cl : CaseLaw2.Cert.TClaim)\n  (js : List CaseLaw2.Cert.Joined),\n  (CaseLaw2.Cert.checkJoined c e cl js).admitted = true →\n    ∀ (j : CaseLaw2.Cert.Joined), j ∈ js → j.quote ≠ \"\" ∧ j.start < j.stop",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.checkJoined_sound",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**Joined soundness**: every joined quote at its offset in a usable window of the row's own text, from the opinion of the court, without disqualifier, its relation holding; the evidence in one joined quote; the main check with the evidence taken as given admits, and its verdict is the row's.",
  "statement": "CaseLaw2.Cert.checkJoined_sound : ∀ (c : CaseLaw2.Cert.Input) (e : Bool) (cl : CaseLaw2.Cert.TClaim)\n  (js : List CaseLaw2.Cert.Joined),\n  (CaseLaw2.Cert.checkJoined c e cl js).admitted = true →\n    (∀ (j : CaseLaw2.Cert.Joined),\n        j ∈ js →\n          ∃ w,\n            CaseLaw2.Cert.coveringWindow (j.input c) = some w ∧\n              w ∈ c.windows ∧ CaseLaw2.Cert.usable (j.input c) w = true ∧ CaseLaw2.Cert.quoteAt (j.input c) w = true) ∧\n      (∀ (j : CaseLaw2.Cert.Joined), j ∈ js → CaseLaw2.Cert.joinedPartOk j = true) ∧\n        (∀ (j : CaseLaw2.Cert.Joined), j ∈ js → CaseLaw2.Cert.joinedDisqualified c j = false) ∧\n          (∀ (j : CaseLaw2.Cert.Joined), j ∈ js → CaseLaw2.Cert.relationOk cl c j = true) ∧\n            (∃ j, j ∈ js ∧ CaseLaw2.Cert.joinedResolves c j = true) ∧\n              (CaseLaw2.Cert.mainCheck\n                      { kind := c.kind, textSha := c.textSha, start := c.start, stop := c.stop, quote := c.quote,\n                        evidence := c.evidence, part := c.part, shas := c.shas, windows := c.windows,\n                        ordered := c.ordered, authority := c.authority, selfText := true,\n                        hashRequired := c.hashRequired, target := c.target, citeIndex := c.citeIndex, mode := c.mode }\n                      e cl).admitted =\n                  true ∧\n                CaseLaw2.Cert.checkJoined c e cl js =\n                  CaseLaw2.Cert.mainCheck\n                    { kind := c.kind, textSha := c.textSha, start := c.start, stop := c.stop, quote := c.quote,\n                      evidence := c.evidence, part := c.part, shas := c.shas, windows := c.windows,\n                      ordered := c.ordered, authority := c.authority, selfText := true, hashRequired := c.hashRequired,\n                      target := c.target, citeIndex := c.citeIndex, mode := c.mode }\n                    e cl",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.checkJoined_text",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "The joined check admits with the power taken as verified whenever it admits.",
  "statement": "CaseLaw2.Cert.checkJoined_text : ∀ (c : CaseLaw2.Cert.Input) (e : Bool) (cl : CaseLaw2.Cert.TClaim)\n  (js : List CaseLaw2.Cert.Joined),\n  (CaseLaw2.Cert.checkJoined c e cl js).admitted = true →\n    (CaseLaw2.Cert.checkJoined\n          { kind := c.kind, textSha := c.textSha, start := c.start, stop := c.stop, quote := c.quote,\n            evidence := c.evidence, part := c.part, shas := c.shas, windows := c.windows, ordered := c.ordered,\n            authority := some true, selfText := c.selfText, hashRequired := c.hashRequired, target := c.target,\n            citeIndex := c.citeIndex, mode := c.mode }\n          e cl js).admitted =\n      true",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.checkJoined_window_hash",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**Joined window hash**: every joined quote sits in a well-formed window whose SHA-1, computed by the checker, is the recorded digest; when the hash file is supplied a digest must have been recorded.",
  "statement": "CaseLaw2.Cert.checkJoined_window_hash : ∀ (c : CaseLaw2.Cert.Input) (e : Bool) (cl : CaseLaw2.Cert.TClaim)\n  (js : List CaseLaw2.Cert.Joined),\n  (CaseLaw2.Cert.checkJoined c e cl js).admitted = true →\n    ∀ (j : CaseLaw2.Cert.Joined),\n      j ∈ js →\n        ∃ w,\n          CaseLaw2.Cert.coveringWindow (j.input c) = some w ∧\n            CaseLaw2.Cert.quoteAt (j.input c) w = true ∧\n              CaseLaw2.Cert.wellFormed (j.input c) w = true ∧\n                (∀ (s : String), w.hash = some s → CaseLaw2.Sha1.hex w.text = s) ∧\n                  (c.hashRequired = true → w.hash.isSome = true)",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.checkOperative_sound",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**Operative-words soundness**: an admitted operative-words row is an explicit `disapproved` row whose quote has an operative cue and none of the round-4 or operative disqualifiers, names the target in the quote itself, and passes every other check of `check`.",
  "statement": "CaseLaw2.Cert.checkOperative_sound : ∀ (c : CaseLaw2.Cert.Input) (explicit : Bool),\n  (CaseLaw2.Cert.checkOperative c explicit).admitted = true →\n    c.kind = CaseLaw2.Cert.Kind.treat CaseLaw2.TKind.disapproved ∧\n      explicit = true ∧\n        (CaseLaw2.Cert.check\n                { kind := c.kind, textSha := c.textSha, start := c.start, stop := c.stop, quote := c.quote,\n                  evidence := c.evidence, part := c.part, shas := c.shas, windows := c.windows, ordered := c.ordered,\n                  authority := c.authority, selfText := c.selfText, hashRequired := c.hashRequired, target := c.target,\n                  citeIndex := c.citeIndex, mode := CaseLaw2.Cert.Mode.operative }).admitted =\n            true ∧\n          CaseLaw2.Cert.hasCue\n                { kind := c.kind, textSha := c.textSha, start := c.start, stop := c.stop, quote := c.quote,\n                  evidence := c.evidence, part := c.part, shas := c.shas, windows := c.windows, ordered := c.ordered,\n                  authority := c.authority, selfText := c.selfText, hashRequired := c.hashRequired, target := c.target,\n                  citeIndex := c.citeIndex, mode := CaseLaw2.Cert.Mode.operative } =\n              true ∧\n            CaseLaw2.Cert.disqualified\n                  { kind := c.kind, textSha := c.textSha, start := c.start, stop := c.stop, quote := c.quote,\n                    evidence := c.evidence, part := c.part, shas := c.shas, windows := c.windows, ordered := c.ordered,\n                    authority := c.authority, selfText := c.selfText, hashRequired := c.hashRequired,\n                    target := c.target, citeIndex := c.citeIndex, mode := CaseLaw2.Cert.Mode.operative } =\n                false ∧\n              CaseLaw2.Cert.resolves\n                  { kind := c.kind, textSha := c.textSha, start := c.start, stop := c.stop, quote := c.quote,\n                    evidence := c.evidence, part := c.part, shas := c.shas, windows := c.windows, ordered := c.ordered,\n                    authority := c.authority, selfText := c.selfText, hashRequired := c.hashRequired,\n                    target := c.target, citeIndex := c.citeIndex, mode := CaseLaw2.Cert.Mode.operative } =\n                true",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.checkRecognised_fallback",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**Fallback**: a row that is not recognised has exactly its round-4 witness verdict.",
  "statement": "CaseLaw2.Cert.checkRecognised_fallback : ∀ (c : CaseLaw2.Cert.Input) (w : CaseLaw2.Cert.Witness),\n  (CaseLaw2.Cert.checkRecognised c w).isRecognised = false →\n    CaseLaw2.Cert.checkRecognised c w = CaseLaw2.Cert.RResult.witness (CaseLaw2.Cert.checkWitness c w)",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.checkRecognised_needs_power",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**Never without W's power**: a witness row whose W lacks power over X is never recognised.",
  "statement": "CaseLaw2.Cert.checkRecognised_needs_power : ∀ (c : CaseLaw2.Cert.Input) (w : CaseLaw2.Cert.Witness),\n  w.power = false → (CaseLaw2.Cert.checkRecognised c w).isRecognised = false",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.checkRecognised_no_claim",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**No claim, no change**: without a `recognised` claim the verdict is the round-4 witness verdict.",
  "statement": "CaseLaw2.Cert.checkRecognised_no_claim : ∀ (c : CaseLaw2.Cert.Input) (w : CaseLaw2.Cert.Witness),\n  w.claim = false → CaseLaw2.Cert.checkRecognised c w = CaseLaw2.Cert.RResult.witness (CaseLaw2.Cert.checkWitness c w)",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.checkRecognised_sound",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**Recognition soundness**: a recognised row made the claim; W has power over X; the three dates are known; the two names differ; and the row passes every witness check read in `recog` mode: it is `explicit = 0` with a status-changing kind, W's text passes the text checks (recognition cue, no recognition disqualifier, X named in the quote, majority part), Y is named in the quote, the dates are ordered X ≤ Y ≤ W, and W has standing.",
  "statement": "CaseLaw2.Cert.checkRecognised_sound : ∀ (c : CaseLaw2.Cert.Input) (w : CaseLaw2.Cert.Witness),\n  (CaseLaw2.Cert.checkRecognised c w).isRecognised = true →\n    w.claim = true ∧\n      w.power = true ∧\n        w.datesKnown = true ∧\n          CaseLaw2.Cert.distinctEvidence c w = true ∧\n            w.known = true ∧\n              w.explicit = false ∧\n                w.changes = true ∧\n                  (CaseLaw2.Cert.textCheck\n                          { kind := c.kind, textSha := c.textSha, start := c.start, stop := c.stop, quote := c.quote,\n                            evidence := c.evidence, part := c.part, shas := c.shas, windows := c.windows,\n                            ordered := c.ordered, authority := c.authority, selfText := c.selfText,\n                            hashRequired := c.hashRequired, target := c.target, citeIndex := c.citeIndex,\n                            mode := CaseLaw2.Cert.Mode.recog }).admitted =\n                      true ∧\n                    CaseLaw2.Cert.byResolves\n                          { kind := c.kind, textSha := c.textSha, start := c.start, stop := c.stop, quote := c.quote,\n                            evidence := c.evidence, part := c.part, shas := c.shas, windows := c.windows,\n                            ordered := c.ordered, authority := c.authority, selfText := c.selfText,\n                            hashRequired := c.hashRequired, target := c.target, citeIndex := c.citeIndex,\n                            mode := CaseLaw2.Cert.Mode.recog }\n                          w =\n                        true ∧\n                      c.ordered = true ∧ w.witnessOrdered = true ∧ w.standing = true",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.checkTreatment9_sound",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "An admitted round-9 treatments row whose node has zones: round 7's step admits it, with the same verdict; its main quote and every joined quote lie inside a zone of their parts.",
  "statement": "CaseLaw2.Cert.checkTreatment9_sound : ∀ (zs : List CaseLaw2.Cert.Zone) (c : CaseLaw2.Cert.Input) (e : Bool)\n  (cl : CaseLaw2.Cert.TClaim) (js : List CaseLaw2.Cert.Joined),\n  zs ≠ [] →\n    (CaseLaw2.Cert.checkTreatment9 zs c e cl js).admitted = true →\n      (CaseLaw2.Cert.checkTreatment c e cl js).admitted = true ∧\n        CaseLaw2.Cert.checkTreatment9 zs c e cl js = CaseLaw2.Cert.checkTreatment c e cl js ∧\n          (∃ z, z ∈ zs ∧ z.start ≤ c.start ∧ c.stop ≤ z.stop ∧ z.part = c.part) ∧\n            ∀ (j : CaseLaw2.Cert.Joined), j ∈ js → ∃ z, z ∈ zs ∧ z.start ≤ j.start ∧ j.stop ≤ z.stop ∧ z.part = j.part",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.checkTreatment_joined",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**A row with joined lines is the joined check's**: under the round-7 treatment step, an admitted row with joined lines passes `checkJoined` (a doctrine row in doctrine mode).",
  "statement": "CaseLaw2.Cert.checkTreatment_joined : ∀ (c : CaseLaw2.Cert.Input) (e : Bool) (cl : CaseLaw2.Cert.TClaim)\n  (js : List CaseLaw2.Cert.Joined),\n  js ≠ [] →\n    (CaseLaw2.Cert.checkTreatment c e cl js).admitted = true → (CaseLaw2.Cert.checkJoined c e cl js).admitted = true",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.checkTreatment_text",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**The text check**: a treatments row admitted under a rule set is admitted with the acting court's power taken as verified (so the doctrine collision set, which is read on the text check, holds every admitted doctrine row).",
  "statement": "CaseLaw2.Cert.checkTreatment_text : ∀ (c : CaseLaw2.Cert.Input) (e : Bool) (cl : CaseLaw2.Cert.TClaim)\n  (js : List CaseLaw2.Cert.Joined),\n  (CaseLaw2.Cert.checkTreatment c e cl js).admitted = true →\n    (CaseLaw2.Cert.checkTreatment\n          { kind := c.kind, textSha := c.textSha, start := c.start, stop := c.stop, quote := c.quote,\n            evidence := c.evidence, part := c.part, shas := c.shas, windows := c.windows, ordered := c.ordered,\n            authority := some true, selfText := c.selfText, hashRequired := c.hashRequired, target := c.target,\n            citeIndex := c.citeIndex, mode := c.mode }\n          e cl js).admitted =\n      true",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.checkWitness_inferred",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**A witness row is never explicit**: an admitted witness row carries `explicit = false`, so the event built from it has no status effect (with `Spec.inferred_treatment_no_effect`: `Examples.witness_row_no_effect`).",
  "statement": "CaseLaw2.Cert.checkWitness_inferred : ∀ (c : CaseLaw2.Cert.Input) (w : CaseLaw2.Cert.Witness),\n  (CaseLaw2.Cert.checkWitness c w).admitted = true → w.explicit = false",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.checkWitness_sound",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**Witness soundness**: an admitted witness row is `explicit = 0` with a status-changing kind and a known witness; W's text passes every text check with X as the target; Y is named; the dates are ordered X ≤ Y ≤ W; and W has standing.",
  "statement": "CaseLaw2.Cert.checkWitness_sound : ∀ (c : CaseLaw2.Cert.Input) (w : CaseLaw2.Cert.Witness),\n  (CaseLaw2.Cert.checkWitness c w).admitted = true →\n    w.known = true ∧\n      w.explicit = false ∧\n        w.changes = true ∧\n          (CaseLaw2.Cert.textCheck c).admitted = true ∧\n            CaseLaw2.Cert.byResolves c w = true ∧ c.ordered = true ∧ w.witnessOrdered = true ∧ w.standing = true",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.check_fail_reason",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "Each rejection names the first failing condition: a rejected row carries exactly one reason code.",
  "statement": "CaseLaw2.Cert.check_fail_reason : ∀ (c : CaseLaw2.Cert.Input) (r : CaseLaw2.Cert.Reason),\n  CaseLaw2.Cert.check c = CaseLaw2.Cert.Result.fail r →\n    (r = CaseLaw2.Cert.Reason.shaUnknown ↔ CaseLaw2.Cert.shaOk c = false)",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.check_text",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "`check` admits with the power taken as verified whenever it admits.",
  "statement": "CaseLaw2.Cert.check_text : ∀ (c : CaseLaw2.Cert.Input),\n  (CaseLaw2.Cert.check c).admitted = true →\n    (CaseLaw2.Cert.check\n          { kind := c.kind, textSha := c.textSha, start := c.start, stop := c.stop, quote := c.quote,\n            evidence := c.evidence, part := c.part, shas := c.shas, windows := c.windows, ordered := c.ordered,\n            authority := some true, selfText := c.selfText, hashRequired := c.hashRequired, target := c.target,\n            citeIndex := c.citeIndex, mode := c.mode }).admitted =\n      true",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.citeOf_key",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "The key `citeOf` looks up: `L ≥ 1` consecutive alphanumeric characters of the quote.",
  "statement": "CaseLaw2.Cert.citeOf_key : ∀ (m : Std.HashMap String Nat) (s : List (Char × Nat)) (L n : Nat),\n  CaseLaw2.Cert.citeOf m s L = some n →\n    0 < L ∧ (List.take L s).length = L ∧ m.get? (String.ofList (List.map (fun x => x.fst) (List.take L s))) = some n",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.classOf7_no_doctrine",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**Without a doctrine row the class is round 5's.**",
  "statement": "CaseLaw2.Cert.classOf7_no_doctrine : ∀ (e r : Bool) (q : String),\n  CaseLaw2.Cert.classOf7 e r false q = CaseLaw2.Cert.classOf e r q",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.classOf_recognised_iff",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "A row is classed `recognised` exactly when the recognised check passed.",
  "statement": "CaseLaw2.Cert.classOf_recognised_iff : ∀ (explicit recognised : Bool) (quote : String),\n  CaseLaw2.Cert.classOf explicit recognised quote = CaseLaw2.Cert.OClass.recognised ↔ recognised = true",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.doctrineTie_label",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**Doctrine tie**: an admitted row's `doctrineTie` line is on a doctrine row; its label has two words or more and eight characters or more and occurs in both quotes; the joined quote has a tie cue.",
  "statement": "CaseLaw2.Cert.doctrineTie_label : ∀ (c : CaseLaw2.Cert.Input) (e : Bool) (cl : CaseLaw2.Cert.TClaim)\n  (js : List CaseLaw2.Cert.Joined),\n  (CaseLaw2.Cert.checkJoined c e cl js).admitted = true →\n    ∀ (j : CaseLaw2.Cert.Joined),\n      j ∈ js →\n        j.rel = CaseLaw2.Cert.JRel.doctrineTie →\n          cl = CaseLaw2.Cert.TClaim.doctrine ∧\n            CaseLaw2.Cert.labelOk j.label = true ∧\n              CaseLaw2.Cert.labelIn c.quote j.label = true ∧\n                CaseLaw2.Cert.labelIn j.quote j.label = true ∧ CaseLaw2.Cert.tieCue j.quote = true",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.doctrine_unique",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**Doctrine uniqueness**: two doctrine rows admitted after the table's uniqueness test, each admitted only when its text check passed, that share a compact label have the same target.",
  "statement": "CaseLaw2.Cert.doctrine_unique : ∀ (rows : List CaseLaw2.Cert.DoctrineRow) (r1 r2 : CaseLaw2.Cert.DoctrineRow),\n  r1 ∈ rows →\n    r2 ∈ rows →\n      ∀ (v1 v2 : CaseLaw2.Cert.Result),\n        (CaseLaw2.Cert.doctrineFinal rows r1 v1).admitted = true →\n          (CaseLaw2.Cert.doctrineFinal rows r2 v2).admitted = true →\n            (v1.admitted = true → r1.text = true) →\n              (v2.admitted = true → r2.text = true) →\n                ∀ (l : String), l ∈ r1.labels → l ∈ r2.labels → r1.target = r2.target",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.farKeyOk_spec",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "",
  "statement": "CaseLaw2.Cert.farKeyOk_spec : ∀ (lens : List Nat) (c : CaseLaw2.Cert.Input) (j : CaseLaw2.Cert.Joined)\n  (w : CaseLaw2.Cert.Window),\n  CaseLaw2.Cert.farKeyOk lens c j w = true →\n    ∀ (m : Std.HashMap String Nat),\n      c.citeIndex = some m →\n        ∀ (s : List (Char × Nat)),\n          s <:+ CaseLaw2.Cert.farAlnum c j w →\n            ∀ (p : Nat),\n              CaseLaw2.Cert.headPos s = some p →\n                p < c.start - j.stop →\n                  ∀ (L : Nat), L ∈ lens → ∀ (n : Nat), CaseLaw2.Cert.citeOf m s L = some n → n = c.target",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.farRel_none",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "",
  "statement": "CaseLaw2.Cert.farRel_none : ∀ (lens : List Nat) (cl : CaseLaw2.Cert.TClaim) (c : CaseLaw2.Cert.Input)\n  (j : CaseLaw2.Cert.Joined),\n  j.rel = CaseLaw2.Cert.JRel.antecedent →\n    CaseLaw2.Cert.farRelWith (CaseLaw2.Cert.farReason lens) cl c j = none →\n      j.stop ≤ c.start ∧\n        c.start - j.stop ≤ CaseLaw2.Cert.joinedFarMax ∧\n          CaseLaw2.Cert.anaphorCue c.quote = true ∧\n            CaseLaw2.Cert.kindCue c = true ∧\n              (c.start - j.stop ≤ CaseLaw2.Cert.joinedGapMax ∨\n                ∃ w,\n                  w ∈ c.windows ∧\n                    CaseLaw2.Cert.usable (CaseLaw2.Cert.farInput c j) w = true ∧\n                      ∀ (m : Std.HashMap String Nat),\n                        c.citeIndex = some m →\n                          ∀ (s : List (Char × Nat)),\n                            s <:+ CaseLaw2.Cert.farAlnum c j w →\n                              ∀ (p : Nat),\n                                CaseLaw2.Cert.headPos s = some p →\n                                  p < c.start - j.stop →\n                                    ∀ (L : Nat),\n                                      L ∈ lens → ∀ (n : Nat), CaseLaw2.Cert.citeOf m s L = some n → n = c.target)",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.farWindow_some",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "",
  "statement": "CaseLaw2.Cert.farWindow_some : ∀ (c : CaseLaw2.Cert.Input) (j : CaseLaw2.Cert.Joined) (w : CaseLaw2.Cert.Window),\n  CaseLaw2.Cert.farWindow c j = some w → w ∈ c.windows ∧ CaseLaw2.Cert.usable (CaseLaw2.Cert.farInput c j) w = true",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.findSome_farRel_none",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "",
  "statement": "CaseLaw2.Cert.findSome_farRel_none : ∀ (fr : CaseLaw2.Cert.Input → CaseLaw2.Cert.Joined → Option CaseLaw2.Cert.Reason)\n  (cl : CaseLaw2.Cert.TClaim) (c : CaseLaw2.Cert.Input) (js : List CaseLaw2.Cert.Joined),\n  js.all (CaseLaw2.Cert.relationOk cl c) = true → List.findSome? (CaseLaw2.Cert.farRelWith fr cl c) js = none",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.firstCue_some",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "",
  "statement": "CaseLaw2.Cert.firstCue_some : ∀ (k : CaseLaw2.Cert.Kind) (p1 : Nat) (q : List Char) (i j : Nat),\n  CaseLaw2.Cert.firstCue k p1 q i = some j → i ≤ j ∧ p1 < j ∧ CaseLaw2.Cert.cueHere k (List.drop (j - i) q) = true",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.firstSuffix_some",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "",
  "statement": "@CaseLaw2.Cert.firstSuffix_some : ∀ {α : Type} (p : List α → Bool) (l s : List α),\n  CaseLaw2.Cert.firstSuffix p l = some s → s <:+ l ∧ p s = true",
  "axioms": [
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.identityFormOk_spec",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "",
  "statement": "CaseLaw2.Cert.identityFormOk_spec : ∀ (i : CaseLaw2.Cert.Identity) (d t : String),\n  CaseLaw2.Cert.identityFormOk i d t = true →\n    (i.form = \"docket\" ∨ i.form = \"cite\") ∧\n        4 ≤ (CaseLaw2.Cert.compact i.token).length ∧\n          (CaseLaw2.Cert.compact i.token).any Char.isDigit = true ∧\n            CaseLaw2.Cert.hasSub (CaseLaw2.Cert.compact d) (CaseLaw2.Cert.compact i.token) = true ∧\n              CaseLaw2.Cert.hasSub (CaseLaw2.Cert.compact t) (CaseLaw2.Cert.compact i.token) = true ∨\n      i.form = \"date\" ∧\n        CaseLaw2.Cert.validDate i.tDate = true ∧\n          i.token.length = 8 ∧\n            i.token.all Char.isDigit = true ∧\n              i.token.toNat? = some i.tDate ∧\n                (CaseLaw2.Cert.dateForms i.tDate).any (CaseLaw2.Cert.hasSub d) = true ∧\n                  (CaseLaw2.Cert.dateForms i.tDate).any (CaseLaw2.Cert.hasSub t) = true",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.identityOk_spec",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "",
  "statement": "CaseLaw2.Cert.identityOk_spec : ∀ (c : CaseLaw2.Cert.Input) (i : CaseLaw2.Cert.Identity),\n  CaseLaw2.Cert.identityOk c i = true →\n    ∃ d t,\n      CaseLaw2.Cert.identitySpan c i.dSha i.dWindows i.dStart i.dStop = some d ∧\n        CaseLaw2.Cert.identitySpan c i.tSha i.tWindows i.tStart i.tStop = some t ∧\n          CaseLaw2.Cert.identityFormOk i d t = true",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.identitySpan_some",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "",
  "statement": "CaseLaw2.Cert.identitySpan_some : ∀ (c : CaseLaw2.Cert.Input) (sha : String) (ws : List CaseLaw2.Cert.Window)\n  (s e : Nat) (x : String),\n  CaseLaw2.Cert.identitySpan c sha ws s e = some x →\n    s < e ∧\n      e - s ≤ CaseLaw2.Cert.identitySpanMax ∧\n        ∃ w,\n          w ∈ ws ∧\n            CaseLaw2.Cert.usable (CaseLaw2.Cert.spanInput c sha ws s e) w = true ∧\n              x = (CaseLaw2.Cert.slice (CaseLaw2.Cert.norm w.text) (s - w.start0) (e - s)).toLower",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.identityThen_fail_keeps",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**A failing verdict keeps its reason** (§5.2).",
  "statement": "CaseLaw2.Cert.identityThen_fail_keeps : ∀ (i? : Option CaseLaw2.Cert.Identity) (c : CaseLaw2.Cert.Input)\n  (res : CaseLaw2.Cert.Result), res.admitted = false → CaseLaw2.Cert.identityThen i? c res = res",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.identityThen_some_admitted",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "The general form of the soundness on any verdict.",
  "statement": "CaseLaw2.Cert.identityThen_some_admitted : ∀ (i : CaseLaw2.Cert.Identity) (c : CaseLaw2.Cert.Input)\n  (res : CaseLaw2.Cert.Result),\n  (CaseLaw2.Cert.identityThen (some i) c res).admitted = true →\n    res.admitted = true ∧ CaseLaw2.Cert.identityThen (some i) c res = res ∧ CaseLaw2.Cert.identityOk c i = true",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.identityTie_sound",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**Identity-tie soundness** (§5.2): an admitted row with a line has an admitted round-11 verdict (which is the verdict); D's span and T's span are each non-empty, at most `identitySpanMax` characters, the lower-cased text of a usable window of that node's own text; and the form's condition holds on the two spans: for `docket` / `cite` the compact token (≥ 4 characters, a digit) is in both compact spans; for `date` the token is the 8 digits of date(T) (known) and both spans hold a date form of it.",
  "statement": "CaseLaw2.Cert.identityTie_sound : ∀ (i : CaseLaw2.Cert.Identity) (t? : Option CaseLaw2.Cert.TBridge)\n  (rm? : Option CaseLaw2.Cert.Remand) (zs : List CaseLaw2.Cert.Zone) (c : CaseLaw2.Cert.Input)\n  (a? : Option CaseLaw2.Cert.Anchor) (b? : Option CaseLaw2.Cert.Bridge) (h : CaseLaw2.Cert.HClaims),\n  (CaseLaw2.Cert.checkHistory11I (some i) t? rm? zs c a? b? h).admitted = true →\n    (CaseLaw2.Cert.checkHistory11 t? rm? zs c a? b? h).admitted = true ∧\n      CaseLaw2.Cert.checkHistory11I (some i) t? rm? zs c a? b? h = CaseLaw2.Cert.checkHistory11 t? rm? zs c a? b? h ∧\n        i.dStart < i.dStop ∧\n          i.dStop - i.dStart ≤ CaseLaw2.Cert.identitySpanMax ∧\n            i.tStart < i.tStop ∧\n              i.tStop - i.tStart ≤ CaseLaw2.Cert.identitySpanMax ∧\n                ∃ d t,\n                  CaseLaw2.Cert.identitySpan c i.dSha i.dWindows i.dStart i.dStop = some d ∧\n                    CaseLaw2.Cert.identitySpan c i.tSha i.tWindows i.tStart i.tStop = some t ∧\n                      (∃ w,\n                          w ∈ i.dWindows ∧\n                            CaseLaw2.Cert.usable (CaseLaw2.Cert.spanInput c i.dSha i.dWindows i.dStart i.dStop) w =\n                                true ∧\n                              d =\n                                (CaseLaw2.Cert.slice (CaseLaw2.Cert.norm w.text) (i.dStart - w.start0)\n                                    (i.dStop - i.dStart)).toLower) ∧\n                        (∃ w,\n                            w ∈ i.tWindows ∧\n                              CaseLaw2.Cert.usable (CaseLaw2.Cert.spanInput c i.tSha i.tWindows i.tStart i.tStop) w =\n                                  true ∧\n                                t =\n                                  (CaseLaw2.Cert.slice (CaseLaw2.Cert.norm w.text) (i.tStart - w.start0)\n                                      (i.tStop - i.tStart)).toLower) ∧\n                          ((i.form = \"docket\" ∨ i.form = \"cite\") ∧\n                              4 ≤ (CaseLaw2.Cert.compact i.token).length ∧\n                                (CaseLaw2.Cert.compact i.token).any Char.isDigit = true ∧\n                                  CaseLaw2.Cert.hasSub (CaseLaw2.Cert.compact d) (CaseLaw2.Cert.compact i.token) =\n                                      true ∧\n                                    CaseLaw2.Cert.hasSub (CaseLaw2.Cert.compact t) (CaseLaw2.Cert.compact i.token) =\n                                      true ∨\n                            i.form = \"date\" ∧\n                              CaseLaw2.Cert.validDate i.tDate = true ∧\n                                i.token.length = 8 ∧\n                                  i.token.all Char.isDigit = true ∧\n                                    i.token.toNat? = some i.tDate ∧\n                                      (CaseLaw2.Cert.dateForms i.tDate).any (CaseLaw2.Cert.hasSub d) = true ∧\n                                        (CaseLaw2.Cert.dateForms i.tDate).any (CaseLaw2.Cert.hasSub t) = true)",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.implicitReject_no_claim",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**No claim, no change** (§7): without the claim the treatment step (and its cue test) is round 8's.",
  "statement": "CaseLaw2.Cert.implicitReject_no_claim : ∀ (c : CaseLaw2.Cert.Input) (e : Bool) (cl : CaseLaw2.Cert.TClaim)\n  (js : List CaseLaw2.Cert.Joined),\n  CaseLaw2.Cert.checkTreatmentI false c e cl js = CaseLaw2.Cert.checkTreatment c e cl js",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.implicitReject_soft",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**Soft kinds only** (§7): an admitted claimed row is of a soft kind.",
  "statement": "CaseLaw2.Cert.implicitReject_soft : ∀ (c : CaseLaw2.Cert.Input) (e : Bool) (js : List CaseLaw2.Cert.Joined),\n  (CaseLaw2.Cert.checkImplicit c e js).admitted = true → CaseLaw2.Cert.implicitSoft c.kind = true",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.joinedFar_extends",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**The claim only extends** (§5): every row admitted without the claim is admitted with it, with the same verdict.",
  "statement": "CaseLaw2.Cert.joinedFar_extends : ∀ (lens : List Nat) (c : CaseLaw2.Cert.Input) (e : Bool) (cl : CaseLaw2.Cert.TClaim)\n  (js : List CaseLaw2.Cert.Joined),\n  (CaseLaw2.Cert.checkTreatment c e cl js).admitted = true →\n    CaseLaw2.Cert.checkTreatmentF true lens c e cl js = CaseLaw2.Cert.checkTreatment c e cl js",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.joinedFar_no_claim",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**No claim, no change** (§5).",
  "statement": "CaseLaw2.Cert.joinedFar_no_claim : ∀ (lens : List Nat),\n  CaseLaw2.Cert.checkTreatmentF false lens = CaseLaw2.Cert.checkTreatment",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.joinedQuoteOk_window",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "A joined quote that passes check 1 sits in a usable window of the row's own text.",
  "statement": "CaseLaw2.Cert.joinedQuoteOk_window : ∀ (c : CaseLaw2.Cert.Input) (j : CaseLaw2.Cert.Joined),\n  CaseLaw2.Cert.joinedQuoteOk c j = true →\n    ∃ w,\n      CaseLaw2.Cert.coveringWindow (j.input c) = some w ∧\n        w ∈ c.windows ∧ CaseLaw2.Cert.usable (j.input c) w = true ∧ CaseLaw2.Cert.quoteAt (j.input c) w = true",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.keyTie_spec",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "",
  "statement": "CaseLaw2.Cert.keyTie_spec : ∀ (c : CaseLaw2.Cert.Input) (r : CaseLaw2.Cert.Remand) (q : String),\n  CaseLaw2.Cert.keyTie c r q = true →\n    ∃ m o,\n      c.citeIndex = some m ∧\n        r.order = some o ∧\n          ∃ s, s <:+ CaseLaw2.Cert.alnumPos q.toList 0 ∧ ∃ L, L ∈ r.lens ∧ CaseLaw2.Cert.citeOf m s L = some o",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.mainCheck_check",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "The main check admits only if `check` admits the main quote read in the row's mode.",
  "statement": "CaseLaw2.Cert.mainCheck_check : ∀ (c : CaseLaw2.Cert.Input) (e : Bool) (cl : CaseLaw2.Cert.TClaim),\n  (CaseLaw2.Cert.mainCheck c e cl).admitted = true → (CaseLaw2.Cert.check (cl.apply c)).admitted = true",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.mainCheck_text",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "The main check admits with the power taken as verified whenever it admits.",
  "statement": "CaseLaw2.Cert.mainCheck_text : ∀ (c : CaseLaw2.Cert.Input) (e : Bool) (cl : CaseLaw2.Cert.TClaim),\n  (CaseLaw2.Cert.mainCheck c e cl).admitted = true →\n    (CaseLaw2.Cert.mainCheck\n          { kind := c.kind, textSha := c.textSha, start := c.start, stop := c.stop, quote := c.quote,\n            evidence := c.evidence, part := c.part, shas := c.shas, windows := c.windows, ordered := c.ordered,\n            authority := some true, selfText := c.selfText, hashRequired := c.hashRequired, target := c.target,\n            citeIndex := c.citeIndex, mode := c.mode }\n          e cl).admitted =\n      true",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.noKeyBetween_spec",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "Step 5b: no key begins at a position in `[e, p2)`.",
  "statement": "CaseLaw2.Cert.noKeyBetween_spec : ∀ (c : CaseLaw2.Cert.Input) (b : CaseLaw2.Cert.Bridge) (e p2 : Nat),\n  CaseLaw2.Cert.noKeyBetween c b e p2 = true →\n    ∃ m,\n      c.citeIndex = some m ∧\n        ∀ (s : List (Char × Nat)),\n          s <:+ CaseLaw2.Cert.bridgeAlnum b →\n            ∀ (p : Nat),\n              CaseLaw2.Cert.headPos s = some p →\n                e ≤ p → p < p2 → ∀ (L : Nat), L ∈ b.lens → CaseLaw2.Cert.citeOf m s L = none",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.no_bridge_no_change",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**No bridge line, no claim `anchorWide`: no change** (the round-7 history step).",
  "statement": "CaseLaw2.Cert.no_bridge_no_change : ∀ (c : CaseLaw2.Cert.Input) (a? : Option CaseLaw2.Cert.Anchor)\n  (h : CaseLaw2.Cert.HClaims),\n  h.anchorWide = false → CaseLaw2.Cert.checkHistory8 c a? none h = CaseLaw2.Cert.checkHistory7 c a? h",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.no_identity_line_no_change",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**No identity line, no change** (§5.2): without a line the step is §5.1's, and the wrapper is the identity.",
  "statement": "CaseLaw2.Cert.no_identity_line_no_change : ∀ (t? : Option CaseLaw2.Cert.TBridge) (rm? : Option CaseLaw2.Cert.Remand)\n  (zs : List CaseLaw2.Cert.Zone) (c : CaseLaw2.Cert.Input) (a? : Option CaseLaw2.Cert.Anchor)\n  (b? : Option CaseLaw2.Cert.Bridge) (h : CaseLaw2.Cert.HClaims) (res : CaseLaw2.Cert.Result),\n  CaseLaw2.Cert.checkHistory11I none t? rm? zs c a? b? h = CaseLaw2.Cert.checkHistory11 t? rm? zs c a? b? h ∧\n    CaseLaw2.Cert.identityThen none c res = res",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
