 },
 {
  "name": "CaseLaw2.Cert.no_joined_no_change",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**No joined line, no claim: no change.** A treatments row without joined lines (no doctrine claim) gets the round-6 verdict (`check`, or `checkOperative` for an operative-words claim); a history row without claims gets `checkHistory`'s (plain or anchored).",
  "statement": "CaseLaw2.Cert.no_joined_no_change : ∀ (c : CaseLaw2.Cert.Input) (e : Bool) (a? : Option CaseLaw2.Cert.Anchor)\n  (h : CaseLaw2.Cert.HClaims),\n  h.orderHead = false →\n    h.setAside = false →\n      CaseLaw2.Cert.checkTreatment c e CaseLaw2.Cert.TClaim.plain [] = CaseLaw2.Cert.check c ∧\n        CaseLaw2.Cert.checkTreatment c e CaseLaw2.Cert.TClaim.operative [] = CaseLaw2.Cert.checkOperative c e ∧\n          CaseLaw2.Cert.checkHistory7 c a? h = CaseLaw2.Cert.checkHistory c a?",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.no_remand_line_no_change",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**No remand line, no change**: without a line the round-10 step is the round-9 step (and the wrapper is the identity on any verdict).",
  "statement": "CaseLaw2.Cert.no_remand_line_no_change : ∀ (zs : List CaseLaw2.Cert.Zone) (c : CaseLaw2.Cert.Input)\n  (a? : Option CaseLaw2.Cert.Anchor) (b? : Option CaseLaw2.Cert.Bridge) (h : CaseLaw2.Cert.HClaims)\n  (res : CaseLaw2.Cert.Result),\n  CaseLaw2.Cert.checkHistory10 none zs c a? b? h = CaseLaw2.Cert.checkHistory9J zs c a? b? h ∧\n    CaseLaw2.Cert.remandThen none c res = res",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.no_tbridge_table_no_change",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**Presence** (§6): a claimed row (reversed / vacated, anchored, no bridge line) without a `history_tbridge.tsv` line is not admitted; rows without the claim are unchanged whatever the table holds (`trialBridge_no_claim`).",
  "statement": "CaseLaw2.Cert.no_tbridge_table_no_change : ∀ (t : CaseLaw2.Cert.TBridge),\n  t.line = none →\n    ∀ (c : CaseLaw2.Cert.Input) (a : CaseLaw2.Cert.Anchor) (h : CaseLaw2.Cert.HClaims),\n      CaseLaw2.Cert.trialKind c.kind = true → (CaseLaw2.Cert.checkHistory8T (some t) c (some a) none h).admitted = false",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.no_tribunal_claim_no_change",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**Presence** (§5.1): the claim has no effect on a row with no anchor line or with a bridge line (the bridge takes the row): the round-11 steps are round 10's whatever the claims.",
  "statement": "CaseLaw2.Cert.no_tribunal_claim_no_change : ∀ (t? : Option CaseLaw2.Cert.TBridge) (rm? : Option CaseLaw2.Cert.Remand)\n  (zs : List CaseLaw2.Cert.Zone) (c : CaseLaw2.Cert.Input) (a? : Option CaseLaw2.Cert.Anchor)\n  (b? : Option CaseLaw2.Cert.Bridge) (h : CaseLaw2.Cert.HClaims),\n  a? = none ∨ b?.isSome = true →\n    CaseLaw2.Cert.checkHistory8A t? c a? b? h = CaseLaw2.Cert.checkHistory8T t? c a? b? h ∧\n      CaseLaw2.Cert.checkHistory11 t? rm? zs c a? b? h = CaseLaw2.Cert.checkHistory10T t? rm? zs c a? b? h",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.no_zone_no_change",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**No zone line, no change**: with no zone the three round-9 steps are round 8's (and the wrappers are the identity on any verdict).",
  "statement": "CaseLaw2.Cert.no_zone_no_change : ∀ (c : CaseLaw2.Cert.Input) (a? : Option CaseLaw2.Cert.Anchor)\n  (b? : Option CaseLaw2.Cert.Bridge) (h : CaseLaw2.Cert.HClaims) (e : Bool) (cl : CaseLaw2.Cert.TClaim)\n  (js : List CaseLaw2.Cert.Joined) (w : CaseLaw2.Cert.Witness) (r : CaseLaw2.Cert.Result) (v : CaseLaw2.Cert.RResult),\n  CaseLaw2.Cert.checkHistory9 [] c a? b? h = CaseLaw2.Cert.checkHistory8 c a? b? h ∧\n    CaseLaw2.Cert.checkTreatment9 [] c e cl js = CaseLaw2.Cert.checkTreatment c e cl js ∧\n      CaseLaw2.Cert.checkRecognised9 [] c w = CaseLaw2.Cert.checkRecognised c w ∧\n        CaseLaw2.Cert.zoneThen [] c js r = r ∧ CaseLaw2.Cert.zoneR [] c v = v",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.nodeZones_valid",
