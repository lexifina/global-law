 {
  "name": "CaseLaw2.Spec.Horty.forced_blocks_opposite",
  "module": "LegalProofs.CaseLaw2.Spec.Horty",
  "doc": "If a precedent forces its outcome on `X`, every decision for the other side on `X` (with any reason made of present, other-side factors) is inconsistent with the case base.",
  "statement": "@CaseLaw2.Spec.Horty.forced_blocks_opposite : ∀ {Γ : List CaseLaw2.Spec.Horty.FCase} {c : CaseLaw2.Spec.Horty.FCase}\n  {X : List CaseLaw2.Spec.Horty.Factor},\n  c ∈ Γ →\n    CaseLaw2.Spec.Horty.forcedBy c X = true →\n      ∀ (r : List CaseLaw2.Spec.Horty.Factor),\n        CaseLaw2.Spec.Horty.sub r X = true →\n          (∀ (f : CaseLaw2.Spec.Horty.Factor), f ∈ r → f.side = c.outcome.opp) →\n            CaseLaw2.Spec.Horty.consistent ({ facts := X, reason := r, outcome := c.outcome.opp } :: Γ) = false",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.Horty.permitted_of_consistent_same_outcome",
  "module": "LegalProofs.CaseLaw2.Spec.Horty",
  "doc": "If every case in a consistent base has outcome `s`, any well-formed case with outcome `s` is permitted. (The consistency and well-formedness hypotheses are not needed for the conclusion.)",
  "statement": "@CaseLaw2.Spec.Horty.permitted_of_consistent_same_outcome : ∀ {Γ : List CaseLaw2.Spec.Horty.FCase}\n  {s : CaseLaw2.Spec.Horty.Side} {c : CaseLaw2.Spec.Horty.FCase},\n  CaseLaw2.Spec.Horty.consistent Γ = true →\n    (∀ (d : CaseLaw2.Spec.Horty.FCase), d ∈ Γ → d.outcome = s) →\n      c.wf = true → c.outcome = s → CaseLaw2.Spec.Horty.permitted Γ c = true",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.Horty.result_not_stricter",
  "module": "LegalProofs.CaseLaw2.Spec.Horty",
  "doc": "The result model never forces where the reason model does not.",
  "statement": "@CaseLaw2.Spec.Horty.result_not_stricter : ∀ {c : CaseLaw2.Spec.Horty.FCase} {X : List CaseLaw2.Spec.Horty.Factor},\n  c.wf = true →\n    CaseLaw2.Spec.Horty.forcedBy (CaseLaw2.Spec.Horty.resultCase c) X = true → CaseLaw2.Spec.Horty.forcedBy c X = true",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
