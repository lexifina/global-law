   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.contrib_congr",
  "module": "LegalProofs.CaseLaw2.Spec.Recognised",
  "doc": "Effects that agree on what they impose, on their scope and on being live contribute the same.",
  "statement": "CaseLaw2.Spec.contrib_congr : ∀ (a b : CaseLaw2.Spec.Effect) (k t u : Nat),\n  a.eff = b.eff → a.scope = b.scope → a.live t u = b.live t u → a.contrib k t u = b.contrib k t u",
  "axioms": [
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.contrib_join_dominated",
  "module": "LegalProofs.CaseLaw2.Spec.Recognised",
  "doc": "Two effects with the same scope that are live together, the second at least as severe and neither `good`: the second decides.",
  "statement": "CaseLaw2.Spec.contrib_join_dominated : ∀ (a b : CaseLaw2.Spec.Effect) (k t u : Nat),\n  a.scope = b.scope →\n    a.live t u = b.live t u →\n      a.eff.rank ≤ b.eff.rank →\n        a.eff ≠ CaseLaw2.Spec.Status.good →\n          b.eff ≠ CaseLaw2.Spec.Status.good → (a.contrib k t u).join (b.contrib k t u) = b.contrib k t u",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.contrib_unknown_rank",
  "module": "LegalProofs.CaseLaw2.Spec.Recognised",
  "doc": "An effect that imposes an unknown never contributes a negative.",
  "statement": "CaseLaw2.Spec.contrib_unknown_rank : ∀ (e : CaseLaw2.Spec.Effect) (r : CaseLaw2.Spec.Unk),\n  e.eff = CaseLaw2.Spec.Status.unknown r → ∀ (k t u : Nat), (e.contrib k t u).rank < 10",
  "axioms": [
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.demoted_contrib_le",
  "module": "LegalProofs.CaseLaw2.Spec.Recognised",
  "doc": "A demoted effect contributes `good` or `unknown partialScope`.",
  "statement": "CaseLaw2.Spec.demoted_contrib_le : ∀ (e : CaseLaw2.Spec.Effect) (s : CaseLaw2.Scope),\n  e.scope = CaseLaw2.Spec.demote s → ∀ (k t u : Nat), (e.contrib k t u).rank ≤ 1",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.demoted_never_neg",
  "module": "LegalProofs.CaseLaw2.Spec.Recognised",
  "doc": "**A demoted effect never makes anything negative** (DESIGN5 §3.3): operative words that do not dispose of the case as a whole leave the target partly negative (`unknown partialScope`) at most.",
  "statement": "CaseLaw2.Spec.demoted_never_neg : ∀ (e : CaseLaw2.Spec.Effect) (s : CaseLaw2.Scope),\n  e.scope = CaseLaw2.Spec.demote s → ∀ (k t u : Nat), (e.contrib k t u).rank < 10",
  "axioms": [
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.demoted_status_le",
  "module": "LegalProofs.CaseLaw2.Spec.Recognised",
  "doc": "So the status of a list of demoted effects is `good` or `unknown partialScope` (rank at most 1).",
  "statement": "CaseLaw2.Spec.demoted_status_le : ∀ (l : List CaseLaw2.Spec.Effect),\n  (∀ (e : CaseLaw2.Spec.Effect), e ∈ l → ∃ s, e.scope = CaseLaw2.Spec.demote s) →\n    ∀ (k t u : Nat), (CaseLaw2.Spec.status l k t u).rank ≤ 1",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.demoted_status_never_neg",
  "module": "LegalProofs.CaseLaw2.Spec.Recognised",
  "doc": "So the status of a list of demoted effects is never negative.",
  "statement": "CaseLaw2.Spec.demoted_status_never_neg : ∀ (l : List CaseLaw2.Spec.Effect),\n  (∀ (e : CaseLaw2.Spec.Effect), e ∈ l → ∃ s, e.scope = CaseLaw2.Spec.demote s) →\n    ∀ (k t u : Nat), (CaseLaw2.Spec.status l k t u).rank < 10",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.division_cannot_overrule",
  "module": "LegalProofs.CaseLaw2.Spec.AuthorityThms",
  "doc": "Hunt H6, *M.A.P. v. Ryan*: where a court of last resort has a strong court-level horizontal row, a division (a panel) of it has no power over the court's own decision; only an en banc–equivalent bench has.",
  "statement": "CaseLaw2.Spec.division_cannot_overrule : ∀ (L : CaseLaw2.Lookups) (X B : CaseLaw2.CourtEpoch) (b x : CaseLaw2.Decision),\n  B.court = X.court →\n    L.rules.horizontalCourt X.court x.date = some CaseLaw2.HRule.strong →\n      b.bench = some CaseLaw2.Bench.panel ∨ b.bench = some CaseLaw2.Bench.division →\n        CaseLaw2.Spec.lastResortBench L X B b x = (false, CaseLaw2.RuleId.strongNeedsEnBanc)",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.doctrine_effects_demoted",
  "module": "LegalProofs.CaseLaw2.Spec.Recognised",
  "doc": "**Every effect of a doctrine row has a demoted scope.**",
  "statement": "CaseLaw2.Spec.doctrine_effects_demoted : ∀ (byHist : List CaseLaw2.HEvent) (tr : CaseLaw2.TEvent)\n  (e : CaseLaw2.Spec.Effect), e ∈ CaseLaw2.Spec.doctrineEffects byHist tr → ∃ s, e.scope = CaseLaw2.Spec.demote s",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.doctrine_never_neg",
  "module": "LegalProofs.CaseLaw2.Spec.Recognised",
  "doc": "**A doctrine row never makes a status negative**: with any other effects, a negative status is theirs; alone, the row gives at most `unknown partialScope` (DESIGN7 §2.4).",
  "statement": "CaseLaw2.Spec.doctrine_never_neg : ∀ (byHist : List CaseLaw2.HEvent) (tr : CaseLaw2.TEvent)\n  (l : List CaseLaw2.Spec.Effect) (k t u : Nat),\n  (∀ (n : CaseLaw2.Spec.Neg),\n      CaseLaw2.Spec.status (CaseLaw2.Spec.doctrineEffects byHist tr ++ l) k t u = CaseLaw2.Spec.Status.neg n →\n        CaseLaw2.Spec.status l k t u = CaseLaw2.Spec.Status.neg n) ∧\n    (CaseLaw2.Spec.status (CaseLaw2.Spec.doctrineEffects byHist tr) k t u = CaseLaw2.Spec.Status.good ∨\n      CaseLaw2.Spec.status (CaseLaw2.Spec.doctrineEffects byHist tr) k t u =\n        CaseLaw2.Spec.Status.unknown CaseLaw2.Spec.Unk.partialScope)",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.effectsFor_known",
  "module": "LegalProofs.CaseLaw2.Spec.Lines",
  "doc": "A court whose line is known reads a decision through `inLine`.",
  "statement": "CaseLaw2.Spec.effectsFor_known : ∀ (L : CaseLaw2.Lookups) (c : CaseLaw2.Decision) (effs : List CaseLaw2.Spec.Effect),\n  c.date ≠ 0 →\n    (L.epochAt c.court c.date).isSome = true →\n      CaseLaw2.Spec.effectsFor L c effs = CaseLaw2.Spec.heirEffects (CaseLaw2.Spec.inLine L c) effs",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.erie_one_directional",
  "module": "LegalProofs.CaseLaw2.Spec.AuthorityThms",
  "doc": "§9 22(c), *Erie* one-directional: absent an adoption row, (i) no state-court decision binds a federal court on federal law, and (ii) no federal decision binds a state court on state law.",
  "statement": "CaseLaw2.Spec.erie_one_directional : ∀ (L : CaseLaw2.Lookups) (x : CaseLaw2.Decision) (h : CaseLaw2.Holding) (p : Bool)\n  (q : CaseLaw2.Spec.Query) (S : CaseLaw2.CourtEpoch),\n  CaseLaw2.Spec.sourceEpoch L x p = some S →\n    CaseLaw2.Spec.adoptionsOf L x = [] →\n      ∀ (r : CaseLaw2.Force × List CaseLaw2.RuleId),\n        CaseLaw2.Spec.force L x h p q = some r →\n          (S.system ≠ 0 →\n              (∃ d, h.domain = some d ∧ d.federal = true) → q.dst.system = 0 → r.fst ≠ CaseLaw2.Force.binding) ∧\n            (S.system = 0 →\n              (∃ s, h.domain = some (CaseLaw2.Domain.stateLaw s)) → q.dst.system ≠ 0 → r.fst ≠ CaseLaw2.Force.binding)",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.explicit_recognised_agree_from_witness",
  "module": "LegalProofs.CaseLaw2.Spec.Recognised",
  "doc": "**An explicit row and a recognised row for the same pair agree from date(W)**: the same by-decision, target, kind, scope and temporal reach, once as the overruling court's own words and once as a later court's recognition, give the same status on every question date from date(W) on, while neither Y nor W has lapsed.",
  "statement": "CaseLaw2.Spec.explicit_recognised_agree_from_witness : ∀ (byHist wHist : List CaseLaw2.HEvent) (tr : CaseLaw2.TEvent)\n  (r : CaseLaw2.Recog),\n  tr.explicit = true →\n    tr.kind.changesStatus = true →\n      r.power = true →\n        tr.date ≤ r.date →\n          CaseLaw2.Spec.lapseOfDecision byHist tr.date = none →\n            CaseLaw2.Spec.lapseOfDecision wHist r.date = none →\n              ∀ (k t u : Nat),\n                r.date ≤ t →\n                  CaseLaw2.Spec.status (CaseLaw2.Spec.treatEffects byHist tr) k t u =\n                    CaseLaw2.Spec.status\n                      (CaseLaw2.Spec.recogEffects byHist wHist\n                        { id := tr.id, by_ := tr.by_, target := tr.target, date := tr.date, kind := tr.kind,\n                          scope := tr.scope, temporal := tr.temporal, explicit := false, powerKnown := tr.powerKnown,\n                          recog := some r })\n                      k t u",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.filter_congr_mem",
  "module": "LegalProofs.CaseLaw2.Spec.Lines",
  "doc": "",
  "statement": "@CaseLaw2.Spec.filter_congr_mem : ∀ {α : Type} (l : List α) (p q : α → Bool),\n  (∀ (x : α), x ∈ l → p x = q x) → List.filter p l = List.filter q l",
  "axioms": [
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.foldl_join",
  "module": "LegalProofs.CaseLaw2.Spec.Status",
  "doc": "",
  "statement": "CaseLaw2.Spec.foldl_join : ∀ (l : List CaseLaw2.Spec.Effect) (k t u : Nat) (s : CaseLaw2.Spec.Status),\n  List.foldl (fun s e => s.join (e.contrib k t u)) s l = s.join (CaseLaw2.Spec.status l k t u)",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.foldl_max_ge",
  "module": "LegalProofs.CaseLaw2.Spec.Splits",
  "doc": "",
  "statement": "CaseLaw2.Spec.foldl_max_ge : ∀ (cs : List CaseLaw2.Spec.Cand) (m : Nat) (c : CaseLaw2.Spec.Cand),\n  c ∈ cs → c.prec ≤ List.foldl (fun m c => max m c.prec) m cs",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.foldl_max_ge_init",
  "module": "LegalProofs.CaseLaw2.Spec.Splits",
  "doc": "",
  "statement": "CaseLaw2.Spec.foldl_max_ge_init : ∀ (cs : List CaseLaw2.Spec.Cand) (m : Nat),\n  m ≤ List.foldl (fun m c => max m c.prec) m cs",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.foldl_max_le",
  "module": "LegalProofs.CaseLaw2.Spec.Splits",
  "doc": "",
  "statement": "CaseLaw2.Spec.foldl_max_le : ∀ (cs : List CaseLaw2.Spec.Cand) (n m : Nat),\n  m ≤ n → (∀ (c : CaseLaw2.Spec.Cand), c ∈ cs → c.prec ≤ n) → List.foldl (fun m c => max m c.prec) m cs ≤ n",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.foldl_max_rank_le",
  "module": "LegalProofs.CaseLaw2.Spec.AuthorityThms",
  "doc": "",
  "statement": "@CaseLaw2.Spec.foldl_max_rank_le : ∀ {α : Type u_1} (g : α → CaseLaw2.Force) (n : Nat) (l : List α)\n  (init : CaseLaw2.Force),\n  init.rank ≤ n → (∀ (a : α), a ∈ l → (g a).rank ≤ n) → (List.foldl (fun f a => f.max (g a)) init l).rank ≤ n",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.forceDiv_eq_force",
  "module": "LegalProofs.CaseLaw2.Spec.AuthorityThms",
  "doc": "Hunt H6: the division rule only ever concerns a court of last resort. For every other bound court, the force on the court as it ordinarily sits is the Spec's `force`.",
  "statement": "CaseLaw2.Spec.forceDiv_eq_force : ∀ (L : CaseLaw2.Lookups) (x : CaseLaw2.Decision) (h : CaseLaw2.Holding) (p : Bool)\n  (q : CaseLaw2.Spec.Query),\n  q.dst.tier ≠ CaseLaw2.Tier.last → CaseLaw2.Spec.forceDiv L x h p q = CaseLaw2.Spec.force L x h p q",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.force_le_relation_noAdopt",
  "module": "LegalProofs.CaseLaw2.Spec.AuthorityThms",
  "doc": "With no adoption, the force is at most the relation.",
  "statement": "CaseLaw2.Spec.force_le_relation_noAdopt : ∀ (L : CaseLaw2.Lookups) (x : CaseLaw2.Decision) (h : CaseLaw2.Holding)\n  (p : Bool) (q : CaseLaw2.Spec.Query) (S : CaseLaw2.CourtEpoch),\n  CaseLaw2.Spec.sourceEpoch L x p = some S →\n    CaseLaw2.Spec.adoptionsOf L x = [] →\n      ∀ (r : CaseLaw2.Force × List CaseLaw2.RuleId),\n        CaseLaw2.Spec.force L x h p q = some r →\n          r.fst.rank ≤ (CaseLaw2.Spec.relation L S x (h.domain.getD S.home) q).fst.rank",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.force_rank_le",
  "module": "LegalProofs.CaseLaw2.Spec.AuthorityThms",
  "doc": "If the relation is bounded on every court, the force is bounded (adoption and caps cannot lift it).",
  "statement": "CaseLaw2.Spec.force_rank_le : ∀ (L : CaseLaw2.Lookups) (x : CaseLaw2.Decision) (h : CaseLaw2.Holding) (p : Bool)\n  (q : CaseLaw2.Spec.Query) (n : Nat),\n  (∀ (S : CaseLaw2.CourtEpoch),\n      (CaseLaw2.Spec.relation L S x\n              (h.domain.getD\n                ((Option.map CaseLaw2.CourtEpoch.home (CaseLaw2.Spec.sourceEpoch L x p)).getD\n                  CaseLaw2.Domain.federalGeneral))\n              q).fst.rank ≤\n        n) →\n    ∀ (r : CaseLaw2.Force × List CaseLaw2.RuleId), CaseLaw2.Spec.force L x h p q = some r → r.fst.rank ≤ n",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.goodIn_all",
  "module": "LegalProofs.CaseLaw2.Spec.Lines",
  "doc": "With no line-limited effect, good law in a line is good law.",
  "statement": "CaseLaw2.Spec.goodIn_all : ∀ (inLine : Nat → Bool) (l : List CaseLaw2.Spec.Effect) (k t : Nat),\n  (∀ (e : CaseLaw2.Spec.Effect), e ∈ l → e.reach = CaseLaw2.Spec.Reach.all) →\n    CaseLaw2.Spec.goodIn inLine l k t = CaseLaw2.Spec.goodLaw l k t t",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.goodIn_ignores_unreaching",
  "module": "LegalProofs.CaseLaw2.Spec.Lines",
  "doc": "An overruling that does not reach a line leaves good law in that line as it was.",
  "statement": "CaseLaw2.Spec.goodIn_ignores_unreaching : ∀ (inLine : Nat → Bool) (e : CaseLaw2.Spec.Effect)\n  (l : List CaseLaw2.Spec.Effect) (k t : Nat),\n  CaseLaw2.Spec.Effect.reaches inLine e = false →\n    CaseLaw2.Spec.goodIn inLine (e :: l) k t = CaseLaw2.Spec.goodIn inLine l k t",
  "axioms": [
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.goodLaw_antitone",
  "module": "LegalProofs.CaseLaw2.Spec.Status",
  "doc": "",
  "statement": "CaseLaw2.Spec.goodLaw_antitone : ∀ (l : List CaseLaw2.Spec.Effect) (k u t t' : Nat),\n  t ≤ t' →\n    (∀ (e : CaseLaw2.Spec.Effect), e ∈ l → e.lapse = none) →\n      CaseLaw2.Spec.goodLaw l k t' u = true → CaseLaw2.Spec.goodLaw l k t u = true",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.good_cites_clean",
  "module": "LegalProofs.CaseLaw2.Spec.Findings",
  "doc": "A cited holding that is good law is never reported as overruled, vacated or withdrawn.",
  "statement": "CaseLaw2.Spec.good_cites_clean : ∀ (c : CaseLaw2.Spec.CiteFacts),\n  c.status = CaseLaw2.Spec.Status.good →\n    CaseLaw2.Spec.citesOverruled c = false ∧\n      CaseLaw2.Spec.citesVacated c = false ∧ CaseLaw2.Spec.citesWithdrawn c = false",
  "axioms": [
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.good_in_every_line",
  "module": "LegalProofs.CaseLaw2.Spec.Lines",
  "doc": "Good law in the union is good law in every line.",
  "statement": "CaseLaw2.Spec.good_in_every_line : ∀ (inLine : Nat → Bool) (l : List CaseLaw2.Spec.Effect) (k t u : Nat),\n  CaseLaw2.Spec.status l k t u = CaseLaw2.Spec.Status.good →\n    CaseLaw2.Spec.statusFor inLine l k t u = CaseLaw2.Spec.Status.good",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.heir_overruling_stays_in_line",
  "module": "LegalProofs.CaseLaw2.Spec.Status",
  "doc": "An heir's own overruling stays in its line: it does not reach a court outside the lines it reaches (the Eleventh Circuit's en banc overruling of an old Fifth Circuit decision does not change it in the Fifth).",
  "statement": "CaseLaw2.Spec.heir_overruling_stays_in_line : ∀ (inLine : Nat → Bool) (e : CaseLaw2.Spec.Effect)\n  (l : List CaseLaw2.Spec.Effect) (k t u : Nat) (reached unreached : List Nat),\n  e.reach = CaseLaw2.Spec.Reach.lines false reached unreached →\n    reached.any inLine = false → CaseLaw2.Spec.statusFor inLine (e :: l) k t u = CaseLaw2.Spec.statusFor inLine l k t u",
  "axioms": [
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.heldIn_all",
  "module": "LegalProofs.CaseLaw2.Spec.Lines",
  "doc": "**With no line-limited effect the line test is the old (union) test**: nothing changes for decisions without heirs.",
  "statement": "@CaseLaw2.Spec.heldIn_all : ∀ {α : Type} (inLine : Nat → Bool) (t : Nat) (hs : List (CaseLaw2.Spec.Held α)),\n  (∀ (h : CaseLaw2.Spec.Held α),\n      h ∈ hs → ∀ (e : CaseLaw2.Spec.Effect), e ∈ h.effs → e.reach = CaseLaw2.Spec.Reach.all) →\n    CaseLaw2.Spec.heldIn inLine t hs = CaseLaw2.Spec.heldUnion t hs",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.heldIn_ignores_unreaching",
  "module": "LegalProofs.CaseLaw2.Spec.Lines",
  "doc": "**A split or conflict judged in a line ignores overrulings that do not reach that line**: adding such an overruling to any holding's decision leaves the holdings that count there unchanged.",
  "statement": "@CaseLaw2.Spec.heldIn_ignores_unreaching : ∀ {α : Type} (inLine : Nat → Bool) (t : Nat)\n  (pre post : List (CaseLaw2.Spec.Held α)) (h : CaseLaw2.Spec.Held α) (e : CaseLaw2.Spec.Effect),\n  CaseLaw2.Spec.Effect.reaches inLine e = false →\n    CaseLaw2.Spec.heldIn inLine t\n        (pre ++ { item := h.item, issue := h.issue, effs := e :: h.effs, binds := h.binds } :: post) =\n      CaseLaw2.Spec.heldIn inLine t (pre ++ h :: post)",
  "axioms": [
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.heldUnion_sub_heldIn",
  "module": "LegalProofs.CaseLaw2.Spec.Lines",
  "doc": "What counts in the union counts in every line.",
  "statement": "@CaseLaw2.Spec.heldUnion_sub_heldIn : ∀ {α : Type} (inLine : Nat → Bool) (t : Nat) (hs : List (CaseLaw2.Spec.Held α))\n  (x : α), x ∈ CaseLaw2.Spec.heldUnion t hs → x ∈ CaseLaw2.Spec.heldIn inLine t hs",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.inferred_treatment_no_effect",
  "module": "LegalProofs.CaseLaw2.Spec.Status",
  "doc": "Inferred treatments never change status (§9 item 26).",
  "statement": "CaseLaw2.Spec.inferred_treatment_no_effect : ∀ (byHist : List CaseLaw2.HEvent) (tr : CaseLaw2.TEvent),\n  tr.explicit = false → CaseLaw2.Spec.treatEffect byHist tr = none",
  "axioms": [
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.lineBase_all",
  "module": "LegalProofs.CaseLaw2.Spec.Lines",
  "doc": "With no line-limited effect a line's base is the old (union) base.",
  "statement": "CaseLaw2.Spec.lineBase_all : ∀ (inLine : Nat → Bool) (t : Nat)\n  (hs : List (CaseLaw2.Spec.Held CaseLaw2.Spec.Horty.FCase)),\n  (∀ (h : CaseLaw2.Spec.Held CaseLaw2.Spec.Horty.FCase),\n      h ∈ hs → ∀ (e : CaseLaw2.Spec.Effect), e ∈ h.effs → e.reach = CaseLaw2.Spec.Reach.all) →\n    CaseLaw2.Spec.lineBase inLine t hs = CaseLaw2.Spec.heldUnion t hs",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.lineBase_consistent_union",
  "module": "LegalProofs.CaseLaw2.Spec.Lines",
  "doc": "A consistent base in some line makes the union base consistent: an inconsistency among precedents that are good law everywhere is an inconsistency in every line.",
  "statement": "CaseLaw2.Spec.lineBase_consistent_union : ∀ (inLine : Nat → Bool) (t : Nat)\n  (hs : List (CaseLaw2.Spec.Held CaseLaw2.Spec.Horty.FCase)),\n  CaseLaw2.Spec.Horty.consistent (CaseLaw2.Spec.lineBase inLine t hs) = true →\n    CaseLaw2.Spec.Horty.consistent (CaseLaw2.Spec.heldUnion t hs) = true",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.lineStatus_all",
  "module": "LegalProofs.CaseLaw2.Spec.Lines",
  "doc": "With no line-limited effect every line's row is the union status.",
  "statement": "CaseLaw2.Spec.lineStatus_all : ∀ (ln : CaseLaw2.Spec.Line) (l : List CaseLaw2.Spec.Effect) (k t u : Nat),\n  (∀ (e : CaseLaw2.Spec.Effect), e ∈ l → e.reach = CaseLaw2.Spec.Reach.all) →\n    CaseLaw2.Spec.lineStatus ln l k t u = CaseLaw2.Spec.status l k t u",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.lineStatus_heir_agrees",
  "module": "LegalProofs.CaseLaw2.Spec.Lines",
  "doc": "**Per-heir status rows agree with `statusFor`**: a court that is in adopter `a`'s line and in no other line the effects name reads the status of row `heir a` (the Eleventh Circuit and its district courts read the Eleventh's row).",
  "statement": "CaseLaw2.Spec.lineStatus_heir_agrees : ∀ (inLine : Nat → Bool) (a : Nat) (l : List CaseLaw2.Spec.Effect) (k t u : Nat),\n  (∀ (e : CaseLaw2.Spec.Effect), e ∈ l → ∀ (b : Nat), b ∈ e.adopters → inLine b = (b == a)) →\n    CaseLaw2.Spec.statusFor inLine l k t u = CaseLaw2.Spec.lineStatus (CaseLaw2.Spec.Line.heir a) l k t u",
  "axioms": [
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.lineStatus_orig_agrees",
  "module": "LegalProofs.CaseLaw2.Spec.Lines",
  "doc": "A court in no heir's line reads the original line's row.",
  "statement": "CaseLaw2.Spec.lineStatus_orig_agrees : ∀ (inLine : Nat → Bool) (l : List CaseLaw2.Spec.Effect) (k t u : Nat),\n  (∀ (e : CaseLaw2.Spec.Effect), e ∈ l → ∀ (b : Nat), b ∈ e.adopters → inLine b = false) →\n    CaseLaw2.Spec.statusFor inLine l k t u = CaseLaw2.Spec.lineStatus CaseLaw2.Spec.Line.orig l k t u",
  "axioms": [
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.linesOf_all",
  "module": "LegalProofs.CaseLaw2.Spec.Lines",
  "doc": "With no line-limited effect a decision has no per-line rows (its `status.tsv` rows are all there is).",
  "statement": "CaseLaw2.Spec.linesOf_all : ∀ (l : List CaseLaw2.Spec.Effect),\n  (∀ (e : CaseLaw2.Spec.Effect), e ∈ l → e.reach = CaseLaw2.Spec.Reach.all) → CaseLaw2.Spec.linesOf l = []",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.mem_heldIn_iff",
  "module": "LegalProofs.CaseLaw2.Spec.Lines",
  "doc": "",
  "statement": "@CaseLaw2.Spec.mem_heldIn_iff : ∀ {α : Type} (inLine : Nat → Bool) (t : Nat) (hs : List (CaseLaw2.Spec.Held α)) (x : α),\n  x ∈ CaseLaw2.Spec.heldIn inLine t hs ↔\n    ∃ h,\n      h ∈ hs ∧\n        h.item = x ∧ h.binds = true ∧ CaseLaw2.Spec.statusFor inLine h.effs h.issue t t = CaseLaw2.Spec.Status.good",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.mem_lineBase_iff",
  "module": "LegalProofs.CaseLaw2.Spec.Lines",
  "doc": "**A Horty base in a line contains exactly the precedents good in that line** (and binding there).",
  "statement": "CaseLaw2.Spec.mem_lineBase_iff : ∀ (inLine : Nat → Bool) (t : Nat)\n  (hs : List (CaseLaw2.Spec.Held CaseLaw2.Spec.Horty.FCase)) (c : CaseLaw2.Spec.Horty.FCase),\n  c ∈ CaseLaw2.Spec.lineBase inLine t hs ↔\n    ∃ h,\n      h ∈ hs ∧\n        h.item = c ∧ h.binds = true ∧ CaseLaw2.Spec.statusFor inLine h.effs h.issue t t = CaseLaw2.Spec.Status.good",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.minDate_attained",
  "module": "LegalProofs.CaseLaw2.Spec.Splits",
  "doc": "",
  "statement": "CaseLaw2.Spec.minDate_attained : ∀ (rest : List CaseLaw2.Spec.Cand) (c : CaseLaw2.Spec.Cand),\n  ∃ d, d ∈ c :: rest ∧ d.date = CaseLaw2.Spec.minDate (c :: rest)",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.neg_stays_neg",
  "module": "LegalProofs.CaseLaw2.Spec.Status",
  "doc": "Without lapse, once negative, always negative; and good law on a later date was good law earlier.",
  "statement": "CaseLaw2.Spec.neg_stays_neg : ∀ (l : List CaseLaw2.Spec.Effect) (k u t t' : Nat),\n  t ≤ t' →\n    (∀ (e : CaseLaw2.Spec.Effect), e ∈ l → e.lapse = none) →\n      ∀ (n : CaseLaw2.Spec.Neg),\n        CaseLaw2.Spec.status l k t u = CaseLaw2.Spec.Status.neg n →\n          ∃ n', CaseLaw2.Spec.status l k t' u = CaseLaw2.Spec.Status.neg n'",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.no_cross_system",
  "module": "LegalProofs.CaseLaw2.Spec.AuthorityThms",
  "doc": "No cross-system power, absent adoption, except SCOTUS on federal law.",
  "statement": "CaseLaw2.Spec.no_cross_system : ∀ (L : CaseLaw2.Lookups) (b x : CaseLaw2.Decision) (dom : Option CaseLaw2.Domain)\n  (B X : CaseLaw2.CourtEpoch),\n  L.epochAt b.court b.date = some B →\n    L.epochAt x.court x.date = some X →\n      B.system ≠ X.system →\n        B.scotus = false →\n          B.court ≠ X.court →\n            ((CaseLaw2.Spec.adoptionsOf L x).any fun x => x.adopter == b.court) = false →\n              Option.map (fun x => x.fst) (CaseLaw2.Spec.canChangeStatus L b x dom) = some false",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.no_overrule_of_binding_superior",
  "module": "LegalProofs.CaseLaw2.Spec.AuthorityThms",
  "doc": "v1 `no_overrule_of_binding_superior`, lifted: absent adoption, a lower court of the same system never has power over a higher court's decision.",
  "statement": "CaseLaw2.Spec.no_overrule_of_binding_superior : ∀ (L : CaseLaw2.Lookups) (b x : CaseLaw2.Decision)\n  (dom : Option CaseLaw2.Domain) (B X : CaseLaw2.CourtEpoch),\n  L.epochAt b.court b.date = some B →\n    L.epochAt x.court x.date = some X →\n      B.tier.rank < X.tier.rank →\n        B.court ≠ X.court →\n          ((CaseLaw2.Spec.adoptionsOf L x).any fun x => x.adopter == b.court) = false →\n            Option.map (fun x => x.fst) (CaseLaw2.Spec.canChangeStatus L b x dom) = some false",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.no_panel_overrules_panel_in_strong",
  "module": "LegalProofs.CaseLaw2.Spec.AuthorityThms",
  "doc": "§9 item 23, F7: in a court with a strong horizontal rule, a panel cannot overrule a panel of the same court.",
  "statement": "CaseLaw2.Spec.no_panel_overrules_panel_in_strong : ∀ (L : CaseLaw2.Lookups) (b x : CaseLaw2.Decision)\n  (dom : Option CaseLaw2.Domain) (B X : CaseLaw2.CourtEpoch),\n  L.epochAt b.court b.date = some B →\n    L.epochAt x.court x.date = some X →\n      B.court = X.court →\n        B.tier = CaseLaw2.Tier.appellate →\n          X.tier = CaseLaw2.Tier.appellate →\n            L.rules.horizontal X.court X.system x.date = some CaseLaw2.HRule.strong →\n              b.bench = some CaseLaw2.Bench.panel →\n                Option.map (fun x => x.fst) (CaseLaw2.Spec.canChangeStatus L b x dom) = some false",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.no_power_over_later",
  "module": "LegalProofs.CaseLaw2.Spec.AuthorityThms",
  "doc": "A decision never has power over a later one.",
  "statement": "CaseLaw2.Spec.no_power_over_later : ∀ (L : CaseLaw2.Lookups) (b x : CaseLaw2.Decision) (dom : Option CaseLaw2.Domain)\n  (B X : CaseLaw2.CourtEpoch),\n  L.epochAt b.court b.date = some B →\n    L.epochAt x.court x.date = some X →\n      b.date < x.date → CaseLaw2.Spec.canChangeStatus L b x dom = some (false, CaseLaw2.RuleId.cLater)",
  "axioms": [
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.nothing_binds_last_resort",
  "module": "LegalProofs.CaseLaw2.Spec.AuthorityThms",
  "doc": "§9 22(b): on its own system's law, no decision of any court binds that system's court of last resort; whatever the parameter tables, adoptions and successions say. (SCOTUS binds only on federal questions; see (a).)",
  "statement": "CaseLaw2.Spec.nothing_binds_last_resort : ∀ (L : CaseLaw2.Lookups) (x : CaseLaw2.Decision) (h : CaseLaw2.Holding)\n  (p : Bool) (q : CaseLaw2.Spec.Query),\n  q.dst.tier = CaseLaw2.Tier.last →\n    q.dst.system ≠ 0 →\n      h.domain = some (CaseLaw2.Domain.stateLaw q.dst.system) →\n        ∀ (r : CaseLaw2.Force × List CaseLaw2.RuleId),\n          CaseLaw2.Spec.force L x h p q = some r → r.fst ≠ CaseLaw2.Force.binding",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.only_scotus_changes_scotus",
  "module": "LegalProofs.CaseLaw2.Spec.AuthorityThms",
  "doc": "Only SCOTUS (or the same court) changes the status of a SCOTUS decision, absent adoption.",
  "statement": "CaseLaw2.Spec.only_scotus_changes_scotus : ∀ (L : CaseLaw2.Lookups) (b x : CaseLaw2.Decision)\n  (dom : Option CaseLaw2.Domain) (B X : CaseLaw2.CourtEpoch),\n  L.epochAt b.court b.date = some B →\n    L.epochAt x.court x.date = some X →\n      X.scotus = true →\n        ((CaseLaw2.Spec.adoptionsOf L x).any fun x => x.adopter == b.court) = false →\n          Option.map (fun x => x.fst) (CaseLaw2.Spec.canChangeStatus L b x dom) = some true →\n            B.scotus = true ∨ B.court = X.court",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.panelDeparts_needs_enBanc",
  "module": "LegalProofs.CaseLaw2.Spec.Findings",
  "doc": "A panel departure is only reported when the power check failed for want of an en banc bench.",
  "statement": "CaseLaw2.Spec.panelDeparts_needs_enBanc : ∀ (f : CaseLaw2.Spec.TreatFacts),\n  CaseLaw2.Spec.panelDepartsWithoutEnBanc f = true →\n    ∃ r,\n      f.power = some (false, r) ∧\n        (r = CaseLaw2.RuleId.strongNeedsEnBanc ∨\n          r = CaseLaw2.RuleId.withinUnitEnBanc ∨ r = CaseLaw2.RuleId.adoptedEnBanc)",
  "axioms": [
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.panelDeparts_needs_panel_and_rule",
  "module": "LegalProofs.CaseLaw2.Spec.Findings",
  "doc": "Hunt H3b: a panel departure is reported only for a known panel under a rule the court had when it departed.",
  "statement": "CaseLaw2.Spec.panelDeparts_needs_panel_and_rule : ∀ (f : CaseLaw2.Spec.TreatFacts),\n  CaseLaw2.Spec.panelDepartsWithoutEnBanc f = true → f.panel = true ∧ f.ruleAtDeparture = true",
  "axioms": [
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.partial_overruling_preserves",
  "module": "LegalProofs.CaseLaw2.Spec.Status",
  "doc": "**Partial overruling preserves the other holdings**: an admitted treatment on issues `ks` leaves the status of every other named issue unchanged.",
  "statement": "CaseLaw2.Spec.partial_overruling_preserves : ∀ (byHist : List CaseLaw2.HEvent) (tr : CaseLaw2.TEvent)\n  (e : CaseLaw2.Spec.Effect),\n  CaseLaw2.Spec.treatEffect byHist tr = some e →\n    ∀ (ks : List Nat),\n      tr.scope = CaseLaw2.Scope.issues ks →\n        ∀ (l : List CaseLaw2.Spec.Effect) (k : Nat),\n          ¬k ∈ ks →\n            k ≠ CaseLaw2.anonIssue → ∀ (t u : Nat), CaseLaw2.Spec.status (e :: l) k t u = CaseLaw2.Spec.status l k t u",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.partial_touches_only",
  "module": "LegalProofs.CaseLaw2.Spec.Status",
  "doc": "**Partial events touch only their holdings**: an event on issues `ks` leaves every other named issue as it was.",
  "statement": "CaseLaw2.Spec.partial_touches_only : ∀ (e : CaseLaw2.Spec.Effect) (l : List CaseLaw2.Spec.Effect) (k t u : Nat)\n  (ks : List Nat),\n  e.scope = CaseLaw2.Scope.issues ks →\n    ¬k ∈ ks → k ≠ CaseLaw2.anonIssue → CaseLaw2.Spec.status (e :: l) k t u = CaseLaw2.Spec.status l k t u",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.prospective_no_effect",
  "module": "LegalProofs.CaseLaw2.Spec.Status",
  "doc": "**Prospectivity**: an effect for conduct from `e.conductFrom` (a supersession's effective or retroactive date, or a prospective overruling) does not reach earlier conduct.",
  "statement": "CaseLaw2.Spec.prospective_no_effect : ∀ (e : CaseLaw2.Spec.Effect) (l : List CaseLaw2.Spec.Effect) (k t u : Nat),\n  u < e.conductFrom → CaseLaw2.Spec.status (e :: l) k t u = CaseLaw2.Spec.status l k t u",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.reaches_congr",
  "module": "LegalProofs.CaseLaw2.Spec.Lines",
  "doc": "Two views that agree on the adopters an effect names are reached by it alike.",
  "statement": "CaseLaw2.Spec.reaches_congr : ∀ (p q : Nat → Bool) (e : CaseLaw2.Spec.Effect),\n  (∀ (b : Nat), b ∈ e.adopters → p b = q b) → CaseLaw2.Spec.Effect.reaches p e = CaseLaw2.Spec.Effect.reaches q e",
  "axioms": [
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.recogEffects_shape",
  "module": "LegalProofs.CaseLaw2.Spec.Recognised",
  "doc": "The shape of a recognised row's effects: none, or two: the first imposes an unknown, the second starts on date(W).",
  "statement": "CaseLaw2.Spec.recogEffects_shape : ∀ (byHist wHist : List CaseLaw2.HEvent) (tr : CaseLaw2.TEvent) (r : CaseLaw2.Recog),\n  tr.recog = some r →\n    CaseLaw2.Spec.recogEffects byHist wHist tr = [] ∨\n      ∃ e1 e2 q,\n        CaseLaw2.Spec.recogEffects byHist wHist tr = [e1, e2] ∧\n          e1.eff = CaseLaw2.Spec.Status.unknown q ∧ e2.start = r.date",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.recognisedLater_not_citesOverruled",
  "module": "LegalProofs.CaseLaw2.Spec.Findings",
  "doc": "**Between the overruling and its recognition a citation is at risk, not \"cites overruled\"** (round 5): a citation whose cited status is `unknown recognisedLater` is never reported as citing an overruled, vacated or withdrawn decision.",
  "statement": "CaseLaw2.Spec.recognisedLater_not_citesOverruled : ∀ (c : CaseLaw2.Spec.CiteFacts),\n  CaseLaw2.Spec.citedRecognisedLater c = true →\n    CaseLaw2.Spec.citesOverruled c = false ∧\n      CaseLaw2.Spec.citesVacated c = false ∧ CaseLaw2.Spec.citesWithdrawn c = false",
  "axioms": [
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.recognised_needs_power",
  "module": "LegalProofs.CaseLaw2.Spec.Recognised",
  "doc": "**Never without W's power**: a row whose recognising court lacks power over the target has no effect.",
  "statement": "CaseLaw2.Spec.recognised_needs_power : ∀ (byHist wHist : List CaseLaw2.HEvent) (tr : CaseLaw2.TEvent)\n  (r : CaseLaw2.Recog), tr.recog = some r → r.power = false → CaseLaw2.Spec.recogEffects byHist wHist tr = []",
  "axioms": [
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.recognised_neg_from_witness",
  "module": "LegalProofs.CaseLaw2.Spec.Recognised",
  "doc": "**The timeline, from W**: with verified power, on the whole decision, while Y and W stand, the status from date(W) is negative: overruled (abrogated for an `abrogated` row).",
  "statement": "CaseLaw2.Spec.recognised_neg_from_witness : ∀ (byHist wHist : List CaseLaw2.HEvent) (tr : CaseLaw2.TEvent)\n  (r : CaseLaw2.Recog),\n  tr.recog = some r →\n    tr.explicit = false →\n      tr.kind.changesStatus = true →\n        r.power = true →\n          tr.powerKnown = true →\n            tr.scope = CaseLaw2.Scope.all →\n              tr.date ≤ r.date →\n                CaseLaw2.Spec.lapseOfDecision byHist tr.date = none →\n                  CaseLaw2.Spec.lapseOfDecision wHist r.date = none →\n                    ∀ (k t u : Nat),\n                      r.date ≤ t →\n                        CaseLaw2.Spec.temporalConductFrom tr.temporal tr.date ≤ u →\n                          CaseLaw2.Spec.status (CaseLaw2.Spec.recogEffects byHist wHist tr) k t u =\n                            CaseLaw2.Spec.Status.neg\n                              (if (tr.kind == CaseLaw2.TKind.abrogated) = true then CaseLaw2.Spec.Neg.abrogated\n                              else CaseLaw2.Spec.Neg.overruled)",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.recognised_never_neg_before_witness",
  "module": "LegalProofs.CaseLaw2.Spec.Recognised",
  "doc": "**Never negative before date(W) on a recognised row**: if the status is negative on a question date before the recognising decision, the negative comes from the other effects, not from the recognised row.",
  "statement": "CaseLaw2.Spec.recognised_never_neg_before_witness : ∀ (byHist wHist : List CaseLaw2.HEvent) (tr : CaseLaw2.TEvent)\n  (r : CaseLaw2.Recog),\n  tr.recog = some r →\n    ∀ (l : List CaseLaw2.Spec.Effect) (k t u : Nat),\n      t < r.date →\n        ∀ (n : CaseLaw2.Spec.Neg),\n          CaseLaw2.Spec.status (CaseLaw2.Spec.recogEffects byHist wHist tr ++ l) k t u = CaseLaw2.Spec.Status.neg n →\n            CaseLaw2.Spec.status l k t u = CaseLaw2.Spec.Status.neg n",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.recognised_never_weakens",
  "module": "LegalProofs.CaseLaw2.Spec.Recognised",
  "doc": "**A recognised row never weakens an existing status**: with the row, the status is at least as severe.",
  "statement": "CaseLaw2.Spec.recognised_never_weakens : ∀ (byHist wHist : List CaseLaw2.HEvent) (tr : CaseLaw2.TEvent)\n  (l : List CaseLaw2.Spec.Effect) (k t u : Nat),\n  (CaseLaw2.Spec.status l k t u).rank ≤\n    (CaseLaw2.Spec.status (CaseLaw2.Spec.recogEffects byHist wHist tr ++ l) k t u).rank",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.recognised_not_explicit",
  "module": "LegalProofs.CaseLaw2.Spec.Recognised",
  "doc": "**A row is explicit or recognised, never both**: an explicit row has no recognised effects (its effects are `treatEffects`; with `inferred_treatment_no_effect` each row has one source of effects at most).",
  "statement": "CaseLaw2.Spec.recognised_not_explicit : ∀ (byHist wHist : List CaseLaw2.HEvent) (tr : CaseLaw2.TEvent),\n  tr.explicit = true → CaseLaw2.Spec.recogEffects byHist wHist tr = []",
  "axioms": [
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.recognised_rank_before_witness",
  "module": "LegalProofs.CaseLaw2.Spec.Recognised",
  "doc": "Before date(W) the recognised effects are not negative.",
  "statement": "CaseLaw2.Spec.recognised_rank_before_witness : ∀ (byHist wHist : List CaseLaw2.HEvent) (tr : CaseLaw2.TEvent)\n  (r : CaseLaw2.Recog),\n  tr.recog = some r →\n    ∀ (k t u : Nat), t < r.date → (CaseLaw2.Spec.status (CaseLaw2.Spec.recogEffects byHist wHist tr) k t u).rank < 10",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.recognised_unknown_between",
  "module": "LegalProofs.CaseLaw2.Spec.Recognised",
  "doc": "**The timeline, between Y and W**: with verified power, on the whole decision, while Y stands, the status from date(Y) up to the day before date(W) is `unknown recognisedLater`.",
  "statement": "CaseLaw2.Spec.recognised_unknown_between : ∀ (byHist wHist : List CaseLaw2.HEvent) (tr : CaseLaw2.TEvent)\n  (r : CaseLaw2.Recog),\n  tr.recog = some r →\n    tr.explicit = false →\n      tr.kind.changesStatus = true →\n        r.power = true →\n          tr.powerKnown = true →\n            tr.scope = CaseLaw2.Scope.all →\n              CaseLaw2.Spec.lapseOfDecision byHist tr.date = none →\n                ∀ (k t u : Nat),\n                  tr.date ≤ t →\n                    t < r.date →\n                      CaseLaw2.Spec.temporalConductFrom tr.temporal tr.date ≤ u →\n                        CaseLaw2.Spec.status (CaseLaw2.Spec.recogEffects byHist wHist tr) k t u =\n                          CaseLaw2.Spec.Status.unknown CaseLaw2.Spec.Unk.recognisedLater",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.relation_fed_on_state",
  "module": "LegalProofs.CaseLaw2.Spec.AuthorityThms",
  "doc": "",
  "statement": "CaseLaw2.Spec.relation_fed_on_state : ∀ (L : CaseLaw2.Lookups) (S : CaseLaw2.CourtEpoch) (x : CaseLaw2.Decision)\n  (s : Nat) (q : CaseLaw2.Spec.Query),\n  S.system = 0 →\n    q.dst.system ≠ 0 → (CaseLaw2.Spec.relation L S x (CaseLaw2.Domain.stateLaw s) q).fst = CaseLaw2.Force.persuasive",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.relation_lastResort_own_law",
  "module": "LegalProofs.CaseLaw2.Spec.AuthorityThms",
  "doc": "",
  "statement": "CaseLaw2.Spec.relation_lastResort_own_law : ∀ (L : CaseLaw2.Lookups) (S : CaseLaw2.CourtEpoch) (x : CaseLaw2.Decision)\n  (q : CaseLaw2.Spec.Query),\n  q.dst.tier = CaseLaw2.Tier.last →\n    q.dst.system ≠ 0 →\n      (CaseLaw2.Spec.relation L S x (CaseLaw2.Domain.stateLaw q.dst.system) q).fst.rank ≤\n        CaseLaw2.Force.persuasiveStrong.rank",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.relation_scotus_federal",
  "module": "LegalProofs.CaseLaw2.Spec.AuthorityThms",
  "doc": "",
  "statement": "CaseLaw2.Spec.relation_scotus_federal : ∀ (L : CaseLaw2.Lookups) (S : CaseLaw2.CourtEpoch) (x : CaseLaw2.Decision)\n  (dom : CaseLaw2.Domain) (q : CaseLaw2.Spec.Query),\n  S.scotus = true →\n    dom.federal = true →\n      q.dst.tier ≠ CaseLaw2.Tier.last →\n        CaseLaw2.Spec.relation L S x dom q = (CaseLaw2.Force.binding, CaseLaw2.RuleId.F1)",
  "axioms": [
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.relation_state_on_federal",
  "module": "LegalProofs.CaseLaw2.Spec.AuthorityThms",
  "doc": "",
  "statement": "CaseLaw2.Spec.relation_state_on_federal : ∀ (L : CaseLaw2.Lookups) (S : CaseLaw2.CourtEpoch) (x : CaseLaw2.Decision)\n  (dom : CaseLaw2.Domain) (q : CaseLaw2.Spec.Query),\n  S.system ≠ 0 →\n    dom.federal = true →\n      q.dst.system = 0 →\n        CaseLaw2.Spec.relation L S x dom q = (CaseLaw2.Force.persuasive, CaseLaw2.RuleId.E3stateOnFederal)",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.relation_trial",
  "module": "LegalProofs.CaseLaw2.Spec.AuthorityThms",
  "doc": "",
  "statement": "CaseLaw2.Spec.relation_trial : ∀ (L : CaseLaw2.Lookups) (S : CaseLaw2.CourtEpoch) (x : CaseLaw2.Decision)\n  (dom : CaseLaw2.Domain) (q : CaseLaw2.Spec.Query),\n  S.tier = CaseLaw2.Tier.trial → (CaseLaw2.Spec.relation L S x dom q).fst.rank ≤ CaseLaw2.Force.persuasive.rank",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.resolve_agree",
  "module": "LegalProofs.CaseLaw2.Spec.Splits",
  "doc": "If the binding sub-base agrees, the resolver returns it unchanged (no choice is needed).",
  "statement": "CaseLaw2.Spec.resolve_agree : ∀ (f : Bool) (s : Option CaseLaw2.TrialScope) (cs : List CaseLaw2.Spec.Cand),\n  CaseLaw2.Spec.agree (CaseLaw2.Spec.top cs) = true → CaseLaw2.Spec.resolve f s cs = CaseLaw2.Spec.top cs",
  "axioms": [
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.resolve_nonempty",
  "module": "LegalProofs.CaseLaw2.Spec.Splits",
  "doc": "With some binding candidate, the resolver is never empty.",
  "statement": "CaseLaw2.Spec.resolve_nonempty : ∀ (f : Bool) (s : Option CaseLaw2.TrialScope) (cs : List CaseLaw2.Spec.Cand),\n  (∃ c, c ∈ cs ∧ c.counts = true) → CaseLaw2.Spec.resolve f s cs ≠ []",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.resolve_sound",
  "module": "LegalProofs.CaseLaw2.Spec.Splits",
  "doc": "The resolver only returns candidates it was given, and only binding-sub-base ones.",
  "statement": "CaseLaw2.Spec.resolve_sound : ∀ (f : Bool) (s : Option CaseLaw2.TrialScope) (cs : List CaseLaw2.Spec.Cand)\n  (c : CaseLaw2.Spec.Cand), c ∈ CaseLaw2.Spec.resolve f s cs → c ∈ cs ∧ c.counts = true",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.resolve_sub_top",
  "module": "LegalProofs.CaseLaw2.Spec.Splits",
  "doc": "",
  "statement": "CaseLaw2.Spec.resolve_sub_top : ∀ (f : Bool) (s : Option CaseLaw2.TrialScope) (cs : List CaseLaw2.Spec.Cand)\n  (c : CaseLaw2.Spec.Cand), c ∈ CaseLaw2.Spec.resolve f s cs → c ∈ CaseLaw2.Spec.top cs",
  "axioms": [
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.revival_counterexample",
  "module": "LegalProofs.CaseLaw2.Spec.Status",
  "doc": "**Revival refutes unrestricted monotonicity** (T3): an overruling whose overruling decision is later vacated lapses, and the holding is good law again. The monotonicity theorem's no-lapse hypothesis cannot be dropped.",
  "statement": "CaseLaw2.Spec.revival_counterexample : ∃ l k u t t',\n  t ≤ t' ∧\n    CaseLaw2.Spec.status l k t u = CaseLaw2.Spec.Status.neg CaseLaw2.Spec.Neg.overruled ∧\n      CaseLaw2.Spec.status l k t' u = CaseLaw2.Spec.Status.good",
  "axioms": [
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.same_day_events_commute",
  "module": "LegalProofs.CaseLaw2.Spec.Status",
  "doc": "Two events (e.g. on one day, on distinct holdings) commute.",
  "statement": "CaseLaw2.Spec.same_day_events_commute : ∀ (l₁ l₂ : List CaseLaw2.Spec.Effect) (e₁ e₂ : CaseLaw2.Spec.Effect)\n  (k t u : Nat), CaseLaw2.Spec.status (l₁ ++ e₁ :: e₂ :: l₂) k t u = CaseLaw2.Spec.status (l₁ ++ e₂ :: e₁ :: l₂) k t u",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.scotus_binds_federal",
  "module": "LegalProofs.CaseLaw2.Spec.AuthorityThms",
  "doc": "§9 22(a): a published, full-court SCOTUS majority holding on a federal issue binds every court below the Supreme Court, whatever the tables say.",
  "statement": "CaseLaw2.Spec.scotus_binds_federal : ∀ (L : CaseLaw2.Lookups) (x : CaseLaw2.Decision) (h : CaseLaw2.Holding)\n  (q : CaseLaw2.Spec.Query) (S : CaseLaw2.CourtEpoch),\n  L.epochAt x.court x.date = some S →\n    S.scotus = true →\n      (∀ (d : CaseLaw2.Domain), h.domain = some d → d.federal = true) →\n        x.pub = some CaseLaw2.Publication.published →\n          x.form = some CaseLaw2.Form.full ∨ x.form = some CaseLaw2.Form.perCuriam →\n            h.role ≠ some CaseLaw2.Role.plurality →\n              q.dst.tier ≠ CaseLaw2.Tier.last →\n                Option.map (fun x => x.fst) (CaseLaw2.Spec.force L x h false q) = some CaseLaw2.Force.binding",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.scotus_resolves",
  "module": "LegalProofs.CaseLaw2.Spec.Splits",
  "doc": "**A binding SCOTUS holding resolves the issue for every court it binds**: if a court's candidates include a binding SCOTUS holding with answer `a`, no candidate outranks SCOTUS, and every SCOTUS candidate in the binding base answers `a`, then every permissible holding answers `a`.",
  "statement": "CaseLaw2.Spec.scotus_resolves : ∀ (f : Bool) (s : Option CaseLaw2.TrialScope) (cs : List CaseLaw2.Spec.Cand)\n  (a : CaseLaw2.Answer),\n  (∃ c, c ∈ cs ∧ c.prec = CaseLaw2.Spec.scotusPrec ∧ c.force = CaseLaw2.Force.binding ∧ c.answer = a) →\n    (∀ (c : CaseLaw2.Spec.Cand), c ∈ cs → c.prec ≤ CaseLaw2.Spec.scotusPrec) →\n      (∀ (c : CaseLaw2.Spec.Cand), c ∈ cs → c.prec = CaseLaw2.Spec.scotusPrec → c.counts = true → c.answer = a) →\n        ∀ (c : CaseLaw2.Spec.Cand), c ∈ CaseLaw2.Spec.resolve f s cs → c.answer = a",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.scotus_resolves_split",
  "module": "LegalProofs.CaseLaw2.Spec.Splits",
  "doc": "**A later binding SCOTUS holding resolves any split** among the courts it binds.",
  "statement": "CaseLaw2.Spec.scotus_resolves_split : ∀ (f₁ f₂ : Bool) (s₁ s₂ : Option CaseLaw2.TrialScope)\n  (cs₁ cs₂ : List CaseLaw2.Spec.Cand) (a : CaseLaw2.Answer) (b : Bool),\n  (∃ c, c ∈ cs₁ ∧ c.prec = CaseLaw2.Spec.scotusPrec ∧ c.force = CaseLaw2.Force.binding ∧ c.answer = a) →\n    (∃ c, c ∈ cs₂ ∧ c.prec = CaseLaw2.Spec.scotusPrec ∧ c.force = CaseLaw2.Force.binding ∧ c.answer = a) →\n      (∀ (c : CaseLaw2.Spec.Cand), c ∈ cs₁ → c.prec ≤ CaseLaw2.Spec.scotusPrec) →\n        (∀ (c : CaseLaw2.Spec.Cand), c ∈ cs₂ → c.prec ≤ CaseLaw2.Spec.scotusPrec) →\n          (∀ (c : CaseLaw2.Spec.Cand), c ∈ cs₁ → c.prec = CaseLaw2.Spec.scotusPrec → c.counts = true → c.answer = a) →\n            (∀ (c : CaseLaw2.Spec.Cand), c ∈ cs₂ → c.prec = CaseLaw2.Spec.scotusPrec → c.counts = true → c.answer = a) →\n              CaseLaw2.Spec.split (CaseLaw2.Spec.resolve f₁ s₁ cs₁) (CaseLaw2.Spec.resolve f₂ s₂ cs₂) b = false",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.soft_claim_disjoint",
  "module": "LegalProofs.CaseLaw2.Spec.Findings",
  "doc": "Soft and claim risks never coincide: a soft kind never changes status.",
  "statement": "CaseLaw2.Spec.soft_claim_disjoint : ∀ (r : CaseLaw2.Spec.TreatRisk),\n  (!decide ((CaseLaw2.Spec.softRisk r && CaseLaw2.Spec.claimRisk r) = true)) = true",
  "axioms": [
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.soft_treatment_no_effect",
  "module": "LegalProofs.CaseLaw2.Spec.Status",
  "doc": "Soft treatments never change status (§5.2 T1).",
  "statement": "CaseLaw2.Spec.soft_treatment_no_effect : ∀ (byHist : List CaseLaw2.HEvent) (tr : CaseLaw2.TEvent),\n  tr.kind.changesStatus = false → CaseLaw2.Spec.treatEffect byHist tr = none",
  "axioms": [
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.statusFor_all",
  "module": "LegalProofs.CaseLaw2.Spec.Status",
  "doc": "Where every effect reaches every line (no heir, or only history, statutes and SCOTUS), status does not depend on the court asking.",
  "statement": "CaseLaw2.Spec.statusFor_all : ∀ (inLine : Nat → Bool) (l : List CaseLaw2.Spec.Effect) (k t u : Nat),\n  (∀ (e : CaseLaw2.Spec.Effect), e ∈ l → e.reach = CaseLaw2.Spec.Reach.all) →\n    CaseLaw2.Spec.statusFor inLine l k t u = CaseLaw2.Spec.status l k t u",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.statusFor_congr",
  "module": "LegalProofs.CaseLaw2.Spec.Lines",
  "doc": "Status in a line depends only on which effects reach the court.",
  "statement": "CaseLaw2.Spec.statusFor_congr : ∀ (p q : Nat → Bool) (l : List CaseLaw2.Spec.Effect) (k t u : Nat),\n  (∀ (e : CaseLaw2.Spec.Effect), e ∈ l → CaseLaw2.Spec.Effect.reaches p e = CaseLaw2.Spec.Effect.reaches q e) →\n    CaseLaw2.Spec.statusFor p l k t u = CaseLaw2.Spec.statusFor q l k t u",
  "axioms": [
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.statusFor_le_status",
  "module": "LegalProofs.CaseLaw2.Spec.Lines",
  "doc": "The union status (`status.tsv`) is at least as severe as the status in any line.",
  "statement": "CaseLaw2.Spec.statusFor_le_status : ∀ (inLine : Nat → Bool) (l : List CaseLaw2.Spec.Effect) (k t u : Nat),\n  (CaseLaw2.Spec.statusFor inLine l k t u).rank ≤ (CaseLaw2.Spec.status l k t u).rank",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.status_append",
  "module": "LegalProofs.CaseLaw2.Spec.Recognised",
  "doc": "The status of two lists of effects together is the join of their statuses.",
  "statement": "CaseLaw2.Spec.status_append : ∀ (a l : List CaseLaw2.Spec.Effect) (k t u : Nat),\n  CaseLaw2.Spec.status (a ++ l) k t u = (CaseLaw2.Spec.status a k t u).join (CaseLaw2.Spec.status l k t u)",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.status_append_comm",
  "module": "LegalProofs.CaseLaw2.Spec.Recognised",
  "doc": "**Order independence across groups of effects** (round 5): the effects of a recognised row, of an explicit row and of anything else may be taken in any order (a corollary of `status_perm`).",
  "statement": "CaseLaw2.Spec.status_append_comm : ∀ (a b l : List CaseLaw2.Spec.Effect) (k t u : Nat),\n  CaseLaw2.Spec.status (a ++ b ++ l) k t u = CaseLaw2.Spec.status (b ++ a ++ l) k t u",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.status_append_rank_le",
  "module": "LegalProofs.CaseLaw2.Spec.Recognised",
  "doc": "Adding effects never makes a status less severe.",
  "statement": "CaseLaw2.Spec.status_append_rank_le : ∀ (a l : List CaseLaw2.Spec.Effect) (k t u : Nat),\n  (CaseLaw2.Spec.status l k t u).rank ≤ (CaseLaw2.Spec.status (a ++ l) k t u).rank",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.status_cons",
  "module": "LegalProofs.CaseLaw2.Spec.Status",
  "doc": "",
  "statement": "CaseLaw2.Spec.status_cons : ∀ (e : CaseLaw2.Spec.Effect) (l : List CaseLaw2.Spec.Effect) (k t u : Nat),\n  CaseLaw2.Spec.status (e :: l) k t u = (e.contrib k t u).join (CaseLaw2.Spec.status l k t u)",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.status_cons_good",
  "module": "LegalProofs.CaseLaw2.Spec.Status",
  "doc": "An effect that contributes nothing leaves the status unchanged.",
  "statement": "CaseLaw2.Spec.status_cons_good : ∀ (e : CaseLaw2.Spec.Effect) (l : List CaseLaw2.Spec.Effect) (k t u : Nat),\n  e.contrib k t u = CaseLaw2.Spec.Status.good → CaseLaw2.Spec.status (e :: l) k t u = CaseLaw2.Spec.status l k t u",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.status_filter_le",
  "module": "LegalProofs.CaseLaw2.Spec.Lines",
  "doc": "",
  "statement": "CaseLaw2.Spec.status_filter_le : ∀ (p : CaseLaw2.Spec.Effect → Bool) (l : List CaseLaw2.Spec.Effect) (k t u : Nat),\n  (CaseLaw2.Spec.status (List.filter p l) k t u).rank ≤ (CaseLaw2.Spec.status l k t u).rank",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.status_mono",
  "module": "LegalProofs.CaseLaw2.Spec.Status",
  "doc": "**Monotonicity** (§9 22(e), generalising v1 `overruledOn_mono`): without lapse (no vacatur, withdrawal or reversal of an overruling decision, no reinstatement, no dismissal of review), status only worsens as the question date advances.",
  "statement": "CaseLaw2.Spec.status_mono : ∀ (l : List CaseLaw2.Spec.Effect) (k u t t' : Nat),\n  t ≤ t' →\n    (∀ (e : CaseLaw2.Spec.Effect), e ∈ l → e.lapse = none) →\n      (CaseLaw2.Spec.status l k t u).rank ≤ (CaseLaw2.Spec.status l k t' u).rank",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.status_mono_conduct",
  "module": "LegalProofs.CaseLaw2.Spec.Status",
  "doc": "Status only worsens as the conduct date advances (every effect reaches later conduct if it reaches earlier).",
  "statement": "CaseLaw2.Spec.status_mono_conduct : ∀ (l : List CaseLaw2.Spec.Effect) (k t u u' : Nat),\n  u ≤ u' → (CaseLaw2.Spec.status l k t u).rank ≤ (CaseLaw2.Spec.status l k t u').rank",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.status_perm",
  "module": "LegalProofs.CaseLaw2.Spec.Status",
  "doc": "Status does not depend on the order of the events.",
  "statement": "@CaseLaw2.Spec.status_perm : ∀ {l₁ l₂ : List CaseLaw2.Spec.Effect},\n  l₁.Perm l₂ → ∀ (k t u : Nat), CaseLaw2.Spec.status l₁ k t u = CaseLaw2.Spec.status l₂ k t u",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.status_rank_mono_of",
  "module": "LegalProofs.CaseLaw2.Spec.Status",
  "doc": "",
  "statement": "CaseLaw2.Spec.status_rank_mono_of : ∀ (l : List CaseLaw2.Spec.Effect) (k t u t' u' : Nat),\n  (∀ (e : CaseLaw2.Spec.Effect), e ∈ l → (e.contrib k t u).rank ≤ (e.contrib k t' u').rank) →\n    (CaseLaw2.Spec.status l k t u).rank ≤ (CaseLaw2.Spec.status l k t' u').rank",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.supersession_prospective",
  "module": "LegalProofs.CaseLaw2.Spec.Status",
  "doc": "**Supersession is prospective** (§7 AB1): conduct before the effective (or retroactive) date keeps the old rule: the supersession contributes nothing to the status for such conduct.",
  "statement": "CaseLaw2.Spec.supersession_prospective : ∀ (s : CaseLaw2.SEvent) (e : CaseLaw2.Spec.Effect),\n  CaseLaw2.Spec.superEffect s = some e →\n    ∀ (l : List CaseLaw2.Spec.Effect) (k t u : Nat),\n      u < s.retroactiveTo.getD s.effective → CaseLaw2.Spec.status (e :: l) k t u = CaseLaw2.Spec.status l k t u",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.top_sub",
  "module": "LegalProofs.CaseLaw2.Spec.Splits",
  "doc": "",
  "statement": "CaseLaw2.Spec.top_sub : ∀ (cs : List CaseLaw2.Spec.Cand) (c : CaseLaw2.Spec.Cand),\n  c ∈ CaseLaw2.Spec.top cs → c ∈ cs ∧ c.counts = true",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.treatEffect_scope",
  "module": "LegalProofs.CaseLaw2.Spec.Recognised",
  "doc": "A treatment's effect has the treatment's scope.",
  "statement": "CaseLaw2.Spec.treatEffect_scope : ∀ (byHist : List CaseLaw2.HEvent) (tr : CaseLaw2.TEvent) (e : CaseLaw2.Spec.Effect),\n  CaseLaw2.Spec.treatEffect byHist tr = some e → e.scope = tr.scope",
  "axioms": [
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.treatEffects_scope",
  "module": "LegalProofs.CaseLaw2.Spec.Recognised",
  "doc": "Every effect of a treatment (the effect, and its revival) has the treatment's scope.",
  "statement": "CaseLaw2.Spec.treatEffects_scope : ∀ (byHist : List CaseLaw2.HEvent) (tr : CaseLaw2.TEvent) (e : CaseLaw2.Spec.Effect),\n  e ∈ CaseLaw2.Spec.treatEffects byHist tr → e.scope = tr.scope",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.trial_never_binding",
  "module": "LegalProofs.CaseLaw2.Spec.AuthorityThms",
  "doc": "§9 22(d), F13/§4.4: a trial court's decision (not promoted, not adopted) is at most persuasive for every court.",
  "statement": "CaseLaw2.Spec.trial_never_binding : ∀ (L : CaseLaw2.Lookups) (x : CaseLaw2.Decision) (h : CaseLaw2.Holding)\n  (q : CaseLaw2.Spec.Query) (S : CaseLaw2.CourtEpoch),\n  L.epochAt x.court x.date = some S →\n    S.tier = CaseLaw2.Tier.trial →\n      CaseLaw2.Spec.adoptionsOf L x = [] →\n        ∀ (r : CaseLaw2.Force × List CaseLaw2.RuleId),\n          CaseLaw2.Spec.force L x h false q = some r → r.fst.rank ≤ CaseLaw2.Force.persuasive.rank",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.unionBase_sub_lineBase",
  "module": "LegalProofs.CaseLaw2.Spec.Lines",
  "doc": "The union base is inside every line's base.",
  "statement": "CaseLaw2.Spec.unionBase_sub_lineBase : ∀ (inLine : Nat → Bool) (t : Nat)\n  (hs : List (CaseLaw2.Spec.Held CaseLaw2.Spec.Horty.FCase)) (c : CaseLaw2.Spec.Horty.FCase),\n  c ∈ CaseLaw2.Spec.heldUnion t hs → c ∈ CaseLaw2.Spec.lineBase inLine t hs",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.witness_without_claim_no_effect",
  "module": "LegalProofs.CaseLaw2.Spec.Recognised",
  "doc": "**A witness row without recognition has no status effect**: the round-4 \"at risk\" tier is unchanged.",
  "statement": "CaseLaw2.Spec.witness_without_claim_no_effect : ∀ (byHist wHist : List CaseLaw2.HEvent) (tr : CaseLaw2.TEvent),\n  tr.recog = none → CaseLaw2.Spec.recogEffects byHist wHist tr = []",
  "axioms": [
   "propext"
  ]
 }
]