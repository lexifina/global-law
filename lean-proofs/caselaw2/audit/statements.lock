 {
  "name": "CaseLaw2.Cert.checkAnchored_disposition",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**The disposition quote of an anchored row**: every conjunct of `checkCert_sound` except `resolves` (the anchor carries the target evidence): a known hash, the quote at its offset in a usable window, a cue of the kind, no disqualifier, an allowed part, the date order, and `ok` only with verified power.",
  "statement": "CaseLaw2.Cert.checkAnchored_disposition : ∀ (c : CaseLaw2.Cert.Input) (a : CaseLaw2.Cert.Anchor),\n  (CaseLaw2.Cert.checkAnchored c a).admitted = true →\n    CaseLaw2.Cert.shaOk c = true ∧\n      (∃ w, CaseLaw2.Cert.coveringWindow c = some w ∧ CaseLaw2.Cert.quoteAt c w = true) ∧\n        CaseLaw2.Cert.hasCue c = true ∧\n          CaseLaw2.Cert.disqualified c = false ∧\n            CaseLaw2.Cert.partOk c = true ∧\n              c.ordered = true ∧\n                (CaseLaw2.Cert.checkAnchored c a = CaseLaw2.Cert.Result.ok → c.authority = some true) ∧\n                  (CaseLaw2.Cert.checkAnchored c a = CaseLaw2.Cert.Result.okUnverifiedBy → c.authority = none)",
