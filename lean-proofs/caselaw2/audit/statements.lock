[
 {
  "name": "CaseLaw2.Cert.Window.digest_eq",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "",
  "statement": "CaseLaw2.Cert.Window.digest_eq : ∀ (self : CaseLaw2.Cert.Window), self.digest.get = CaseLaw2.Sha1.hex self.text",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.actorCiteWhere_some",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "",
  "statement": "CaseLaw2.Cert.actorCiteWhere_some : ∀ (c : CaseLaw2.Cert.Input) (b : CaseLaw2.Cert.Bridge) (ok : Nat → Bool)\n  (p n : Nat),\n  CaseLaw2.Cert.actorCiteWhere c b ok = some (p, n) →\n    ∃ m,\n      c.citeIndex = some m ∧\n        ok p = true ∧\n          ∃ s,\n            s <:+ CaseLaw2.Cert.bridgeAlnum b ∧\n              CaseLaw2.Cert.headPos s = some p ∧\n                CaseLaw2.Cert.citeFirst m b.lens s = some n ∧ ∃ L, L ∈ b.lens ∧ CaseLaw2.Cert.citeOf m s L = some n",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.allSuffix_spec",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "",
  "statement": "@CaseLaw2.Cert.allSuffix_spec : ∀ {α : Type} (p : List α → Bool) (l : List α),\n  CaseLaw2.Cert.allSuffix p l = true → ∀ (s : List α), s <:+ l → p s = true",
  "axioms": [
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.ambiguousLabel_filter",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "The runner decides a label's ambiguity on the rows that carry it (a bucket per label); that is the same answer as on the whole table.",
  "statement": "CaseLaw2.Cert.ambiguousLabel_filter : ∀ (rows : List CaseLaw2.Cert.DoctrineRow) (l : String),\n  CaseLaw2.Cert.ambiguousLabel (List.filter (fun r => r.labels.contains l) rows) l = CaseLaw2.Cert.ambiguousLabel rows l",
  "axioms": [
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.anchorTail_none",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "",
  "statement": "CaseLaw2.Cert.anchorTail_none : ∀ (h : CaseLaw2.Cert.HClaims) (c : CaseLaw2.Cert.Input),\n  CaseLaw2.Cert.anchorTail none h c =\n    CaseLaw2.Cert.checkClaimedWith CaseLaw2.Cert.orderHeadOk CaseLaw2.Cert.claimCueOk h",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.anchorTribunal_eq",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**Tribunal anchor, exactly** (§5.1): with the claim, an anchored row without a bridge line is checked by the round-10 anchored check with the union cue list (whatever `anchorWide` says).",
  "statement": "CaseLaw2.Cert.anchorTribunal_eq : ∀ (t? : Option CaseLaw2.Cert.TBridge) (c : CaseLaw2.Cert.Input)\n  (a : CaseLaw2.Cert.Anchor) (h : CaseLaw2.Cert.HClaims),\n  h.anchorTribunal = true →\n    CaseLaw2.Cert.checkHistory8A t? c (some a) none h =\n      CaseLaw2.Cert.anchoredBy CaseLaw2.Cert.anchorTribunalCue (CaseLaw2.Cert.anchorTail t? h c) c a",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.anchorTribunal_no_claim",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**No claim, no change** (§5.1): without the claim the cue test is round 10's, and the round-11 steps are round 10's (`checkHistory8T`, `checkHistory10T`).",
  "statement": "CaseLaw2.Cert.anchorTribunal_no_claim : ∀ (t? : Option CaseLaw2.Cert.TBridge) (rm? : Option CaseLaw2.Cert.Remand)\n  (zs : List CaseLaw2.Cert.Zone) (c : CaseLaw2.Cert.Input) (a? : Option CaseLaw2.Cert.Anchor)\n  (b? : Option CaseLaw2.Cert.Bridge) (h : CaseLaw2.Cert.HClaims),\n  h.anchorTribunal = false →\n    CaseLaw2.Cert.anchorCueOk11 h = CaseLaw2.Cert.anchorCueOk9 h ∧\n      CaseLaw2.Cert.checkHistory8A t? c a? b? h = CaseLaw2.Cert.checkHistory8T t? c a? b? h ∧\n        CaseLaw2.Cert.checkHistory11 t? rm? zs c a? b? h = CaseLaw2.Cert.checkHistory10T t? rm? zs c a? b? h",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.anchorTribunal_sound",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**Tribunal anchor soundness** (§5.1): an admitted anchored row (no bridge line) with the claim has a cue of `anchor ++ anchor_wide ++ anchor_wide9 ++ anchor_tribunal` in its anchor quote, and every other anchored check holds (the anchor quote at its offset, no anchor disqualifier, the target named in the anchor quote, the anchor part, and the row's last step — the claimed check, or the trial check of a counted trialBridge claim — admits).",
  "statement": "CaseLaw2.Cert.anchorTribunal_sound : ∀ (t? : Option CaseLaw2.Cert.TBridge) (c : CaseLaw2.Cert.Input)\n  (a : CaseLaw2.Cert.Anchor) (h : CaseLaw2.Cert.HClaims),\n  h.anchorTribunal = true →\n    (CaseLaw2.Cert.checkHistory8A t? c (some a) none h).admitted = true →\n      (CaseLaw2.Cert.anchorCues ++ CaseLaw2.Cert.anchorWideCues ++ CaseLaw2.Cert.anchorWide9Cues ++\n                CaseLaw2.Cert.anchorTribunalCues).any\n            (CaseLaw2.Cert.hasSub (CaseLaw2.Cert.norm a.quote).toLower) =\n          true ∧\n        CaseLaw2.Cert.anchorQuoteOk c a = true ∧\n          CaseLaw2.Cert.anchorDisqualified a = false ∧\n            CaseLaw2.Cert.anchorResolves c a = true ∧\n              CaseLaw2.Cert.anchorPartOk a = true ∧\n                (CaseLaw2.Cert.anchorTail t? h c\n                      { kind := c.kind, textSha := c.textSha, start := c.start, stop := c.stop, quote := c.quote,\n                        evidence := c.evidence, part := c.part, shas := c.shas, windows := c.windows,\n                        ordered := c.ordered, authority := c.authority, selfText := true,\n                        hashRequired := c.hashRequired, target := c.target, citeIndex := c.citeIndex,\n                        mode := c.mode }).admitted =\n                  true",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.anchorWide9_no_claim",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**No claim, no change** (§8): without an `anchorWide` claim the step is round 8's, and the round-9 history step is `checkHistory9`.",
  "statement": "CaseLaw2.Cert.anchorWide9_no_claim : ∀ (c : CaseLaw2.Cert.Input) (a? : Option CaseLaw2.Cert.Anchor)\n  (b? : Option CaseLaw2.Cert.Bridge) (h : CaseLaw2.Cert.HClaims) (zs : List CaseLaw2.Cert.Zone),\n  h.anchorWide = false →\n    CaseLaw2.Cert.checkHistory8J c a? b? h = CaseLaw2.Cert.checkHistory8 c a? b? h ∧\n      CaseLaw2.Cert.checkHistory9J zs c a? b? h = CaseLaw2.Cert.checkHistory9 zs c a? b? h",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.anchorWide9_sound",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**Judge-form cues** (§8): an admitted anchored row with the claim has a cue of `anchor ++ anchor_wide ++ anchor_wide9` in its anchor quote, and every other anchored check holds.",
  "statement": "CaseLaw2.Cert.anchorWide9_sound : ∀ (c : CaseLaw2.Cert.Input) (a : CaseLaw2.Cert.Anchor) (h : CaseLaw2.Cert.HClaims),\n  h.anchorWide = true →\n    (CaseLaw2.Cert.checkHistory8J c (some a) none h).admitted = true →\n      (CaseLaw2.Cert.anchorCues ++ CaseLaw2.Cert.anchorWideCues ++ CaseLaw2.Cert.anchorWide9Cues).any\n            (CaseLaw2.Cert.hasSub (CaseLaw2.Cert.norm a.quote).toLower) =\n          true ∧\n        CaseLaw2.Cert.anchorQuoteOk c a = true ∧\n          CaseLaw2.Cert.anchorDisqualified a = false ∧\n            CaseLaw2.Cert.anchorResolves c a = true ∧\n              CaseLaw2.Cert.anchorPartOk a = true ∧\n                (CaseLaw2.Cert.checkClaimedWith CaseLaw2.Cert.orderHeadOk CaseLaw2.Cert.claimCueOk h\n                      { kind := c.kind, textSha := c.textSha, start := c.start, stop := c.stop, quote := c.quote,\n                        evidence := c.evidence, part := c.part, shas := c.shas, windows := c.windows,\n                        ordered := c.ordered, authority := c.authority, selfText := true,\n                        hashRequired := c.hashRequired, target := c.target, citeIndex := c.citeIndex,\n                        mode := c.mode }).admitted =\n                  true",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.anchorWide_no_claim",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "§5: **without the claim** the anchor-cue test and the anchored check are round 7's.",
  "statement": "CaseLaw2.Cert.anchorWide_no_claim : ∀ (c : CaseLaw2.Cert.Input) (a : CaseLaw2.Cert.Anchor) (h : CaseLaw2.Cert.HClaims),\n  h.anchorWide = false →\n    CaseLaw2.Cert.anchorCueOk h a = CaseLaw2.Cert.anchorHasCue a ∧\n      CaseLaw2.Cert.checkHistory8 c (some a) none h = CaseLaw2.Cert.checkHistory7 c (some a) h",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.anchorWide_sound",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "§5: an admitted anchored row **with the claim** has a cue of `anchor ++ anchor_wide`, and every other anchored check holds.",
  "statement": "CaseLaw2.Cert.anchorWide_sound : ∀ (c : CaseLaw2.Cert.Input) (a : CaseLaw2.Cert.Anchor) (h : CaseLaw2.Cert.HClaims),\n  h.anchorWide = true →\n    (CaseLaw2.Cert.checkHistory8 c (some a) none h).admitted = true →\n      (CaseLaw2.Cert.anchorCues ++ CaseLaw2.Cert.anchorWideCues).any\n            (CaseLaw2.Cert.hasSub (CaseLaw2.Cert.norm a.quote).toLower) =\n          true ∧\n        CaseLaw2.Cert.anchorQuoteOk c a = true ∧\n          CaseLaw2.Cert.anchorDisqualified a = false ∧\n            CaseLaw2.Cert.anchorResolves c a = true ∧\n              CaseLaw2.Cert.anchorPartOk a = true ∧\n                (CaseLaw2.Cert.checkClaimedWith CaseLaw2.Cert.orderHeadOk CaseLaw2.Cert.claimCueOk h\n                      { kind := c.kind, textSha := c.textSha, start := c.start, stop := c.stop, quote := c.quote,\n                        evidence := c.evidence, part := c.part, shas := c.shas, windows := c.windows,\n                        ordered := c.ordered, authority := c.authority, selfText := true,\n                        hashRequired := c.hashRequired, target := c.target, citeIndex := c.citeIndex,\n                        mode := c.mode }).admitted =\n                  true",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.anchoredBy_admitted",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "An admitted `anchoredBy`: the five anchored checks hold and the last step admits.",
  "statement": "CaseLaw2.Cert.anchoredBy_admitted : ∀ (cue : CaseLaw2.Cert.Anchor → Bool)\n  (fin : CaseLaw2.Cert.Input → CaseLaw2.Cert.Result) (c : CaseLaw2.Cert.Input) (a : CaseLaw2.Cert.Anchor),\n  (CaseLaw2.Cert.anchoredBy cue fin c a).admitted = true →\n    CaseLaw2.Cert.anchorQuoteOk c a = true ∧\n      cue a = true ∧\n        CaseLaw2.Cert.anchorDisqualified a = false ∧\n          CaseLaw2.Cert.anchorResolves c a = true ∧\n            CaseLaw2.Cert.anchorPartOk a = true ∧\n              (fin\n                    { kind := c.kind, textSha := c.textSha, start := c.start, stop := c.stop, quote := c.quote,\n                      evidence := c.evidence, part := c.part, shas := c.shas, windows := c.windows,\n                      ordered := c.ordered, authority := c.authority, selfText := true, hashRequired := c.hashRequired,\n                      target := c.target, citeIndex := c.citeIndex, mode := c.mode }).admitted =\n                true",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.anchoredThen_fin",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "An admitted `anchoredThen` row passed its last step on the row's input with the evidence taken as given.",
  "statement": "CaseLaw2.Cert.anchoredThen_fin : ∀ (fin : CaseLaw2.Cert.Input → CaseLaw2.Cert.Result) (c : CaseLaw2.Cert.Input)\n  (a : CaseLaw2.Cert.Anchor),\n  (CaseLaw2.Cert.anchoredThen fin c a).admitted = true →\n    (fin\n          { kind := c.kind, textSha := c.textSha, start := c.start, stop := c.stop, quote := c.quote,\n            evidence := c.evidence, part := c.part, shas := c.shas, windows := c.windows, ordered := c.ordered,\n            authority := c.authority, selfText := true, hashRequired := c.hashRequired, target := c.target,\n            citeIndex := c.citeIndex, mode := c.mode }).admitted =\n      true",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.antecedentFar_gap",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**Far antecedents** (§5): an admitted claimed row's `antecedent` line is before the main quote and within `joinedFarMax`, the main quote has an anaphor and a cue of its kind, and beyond `joinedGapMax` a usable window of the row's text covers the gap, in which no index key of another node begins.",
  "statement": "CaseLaw2.Cert.antecedentFar_gap : ∀ (lens : List Nat) (c : CaseLaw2.Cert.Input) (e : Bool) (cl : CaseLaw2.Cert.TClaim)\n  (js : List CaseLaw2.Cert.Joined),\n  (CaseLaw2.Cert.checkTreatmentF true lens c e cl js).admitted = true →\n    ∀ (j : CaseLaw2.Cert.Joined),\n      j ∈ js →\n        j.rel = CaseLaw2.Cert.JRel.antecedent →\n          j.stop ≤ c.start ∧\n            c.start - j.stop ≤ CaseLaw2.Cert.joinedFarMax ∧\n              CaseLaw2.Cert.anaphorCue c.quote = true ∧\n                CaseLaw2.Cert.kindCue c = true ∧\n                  (c.start - j.stop ≤ CaseLaw2.Cert.joinedGapMax ∨\n                    ∃ w,\n                      w ∈ c.windows ∧\n                        CaseLaw2.Cert.usable (CaseLaw2.Cert.farInput c j) w = true ∧\n                          ∀ (m : Std.HashMap String Nat),\n                            c.citeIndex = some m →\n                              ∀ (s : List (Char × Nat)),\n                                s <:+ CaseLaw2.Cert.farAlnum c j w →\n                                  ∀ (p : Nat),\n                                    CaseLaw2.Cert.headPos s = some p →\n                                      p < c.start - j.stop →\n                                        ∀ (L : Nat),\n                                          L ∈ lens → ∀ (n : Nat), CaseLaw2.Cert.citeOf m s L = some n → n = c.target)",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.antecedent_gap",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**Antecedent**: an admitted row's `antecedent` quote ends before the main quote and at most `joinedGapMax` (300, cue table) characters before it; the main quote has an anaphor and a cue of the row's kind.",
  "statement": "CaseLaw2.Cert.antecedent_gap : ∀ (c : CaseLaw2.Cert.Input) (e : Bool) (cl : CaseLaw2.Cert.TClaim)\n  (js : List CaseLaw2.Cert.Joined),\n  (CaseLaw2.Cert.checkJoined c e cl js).admitted = true →\n    ∀ (j : CaseLaw2.Cert.Joined),\n      j ∈ js →\n        j.rel = CaseLaw2.Cert.JRel.antecedent →\n          j.stop ≤ c.start ∧\n            c.start - j.stop ≤ CaseLaw2.Cert.joinedGapMax ∧\n              CaseLaw2.Cert.anaphorCue c.quote = true ∧ CaseLaw2.Cert.kindCue c = true",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.bridgeActorCite_some",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "",
  "statement": "CaseLaw2.Cert.bridgeActorCite_some : ∀ (c : CaseLaw2.Cert.Input) (b : CaseLaw2.Cert.Bridge) (p2 pO n : Nat),\n  CaseLaw2.Cert.bridgeActorCite c b p2 = some (pO, n) →\n    ∃ m,\n      c.citeIndex = some m ∧\n        p2 < pO ∧\n          ∃ s,\n            s <:+ CaseLaw2.Cert.bridgeAlnum b ∧\n              CaseLaw2.Cert.headPos s = some pO ∧\n                CaseLaw2.Cert.citeFirst m b.lens s = some n ∧ ∃ L, L ∈ b.lens ∧ CaseLaw2.Cert.citeOf m s L = some n",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.bridgeChainOk_some",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "",
  "statement": "CaseLaw2.Cert.bridgeChainOk_some : ∀ (c : CaseLaw2.Cert.Input) (b : CaseLaw2.Cert.Bridge) (p2 : Nat),\n  CaseLaw2.Cert.bridgeChainOk c b p2 = true →\n    ∃ e, CaseLaw2.Cert.bridgeXEnd c b = some e ∧ CaseLaw2.Cert.noKeyBetween c b e p2 = true",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.bridgeFail_authority",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "The bridge steps do not read the acting court's power (the runner decides them once per row).",
  "statement": "CaseLaw2.Cert.bridgeFail_authority : ∀ (c : CaseLaw2.Cert.Input) (b : CaseLaw2.Cert.Bridge) (a : Option Bool),\n  CaseLaw2.Cert.bridgeFail\n      { kind := c.kind, textSha := c.textSha, start := c.start, stop := c.stop, quote := c.quote,\n        evidence := c.evidence, part := c.part, shas := c.shas, windows := c.windows, ordered := c.ordered,\n        authority := a, selfText := c.selfText, hashRequired := c.hashRequired, target := c.target,\n        citeIndex := c.citeIndex, mode := c.mode }\n      b =\n    CaseLaw2.Cert.bridgeFail c b",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.bridgeFail_none_iff",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "Steps 1–6 all hold exactly when the bridge steps report no failure.",
  "statement": "CaseLaw2.Cert.bridgeFail_none_iff : ∀ (c : CaseLaw2.Cert.Input) (b : CaseLaw2.Cert.Bridge),\n  CaseLaw2.Cert.bridgeFail c b = none ↔\n    CaseLaw2.Cert.bridgeQuoteOk c b = true ∧\n      CaseLaw2.Cert.bridgeDateOk b = true ∧\n        CaseLaw2.Cert.bridgeClauseOk b = true ∧\n          ∃ p1 p2,\n            CaseLaw2.Cert.bridgeP1 c b = some p1 ∧\n              CaseLaw2.Cert.bridgeP2 c b p1 = some p2 ∧\n                CaseLaw2.Cert.bridgeChainOk c b p2 = true ∧\n                  Option.map (fun x => x.snd) (CaseLaw2.Cert.bridgeActorCite c b p2) = some b.actor",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.bridgeP1_some",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "",
  "statement": "CaseLaw2.Cert.bridgeP1_some : ∀ (c : CaseLaw2.Cert.Input) (b : CaseLaw2.Cert.Bridge) (p1 : Nat),\n  CaseLaw2.Cert.bridgeP1 c b = some p1 →\n    ∃ m,\n      c.citeIndex = some m ∧\n        ∃ s,\n          s <:+ CaseLaw2.Cert.bridgeAlnum b ∧\n            CaseLaw2.Cert.headPos s = some p1 ∧ ∃ L, L ∈ b.lens ∧ CaseLaw2.Cert.citeOf m s L = some c.target",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.bridgeP2_some",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "",
  "statement": "CaseLaw2.Cert.bridgeP2_some : ∀ (c : CaseLaw2.Cert.Input) (b : CaseLaw2.Cert.Bridge) (p1 p2 : Nat),\n  CaseLaw2.Cert.bridgeP2 c b p1 = some p2 →\n    p1 < p2 ∧ CaseLaw2.Cert.cueHere c.kind (List.drop p2 (CaseLaw2.Cert.bridgeText b)) = true",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.bridgeX_some",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "Step 4 and 5b read the same suffix: X's key at p1 ends at `e`.",
  "statement": "CaseLaw2.Cert.bridgeX_some : ∀ (c : CaseLaw2.Cert.Input) (b : CaseLaw2.Cert.Bridge) (p1 e : Nat),\n  CaseLaw2.Cert.bridgeP1 c b = some p1 →\n    CaseLaw2.Cert.bridgeXEnd c b = some e →\n      ∃ m,\n        c.citeIndex = some m ∧\n          ∃ s,\n            s <:+ CaseLaw2.Cert.bridgeAlnum b ∧\n              CaseLaw2.Cert.headPos s = some p1 ∧\n                ∃ L, L ∈ b.lens ∧ CaseLaw2.Cert.citeOf m s L = some c.target ∧ CaseLaw2.Cert.keyEnd s L = e",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.bridge_admitted_iff",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**Admission is exactly steps 1–6 and the row's own check.**",
  "statement": "CaseLaw2.Cert.bridge_admitted_iff : ∀ (c : CaseLaw2.Cert.Input) (b : CaseLaw2.Cert.Bridge) (h : CaseLaw2.Cert.HClaims),\n  (CaseLaw2.Cert.checkBridge c b h).admitted = true ↔\n    CaseLaw2.Cert.bridgeQuoteOk c b = true ∧\n      CaseLaw2.Cert.bridgeDateOk b = true ∧\n        CaseLaw2.Cert.bridgeClauseOk b = true ∧\n          (∃ p1 p2,\n              CaseLaw2.Cert.bridgeP1 c b = some p1 ∧\n                CaseLaw2.Cert.bridgeP2 c b p1 = some p2 ∧\n                  CaseLaw2.Cert.bridgeChainOk c b p2 = true ∧\n                    Option.map (fun x => x.snd) (CaseLaw2.Cert.bridgeActorCite c b p2) = some b.actor) ∧\n            (CaseLaw2.Cert.checkClaimedWith CaseLaw2.Cert.orderHeadOk CaseLaw2.Cert.claimCueOk h\n                  { kind := c.kind, textSha := c.textSha, start := c.start, stop := c.stop, quote := c.quote,\n                    evidence := c.evidence, part := c.part, shas := c.shas, windows := c.windows, ordered := c.ordered,\n                    authority := c.authority, selfText := true, hashRequired := c.hashRequired, target := c.target,\n                    citeIndex := c.citeIndex, mode := c.mode }).admitted =\n              true",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.bridge_order",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**Order**: X's citation, then the cue (with no key between X's citation and the cue), then O's citation.",
  "statement": "CaseLaw2.Cert.bridge_order : ∀ (c : CaseLaw2.Cert.Input) (b : CaseLaw2.Cert.Bridge) (h : CaseLaw2.Cert.HClaims),\n  (CaseLaw2.Cert.checkBridge c b h).admitted = true →\n    ∃ p1 e p2 pO,\n      CaseLaw2.Cert.bridgeP1 c b = some p1 ∧\n        CaseLaw2.Cert.bridgeXEnd c b = some e ∧\n          CaseLaw2.Cert.bridgeP2 c b p1 = some p2 ∧\n            CaseLaw2.Cert.bridgeActorCite c b p2 = some (pO, b.actor) ∧\n              p1 < p2 ∧ p2 < pO ∧ CaseLaw2.Cert.noKeyBetween c b e p2 = true",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.bridge_sound",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**Bridge soundness** (DESIGN8 §4, steps 1–7).",
  "statement": "CaseLaw2.Cert.bridge_sound : ∀ (c : CaseLaw2.Cert.Input) (b : CaseLaw2.Cert.Bridge) (h : CaseLaw2.Cert.HClaims),\n  (CaseLaw2.Cert.checkBridge c b h).admitted = true →\n    (b.quote ≠ \"\" ∧\n        b.start < b.stop ∧\n          b.stop - b.start ≤ CaseLaw2.Cert.bridgeMaxLen ∧\n            ∃ w,\n              CaseLaw2.Cert.coveringWindow (b.input c) = some w ∧\n                w ∈ b.windows ∧\n                  CaseLaw2.Cert.usable (b.input c) w = true ∧ CaseLaw2.Cert.quoteAt (b.input c) w = true) ∧\n      (0 < b.oDate ∧ 0 < b.wDate ∧ b.oDate ≤ b.wDate) ∧\n        CaseLaw2.Cert.hasSub (CaseLaw2.Cert.norm b.quote) \";\" = false ∧\n          (∃ m,\n              c.citeIndex = some m ∧\n                ∃ p1 e p2 pO,\n                  (∃ s,\n                      s <:+ CaseLaw2.Cert.bridgeAlnum b ∧\n                        CaseLaw2.Cert.headPos s = some p1 ∧\n                          ∃ L, L ∈ b.lens ∧ CaseLaw2.Cert.citeOf m s L = some c.target ∧ CaseLaw2.Cert.keyEnd s L = e) ∧\n                    p1 < p2 ∧\n                      CaseLaw2.Cert.cueHere c.kind (List.drop p2 (CaseLaw2.Cert.bridgeText b)) = true ∧\n                        (∀ (s : List (Char × Nat)),\n                            s <:+ CaseLaw2.Cert.bridgeAlnum b →\n                              ∀ (p : Nat),\n                                CaseLaw2.Cert.headPos s = some p →\n                                  e ≤ p → p < p2 → ∀ (L : Nat), L ∈ b.lens → CaseLaw2.Cert.citeOf m s L = none) ∧\n                          p2 < pO ∧\n                            ∃ s,\n                              s <:+ CaseLaw2.Cert.bridgeAlnum b ∧\n                                CaseLaw2.Cert.headPos s = some pO ∧\n                                  ∃ L, L ∈ b.lens ∧ CaseLaw2.Cert.citeOf m s L = some b.actor) ∧\n            (CaseLaw2.Cert.checkClaimedWith CaseLaw2.Cert.orderHeadOk CaseLaw2.Cert.claimCueOk h\n                    { kind := c.kind, textSha := c.textSha, start := c.start, stop := c.stop, quote := c.quote,\n                      evidence := c.evidence, part := c.part, shas := c.shas, windows := c.windows,\n                      ordered := c.ordered, authority := c.authority, selfText := true, hashRequired := c.hashRequired,\n                      target := c.target, citeIndex := c.citeIndex, mode := c.mode }).admitted =\n                true ∧\n              CaseLaw2.Cert.checkBridge c b h =\n                CaseLaw2.Cert.checkClaimedWith CaseLaw2.Cert.orderHeadOk CaseLaw2.Cert.claimCueOk h\n                  { kind := c.kind, textSha := c.textSha, start := c.start, stop := c.stop, quote := c.quote,\n                    evidence := c.evidence, part := c.part, shas := c.shas, windows := c.windows, ordered := c.ordered,\n                    authority := c.authority, selfText := true, hashRequired := c.hashRequired, target := c.target,\n                    citeIndex := c.citeIndex, mode := c.mode }",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.checkAnchored_admitted_iff",
