  "statement": "CaseLaw2.Cert.orderHead_no_claim : ∀ (c : CaseLaw2.Cert.Input) (a? : Option CaseLaw2.Cert.Anchor)\n  (h : CaseLaw2.Cert.HClaims),\n  h.orderHead = false → c.part = \"headmatter\" → (CaseLaw2.Cert.checkHistory7 c a? h).admitted = false",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.orderHead_sound",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**orderHead**: an admitted history row whose quote is head matter has the `orderHead` claim, a Supreme Court acting decision dated on or after `orderHeadFrom` (20130101), a listed kind, an order-line cue of its kind, and at most `orderHeadMaxLen` (400) characters.",
  "statement": "CaseLaw2.Cert.orderHead_sound : ∀ (c : CaseLaw2.Cert.Input) (a? : Option CaseLaw2.Cert.Anchor)\n  (h : CaseLaw2.Cert.HClaims),\n  (CaseLaw2.Cert.checkHistory7 c a? h).admitted = true →\n    c.part = \"headmatter\" →\n      h.orderHead = true ∧\n        h.scotus = true ∧\n          CaseLaw2.Cert.orderHeadFrom ≤ h.date ∧\n            CaseLaw2.Cert.orderHeadKind c.kind = true ∧\n              CaseLaw2.Cert.orderLineCue c = true ∧ c.quote.length ≤ CaseLaw2.Cert.orderHeadMaxLen",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.partZone_sound",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**Zone soundness**: an admitted row whose node has zones has its main quote inside a zone of the row's part and every joined quote inside a zone of its own part, and the round-8 verdict admits and is the verdict.",
  "statement": "CaseLaw2.Cert.partZone_sound : ∀ (zs : List CaseLaw2.Cert.Zone) (c : CaseLaw2.Cert.Input)\n  (js : List CaseLaw2.Cert.Joined) (r : CaseLaw2.Cert.Result),\n  zs ≠ [] →\n    (CaseLaw2.Cert.zoneThen zs c js r).admitted = true →\n      r.admitted = true ∧\n        CaseLaw2.Cert.zoneThen zs c js r = r ∧\n          (∃ z, z ∈ zs ∧ z.start ≤ c.start ∧ c.stop ≤ z.stop ∧ z.part = c.part) ∧\n            ∀ (j : CaseLaw2.Cert.Joined), j ∈ js → ∃ z, z ∈ zs ∧ z.start ≤ j.start ∧ j.stop ≤ z.stop ∧ z.part = j.part",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.partZone_sound_witness",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "Zone soundness on a witness row: the round-8 witness verdict admits and is the verdict, and the main quote lies inside a zone of the row's part.",
  "statement": "CaseLaw2.Cert.partZone_sound_witness : ∀ (zs : List CaseLaw2.Cert.Zone) (c : CaseLaw2.Cert.Input)\n  (v : CaseLaw2.Cert.RResult),\n  zs ≠ [] →\n    (CaseLaw2.Cert.zoneR zs c v).admitted = true →\n      v.admitted = true ∧\n        CaseLaw2.Cert.zoneR zs c v = v ∧ ∃ z, z ∈ zs ∧ z.start ≤ c.start ∧ c.stop ≤ z.stop ∧ z.part = c.part",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.partZone_unique",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**Zone uniqueness**: in non-overlapping zones at most one zone contains a non-empty quote.",
  "statement": "CaseLaw2.Cert.partZone_unique : ∀ (zs : List CaseLaw2.Cert.Zone),\n  CaseLaw2.Cert.noOverlap zs = true →\n    ∀ (s e : Nat),\n      s < e →\n        ∀ (z1 z2 : CaseLaw2.Cert.Zone),\n          z1 ∈ zs → z2 ∈ zs → z1.start ≤ s ∧ e ≤ z1.stop → z2.start ≤ s ∧ e ≤ z2.stop → z1 = z2",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.quoteOk_window",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "A quote accepted by `quoteOk` sits in a usable window of the input's windows.",
  "statement": "CaseLaw2.Cert.quoteOk_window : ∀ (c : CaseLaw2.Cert.Input),\n  CaseLaw2.Cert.quoteOk c = true →\n    ∃ w,\n      CaseLaw2.Cert.coveringWindow c = some w ∧\n        w ∈ c.windows ∧ CaseLaw2.Cert.usable c w = true ∧ CaseLaw2.Cert.quoteAt c w = true",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.reasonTie_spec",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "",
  "statement": "CaseLaw2.Cert.reasonTie_spec : ∀ (c : CaseLaw2.Cert.Input) (r : CaseLaw2.Cert.Remand) (q : String),\n  CaseLaw2.Cert.reasonTie c r q = true →\n    ∃ o,\n      CaseLaw2.Cert.spanText c r.oSha r.oWindows r.oStart r.oStop CaseLaw2.Cert.remandOrderSpanMax = some o ∧\n        CaseLaw2.Cert.remandOrderCues.any (CaseLaw2.Cert.hasSub o.toLower) = true ∧\n          CaseLaw2.Cert.remandTieMin ≤ (CaseLaw2.Cert.compact r.tie).length ∧\n            CaseLaw2.Cert.hasSub (CaseLaw2.Cert.compact o) (CaseLaw2.Cert.compact r.tie) = true ∧\n              CaseLaw2.Cert.hasSub (CaseLaw2.Cert.compact q) (CaseLaw2.Cert.compact r.tie) = true",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.recogOf_isSome",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "An event carries a recognition only when the recognised check passed.",
  "statement": "CaseLaw2.Cert.recogOf_isSome : ∀ (v : CaseLaw2.Cert.RResult) (witness date : Nat),\n  (CaseLaw2.Cert.recogOf v witness date).isSome = v.isRecognised",
