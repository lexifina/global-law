 },
 {
  "name": "CaseLaw2.Cert.remandBridge_sound",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**Remand bridge soundness** (DESIGN10 §4, D10-5, D10-7): an admitted row with a line has an admitted round-9 verdict (which is the verdict); B and the target share the court; the target is before the order, B from the order to `remandDaysMax` days after it (three calendar dates); the compact docket token (≥ 4 characters, a digit) is in a span of B's text and in a span of the target's text; B's quote holds \"supreme court\" and a remand cue, and a tie to the order: a key of the order, the order's date as printed, or a reason case named after \"in light of\" in a span of the order's text and in B's quote.",
  "statement": "CaseLaw2.Cert.remandBridge_sound : ∀ (r : CaseLaw2.Cert.Remand) (zs : List CaseLaw2.Cert.Zone) (c : CaseLaw2.Cert.Input)\n  (a? : Option CaseLaw2.Cert.Anchor) (b? : Option CaseLaw2.Cert.Bridge) (h : CaseLaw2.Cert.HClaims),\n  (CaseLaw2.Cert.checkHistory10 (some r) zs c a? b? h).admitted = true →\n    (CaseLaw2.Cert.checkHistory9J zs c a? b? h).admitted = true ∧\n      CaseLaw2.Cert.checkHistory10 (some r) zs c a? b? h = CaseLaw2.Cert.checkHistory9J zs c a? b? h ∧\n        r.bCourt.isSome = true ∧\n          r.bCourt = r.tCourt ∧\n            CaseLaw2.Cert.validDate r.oDate = true ∧\n              CaseLaw2.Cert.validDate r.bDate = true ∧\n                CaseLaw2.Cert.validDate r.tDate = true ∧\n                  r.tDate < r.oDate ∧\n                    r.oDate ≤ r.bDate ∧\n                      CaseLaw2.Cert.dayNum r.bDate ≤ CaseLaw2.Cert.dayNum r.oDate + CaseLaw2.Cert.remandDaysMax ∧\n                        4 ≤ (CaseLaw2.Cert.compact r.docket).length ∧\n                          (CaseLaw2.Cert.compact r.docket).any Char.isDigit = true ∧\n                            (∃ s,\n                                CaseLaw2.Cert.spanText c r.bSha r.bWindows r.bdStart r.bdStop\n                                      CaseLaw2.Cert.remandDocketSpanMax =\n                                    some s ∧\n                                  CaseLaw2.Cert.hasSub (CaseLaw2.Cert.compact s) (CaseLaw2.Cert.compact r.docket) =\n                                    true) ∧\n                              (∃ s,\n                                  CaseLaw2.Cert.spanText c r.tSha r.tWindows r.tStart r.tStop\n                                        CaseLaw2.Cert.remandDocketSpanMax =\n                                      some s ∧\n                                    CaseLaw2.Cert.hasSub (CaseLaw2.Cert.compact s) (CaseLaw2.Cert.compact r.docket) =\n                                      true) ∧\n                                ∃ q,\n                                  CaseLaw2.Cert.remandQuote c r = some q ∧\n                                    CaseLaw2.Cert.remandCourtCues.any (CaseLaw2.Cert.hasSub q) = true ∧\n                                      CaseLaw2.Cert.remandCues.any (CaseLaw2.Cert.hasSub q) = true ∧\n                                        (CaseLaw2.Cert.keyTie c r q = true ∨\n                                          (CaseLaw2.Cert.dateForms r.oDate).any (CaseLaw2.Cert.hasSub q) = true ∨\n                                            ∃ o,\n                                              CaseLaw2.Cert.spanText c r.oSha r.oWindows r.oStart r.oStop\n                                                    CaseLaw2.Cert.remandOrderSpanMax =\n                                                  some o ∧\n                                                CaseLaw2.Cert.remandOrderCues.any (CaseLaw2.Cert.hasSub o.toLower) =\n                                                    true ∧\n                                                  CaseLaw2.Cert.remandTieMin ≤ (CaseLaw2.Cert.compact r.tie).length ∧\n                                                    CaseLaw2.Cert.hasSub (CaseLaw2.Cert.compact o)\n                                                          (CaseLaw2.Cert.compact r.tie) =\n                                                        true ∧\n                                                      CaseLaw2.Cert.hasSub (CaseLaw2.Cert.compact q)\n                                                          (CaseLaw2.Cert.compact r.tie) =\n                                                        true)",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.remandFail_none",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**What `remandFail = none` means**: every step holds.",
  "statement": "CaseLaw2.Cert.remandFail_none : ∀ (c : CaseLaw2.Cert.Input) (r : CaseLaw2.Cert.Remand),\n  CaseLaw2.Cert.remandFail c r = none →\n    CaseLaw2.Cert.remandCourtOk r = true ∧\n      CaseLaw2.Cert.remandDateOk r = true ∧\n        CaseLaw2.Cert.remandDocketOk c r = true ∧\n          ∃ q,\n            CaseLaw2.Cert.remandQuote c r = some q ∧\n              CaseLaw2.Cert.remandCueOk q = true ∧ CaseLaw2.Cert.remandTieOk c r q = true",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.remandThen_fail_keeps",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**A failing verdict keeps its reason.**",
  "statement": "CaseLaw2.Cert.remandThen_fail_keeps : ∀ (rm? : Option CaseLaw2.Cert.Remand) (c : CaseLaw2.Cert.Input)\n  (res : CaseLaw2.Cert.Result), res.admitted = false → CaseLaw2.Cert.remandThen rm? c res = res",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.remandThen_some_admitted",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "An admitted verdict after a line: the verdict before it admits and is kept, and every step holds.",
  "statement": "CaseLaw2.Cert.remandThen_some_admitted : ∀ (r : CaseLaw2.Cert.Remand) (c : CaseLaw2.Cert.Input)\n  (res : CaseLaw2.Cert.Result),\n  (CaseLaw2.Cert.remandThen (some r) c res).admitted = true →\n    res.admitted = true ∧ CaseLaw2.Cert.remandFail c r = none ∧ CaseLaw2.Cert.remandThen (some r) c res = res",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.setAside_no_claim",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**No claim, no set aside**: without a `setAside` claim an admitted history row has a cue of its kind.",
  "statement": "CaseLaw2.Cert.setAside_no_claim : ∀ (c : CaseLaw2.Cert.Input) (a? : Option CaseLaw2.Cert.Anchor)\n  (h : CaseLaw2.Cert.HClaims),\n  h.setAside = false → (CaseLaw2.Cert.checkHistory7 c a? h).admitted = true → CaseLaw2.Cert.hasCue c = true",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.setAside_only_vacated",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "**setAside only on vacated rows**: an admitted history row whose quote has no cue of its kind is a `vacated` row with a `setAside` claim and a set-aside phrase.",
  "statement": "CaseLaw2.Cert.setAside_only_vacated : ∀ (c : CaseLaw2.Cert.Input) (a? : Option CaseLaw2.Cert.Anchor)\n  (h : CaseLaw2.Cert.HClaims),\n  (CaseLaw2.Cert.checkHistory7 c a? h).admitted = true →\n    CaseLaw2.Cert.hasCue c = false →\n      h.setAside = true ∧ c.kind = CaseLaw2.Cert.Kind.hist CaseLaw2.HKind.vacated ∧ CaseLaw2.Cert.setAsideCue c = true",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.spanHas_some",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "",
  "statement": "CaseLaw2.Cert.spanHas_some : ∀ (c : CaseLaw2.Cert.Input) (sha : String) (ws : List CaseLaw2.Cert.Window) (s e : Nat)\n  (k : String),\n  CaseLaw2.Cert.spanHas c sha ws s e k = true →\n    ∃ t,\n      CaseLaw2.Cert.spanText c sha ws s e CaseLaw2.Cert.remandDocketSpanMax = some t ∧\n        CaseLaw2.Cert.hasSub (CaseLaw2.Cert.compact t) k = true",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.spanText_some",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "",
  "statement": "CaseLaw2.Cert.spanText_some : ∀ (c : CaseLaw2.Cert.Input) (sha : String) (ws : List CaseLaw2.Cert.Window) (s e n : Nat)\n  (t : String),\n  CaseLaw2.Cert.spanText c sha ws s e n = some t →\n    s < e ∧\n      e - s ≤ n ∧\n        ∃ w,\n          w ∈ ws ∧\n            CaseLaw2.Cert.usable (CaseLaw2.Cert.spanInput c sha ws s e) w = true ∧\n              t = CaseLaw2.Cert.slice (CaseLaw2.Cert.norm w.text) (s - w.start0) (e - s)",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.tbridgeQuote_selfText",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "",
  "statement": "CaseLaw2.Cert.tbridgeQuote_selfText : ∀ (c : CaseLaw2.Cert.Input) (t : CaseLaw2.Cert.TBridge),\n  CaseLaw2.Cert.tbridgeQuote\n      { kind := c.kind, textSha := c.textSha, start := c.start, stop := c.stop, quote := c.quote,\n        evidence := c.evidence, part := c.part, shas := c.shas, windows := c.windows, ordered := c.ordered,\n        authority := c.authority, selfText := true, hashRequired := c.hashRequired, target := c.target,\n        citeIndex := c.citeIndex, mode := c.mode }\n      t =\n    CaseLaw2.Cert.tbridgeQuote c t",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Cert.tbridgeQuote_some",
  "module": "LegalProofs.CaseLaw2.Certificate",
  "doc": "",
  "statement": "CaseLaw2.Cert.tbridgeQuote_some : ∀ (c : CaseLaw2.Cert.Input) (t : CaseLaw2.Cert.TBridge) (q : String),\n  CaseLaw2.Cert.tbridgeQuote c t = some q →\n    ∃ s e w,\n      t.line = some (s, e) ∧\n        s < e ∧\n          e - s ≤ CaseLaw2.Cert.tbridgeQuoteMax ∧\n            w ∈ t.tWindows ∧\n              CaseLaw2.Cert.usable (CaseLaw2.Cert.spanInput c t.tSha t.tWindows s e) w = true ∧\n                q = (CaseLaw2.Cert.slice (CaseLaw2.Cert.norm w.text) (s - w.start0) (e - s)).toLower",
  "axioms": [
