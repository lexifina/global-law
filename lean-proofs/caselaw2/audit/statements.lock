   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.conflict_in_line_ignores_unreaching",
  "module": "LegalProofs.CaseLaw2.Spec.Lines",
  "doc": "The resolver's answer at a court (the conflict test) is unchanged by an overruling that does not reach its line (a decision the Fifth Circuit alone overruled still counts for an Eleventh Circuit conflict).",
  "statement": "CaseLaw2.Spec.conflict_in_line_ignores_unreaching : ∀ (inLine : Nat → Bool) (t : Nat) (f : Bool)\n  (s : Option CaseLaw2.TrialScope) (pre post : List (CaseLaw2.Spec.Held CaseLaw2.Spec.Cand))\n  (h : CaseLaw2.Spec.Held CaseLaw2.Spec.Cand) (e : CaseLaw2.Spec.Effect),\n  CaseLaw2.Spec.Effect.reaches inLine e = false →\n    CaseLaw2.Spec.resolve f s\n        (CaseLaw2.Spec.heldIn inLine t\n          (pre ++ { item := h.item, issue := h.issue, effs := e :: h.effs, binds := h.binds } :: post)) =\n      CaseLaw2.Spec.resolve f s (CaseLaw2.Spec.heldIn inLine t (pre ++ h :: post))",
  "axioms": [
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.contraryBinding_needs_binding",
  "module": "LegalProofs.CaseLaw2.Spec.Findings",
  "doc": "A contrary-binding risk needs a later holding that binds the holder's court and is good law.",
  "statement": "CaseLaw2.Spec.contraryBinding_needs_binding : ∀ (f : CaseLaw2.Spec.ContraryFacts),\n  CaseLaw2.Spec.contraryBinding f = true → f.binds = true ∧ f.later = true ∧ f.contraryGood = true",
  "axioms": [
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.contrib_before_start",
  "module": "LegalProofs.CaseLaw2.Spec.Recognised",
  "doc": "An effect that has not started contributes nothing.",
  "statement": "CaseLaw2.Spec.contrib_before_start : ∀ (e : CaseLaw2.Spec.Effect) (k t u : Nat),\n  t < e.start → e.contrib k t u = CaseLaw2.Spec.Status.good",
