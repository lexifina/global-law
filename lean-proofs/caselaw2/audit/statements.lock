  "doc": "A base whose cases all share one outcome is consistent.",
  "statement": "@CaseLaw2.Spec.Horty.consistent_of_same_outcome : ∀ {Γ : List CaseLaw2.Spec.Horty.FCase} {s : CaseLaw2.Spec.Horty.Side},\n  (∀ (c : CaseLaw2.Spec.Horty.FCase), c ∈ Γ → c.outcome = s) → CaseLaw2.Spec.Horty.consistent Γ = true",
