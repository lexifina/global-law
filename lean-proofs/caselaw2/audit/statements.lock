  "statement": "CaseLaw2.Cert.checkCert_sound : ∀ (c : CaseLaw2.Cert.Input),\n  (CaseLaw2.Cert.check c).admitted = true →\n    CaseLaw2.Cert.shaOk c = true ∧\n      (∃ w, CaseLaw2.Cert.coveringWindow c = some w ∧ CaseLaw2.Cert.quoteAt c w = true) ∧\n        CaseLaw2.Cert.hasCue c = true ∧\n          CaseLaw2.Cert.disqualified c = false ∧\n            CaseLaw2.Cert.resolves c = true ∧\n              CaseLaw2.Cert.partOk c = true ∧\n                c.ordered = true ∧\n                  (CaseLaw2.Cert.check c = CaseLaw2.Cert.Result.ok → c.authority = some true) ∧\n                    (CaseLaw2.Cert.check c = CaseLaw2.Cert.Result.okUnverifiedBy → c.authority = none)",
