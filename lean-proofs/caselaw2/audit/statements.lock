  "module": "LegalProofs.CaseLaw2.Exec.Verdicts",
  "doc": "**Old circuits**: an admitted claimed row that the round-7 authority refuses satisfies one listed triple, with the acting court a federal court of appeals, the target a federal district or bankruptcy court, and date(B) known and before the triple's date.",
  "statement": "CaseLaw2.Exec.oldCircuit_sound : ∀ (L : CaseLaw2.Lookups) (b x : CaseLaw2.Decision),\n  CaseLaw2.Exec.histPower8 L b x true = some true →\n    CaseLaw2.Exec.histPower L b x ≠ some true →\n      CaseLaw2.Exec.histPower L b x = some false ∧\n        ∃ B X,\n          L.epochAt b.court b.date = some B ∧\n            L.epochAt x.court x.date = some X ∧\n              B.system = 0 ∧\n                B.tier = CaseLaw2.Tier.appellate ∧\n                  X.system = 0 ∧\n                    (X.tier = CaseLaw2.Tier.trial ∨ X.tier = CaseLaw2.Tier.special) ∧\n                      ∃ t,\n                        t ∈ CaseLaw2.Cert.oldCircuitRules ∧\n                          B.circuit = t.fst ∧ X.circuit = t.snd.fst ∧ 0 < b.date ∧ b.date < t.snd.snd",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
