 {
  "name": "CaseLaw2.Examples.recognised_effect_needs_power",
  "module": "LegalProofs.CaseLaw2.Examples",
  "doc": "**No recognised effect without the checker's verdict and W's power**: the runner sets an event's recognition with `Cert.recogOf` from the recognised check; when W lacks power over X the check never recognises the row (`Cert.checkRecognised_needs_power`), the event carries no recognition and has no recognised effect. With `witness_row_no_effect`, such a row has no status effect at all.",
  "statement": "CaseLaw2.Examples.recognised_effect_needs_power : ∀ (c : CaseLaw2.Cert.Input) (w : CaseLaw2.Cert.Witness),\n  w.power = false →\n    ∀ (wn d : Nat) (byHist wHist : List CaseLaw2.HEvent) (tr : CaseLaw2.TEvent),\n      tr.recog = CaseLaw2.Cert.recogOf (CaseLaw2.Cert.checkRecognised c w) wn d →\n        CaseLaw2.Spec.recogEffects byHist wHist tr = []",
