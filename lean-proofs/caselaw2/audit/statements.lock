 {
  "name": "CaseLaw2.Spec.adoptedSameTier_power",
  "module": "LegalProofs.CaseLaw2.Spec.AuthorityThms",
  "doc": "**An adopter of the target's dated tier holds the adopted decision as its own**: an adopter that is not a court of last resort, not the target's court, not above the target in its system, and of the target's dated tier or above, under a soft or no horizontal rule, has power (*In re Estate of Johnson*, 240 N.J. Super. 134 (App. Div. 1990)).",
  "statement": "CaseLaw2.Spec.adoptedSameTier_power : ∀ (L : CaseLaw2.Lookups) (b x : CaseLaw2.Decision) (dom? : Option CaseLaw2.Domain)\n  (B X : CaseLaw2.CourtEpoch),\n  L.epochAt b.court b.date = some B →\n    L.epochAt x.court x.date = some X →\n      x.date ≤ b.date →\n        B.scotus = false →\n          B.tier ≠ CaseLaw2.Tier.last →\n            B.court ≠ X.court →\n              ¬(B.system = X.system ∧ X.tier.rank < B.tier.rank) →\n                ((CaseLaw2.Spec.adoptionsOf L x).any fun x => x.adopter == b.court) = true →\n                  X.tier.rank ≤ B.tier.rank →\n                    L.rules.horizontal B.court B.system x.date = some CaseLaw2.HRule.none ∨\n                        L.rules.horizontal B.court B.system x.date = some CaseLaw2.HRule.soft →\n                      CaseLaw2.Spec.canChangeStatus L b x dom? = some (true, CaseLaw2.RuleId.sameCourtSoft)",
  "axioms": [
   "Classical.choice",
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.adopted_lowerTier_noPower",
  "module": "LegalProofs.CaseLaw2.Spec.AuthorityThms",
  "doc": "**No power below the target's dated tier**: a court ranked below the target's dated tier (the Supreme Court of the United States aside) has no power over it, whatever the adoption rows say (the Appellate Division under the Court of Errors and Appeals; Kentucky 1976).",
  "statement": "CaseLaw2.Spec.adopted_lowerTier_noPower : ∀ (L : CaseLaw2.Lookups) (b x : CaseLaw2.Decision)\n  (dom? : Option CaseLaw2.Domain) (B X : CaseLaw2.CourtEpoch),\n  L.epochAt b.court b.date = some B →\n    L.epochAt x.court x.date = some X →\n      B.scotus = false →\n        B.tier.rank < X.tier.rank → Option.map (fun x => x.fst) (CaseLaw2.Spec.canChangeStatus L b x dom?) = some false",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.adopted_status_per_heir",
  "module": "LegalProofs.CaseLaw2.Spec.Status",
  "doc": "**Status after an adoption cut-off is per heir** (hunt H4; *Bonner*): an overruling that does not reach an adopter leaves the status unchanged for every court in that adopter's line (and in no reached adopter's line). The Fifth Circuit's 1983 en banc overruling of a pre-split decision does not change it in the Eleventh.",
  "statement": "CaseLaw2.Spec.adopted_status_per_heir : ∀ (inLine : Nat → Bool) (e : CaseLaw2.Spec.Effect)\n  (l : List CaseLaw2.Spec.Effect) (k t u : Nat) (orig : Bool) (reached unreached : List Nat) (a : Nat),\n  e.reach = CaseLaw2.Spec.Reach.lines orig reached unreached →\n    reached.any inLine = false →\n      a ∈ unreached →\n        inLine a = true → CaseLaw2.Spec.statusFor inLine (e :: l) k t u = CaseLaw2.Spec.statusFor inLine l k t u",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.any_congr_mem",
  "module": "LegalProofs.CaseLaw2.Spec.Lines",
  "doc": "",
  "statement": "@CaseLaw2.Spec.any_congr_mem : ∀ {α : Type} (l : List α) (p q : α → Bool),\n  (∀ (x : α), x ∈ l → p x = q x) → l.any p = l.any q",
  "axioms": [
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.appliesSuperseded_needs_conduct",
  "module": "LegalProofs.CaseLaw2.Spec.Findings",
  "doc": "Hunt H2: a superseded-holding finding needs a known conduct date that the supersession reaches, and a holding-level match; the citing date alone never gives it.",
  "statement": "CaseLaw2.Spec.appliesSuperseded_needs_conduct : ∀ (c : CaseLaw2.Spec.CiteFacts),\n  CaseLaw2.Spec.appliesSupersededHolding c = true →\n    c.statusAtConduct = some (CaseLaw2.Spec.Status.neg CaseLaw2.Spec.Neg.superseded) ∧ c.holdingMatch = true",
  "axioms": [
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.before_start_no_effect",
  "module": "LegalProofs.CaseLaw2.Spec.Status",
  "doc": "Nor does any effect reach a question date before it starts.",
  "statement": "CaseLaw2.Spec.before_start_no_effect : ∀ (e : CaseLaw2.Spec.Effect) (l : List CaseLaw2.Spec.Effect) (k t u : Nat),\n  t < e.start → CaseLaw2.Spec.status (e :: l) k t u = CaseLaw2.Spec.status l k t u",
  "axioms": [
   "Quot.sound",
   "propext"
  ]
 },
 {
  "name": "CaseLaw2.Spec.claimRisk_needs_no_power",
  "module": "LegalProofs.CaseLaw2.Spec.Findings",
  "doc": "A claim is only reported when the treating court is shown to lack power (T2).",
  "statement": "CaseLaw2.Spec.claimRisk_needs_no_power : ∀ (r : CaseLaw2.Spec.TreatRisk),\n  CaseLaw2.Spec.claimRisk r = true → r.power = some false ∧ r.kind.changesStatus = true",
